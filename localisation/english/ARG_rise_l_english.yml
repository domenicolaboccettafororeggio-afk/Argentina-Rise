 ARG_rise_tierra_infrastructure_program_12_desc:0 "The Argentine state is accumulating the technical discipline, logistics doctrine, and construction capacity required to open roads, railways, supply hubs, and infrastructure across the national territory."
 ARG_rise_instituto_naval_de_innovacion_atlantica:0 "Instituto Naval de InnovaciÃ³n AtlÃ¡ntica"
 ARG_rise_instituto_naval_de_innovacion_atlantica_desc:0 "Argentina establishes a dedicated naval engineering facility on the Atlantic frontier, binding ship design, materials science, and special projects into a national maritime research program."
 ARG_rise_centro_de_guerra_terrestre_continental:0 "Centro de Guerra Terrestre Continental"
 ARG_rise_centro_de_guerra_terrestre_continental_desc:0 "A continental land warfare facility will turn doctrine, armored mobility, logistics, and field experimentation into a permanent scientific arm of the Argentine state."
 ARG_rise_programa_aeroespacial_nacional:0 "Programa Aeroespacial Nacional"
 ARG_rise_programa_aeroespacial_nacional_desc:0 "The skies above the republic become a laboratory. Aerodynamics, avionics, missile sciences, and national special projects are gathered into a single strategic program."
 ARG_rise_red_nacional_de_investigacion_tecnologica:0 "Red Nacional de InvestigaciÃ³n TecnolÃ³gica"
 ARG_rise_red_nacional_de_investigacion_tecnologica_desc:0 "Argentina builds a civilian research and development network capable of supporting advanced technologies, industrial science, and the special projects of a rising power."
 ARG_rise_naval_innovation_facility_spirit:0 "InnovaciÃ³n Naval AtlÃ¡ntica"
 ARG_rise_naval_innovation_facility_spirit_desc:0 "A permanent naval research ecosystem is taking shape around engineering facilities, special projects, and the Atlantic ambitions of Argentina."
 ARG_rise_land_warfare_facility_spirit:0 "InvestigaciÃ³n de Guerra Continental"
 ARG_rise_land_warfare_facility_spirit_desc:0 "The army's modernization is increasingly guided by experimentation, doctrine, and technical research rather than improvisation."
 ARG_rise_aeroespacial_facility_spirit:0 "Programa Aeroespacial Nacional"
 ARG_rise_aeroespacial_facility_spirit_desc:0 "Argentina is joining aerospace research, avionics, and special projects into a national system of technological acceleration."
 ARG_rise_civilian_rd_facility_spirit:0 "Red Nacional de InvestigaciÃ³n TecnolÃ³gica"
 ARG_rise_civilian_rd_facility_spirit_desc:0 "Civilian science, industrial research, and advanced development facilities are becoming part of the country's long-term state capacity."
 ARG_rise_sell_reactor_grade_material_limited:0 "Vender Reactor-Grade Material - Exportacion Limitada"
 ARG_rise_sell_reactor_grade_material_limited_desc:0 "El Estado argentino autoriza una exportacion limitada de material nuclear refinado. La operacion reduce el stockpile estrategico nacional y genera una entrada extraordinaria de treasury tras la liquidacion del contrato."
 ARG_rise_sell_reactor_grade_material_strategic:0 "Vender Reactor-Grade Material - Exportacion Estrategica"
 ARG_rise_sell_reactor_grade_material_strategic_desc:0 "Una venta estrategica de Reactor-Grade Material entrega ingresos masivos al Tesoro argentino, aunque sacrifica una reserva nuclear de enorme valor y provoca tensiones internas por su caracter delicado."

 ARG_rise_build_renewable_energy_industry: "Construir Industria de EnergÃ­a Renovable"
 ARG_rise_build_renewable_energy_industry_desc: "El Estado argentino moviliza capital politico, tesoreria y capacidad civil para levantar una nueva infraestructura nacional de energia renovable."
 ARG_rise_build_nuclear_power_plant: "Construir Central Nuclear"
 ARG_rise_build_nuclear_power_plant_desc: "La Argentina financia una nueva central nuclear, una obra costosa pero decisiva para sostener una matriz energetica soberana y de alta densidad."
 ARG_rise_build_grand_hydroelectric_dam: "Construir Gran Represa HidroelÃ©ctrica"
 ARG_rise_build_grand_hydroelectric_dam_desc: "Un proyecto hidroelectrico monumental transforma el territorio argentino en fuente de potencia nacional permanente."

 ARG_rise_bono_de_soberania_nacional:0 "Bono de Soberania Nacional"
 ARG_rise_bono_de_soberania_nacional_desc:0 "Una emision masiva de deuda para sostener megaprojectos energeticos, industriales y estrategicos. Compra tiempo historico para la Argentina, pero compromete severamente el futuro financiero del Estado."
 ARG_rise_bond_redistribution_sovereignty:0 "Soberania Financiera Redistribuida"
 ARG_rise_bond_redistribution_sovereignty_desc:0 "El pago de un vencimiento gigantesco devuelve capital a bancos, hogares, fondos e industrias nacionales. El Tesoro absorbe el golpe, pero el mercado interno recibe una ola temporal de liquidez productiva."
 ARG_rise_proyecto_horizonte_austral:0 "Proyecto Horizonte Austral"
 ARG_rise_proyecto_horizonte_austral_desc:0 "Argentina transforms aerospace ambition into a state program: civilian research facilities, orbital science, artificial intelligence and national special projects converge under a single southern horizon."
 ARG_rise_satelites_del_plata:0 "SatÃ©lites del Plata"
 ARG_rise_satelites_del_plata_desc:0 "The Plata basin will no longer look only toward the river and the sea. A national satellite program begins to map, connect and observe the Argentine territory from orbit."
 ARG_rise_conae_del_futuro:0 "CONAE del Futuro"
 ARG_rise_conae_del_futuro_desc:0 "The national space agency is reorganized as a technocratic instrument of scientific planning, industrial coordination and advanced civilian research."
 ARG_rise_motores_para_el_vacio:0 "Motores para el VacÃ­o"
 ARG_rise_motores_para_el_vacio_desc:0 "Argentina develops the launch infrastructure and propulsion expertise required to place national systems beyond the atmosphere without turning the program into a strategic missile doctrine."
 ARG_rise_observacion_orbital_nacional:0 "ObservaciÃ³n Orbital Nacional"
 ARG_rise_observacion_orbital_nacional_desc:0 "Orbital imaging, earth observation and national mapping systems give the Argentine state a new scientific eye over agriculture, infrastructure, borders and resources."
 ARG_rise_ingenieria_aeroespacial_argentina:0 "IngenierÃ­a Aeroespacial Argentina"
 ARG_rise_ingenieria_aeroespacial_argentina_desc:0 "Aerodynamics, avionics, drones and aerospace materials are gathered into a permanent engineering ecosystem capable of supporting civilian and strategic projects alike."
 ARG_rise_el_cielo_tecnocratico:0 "El Cielo TecnocrÃ¡tico"
 ARG_rise_el_cielo_tecnocratico_desc:0 "The Argentine state binds laboratories, facilities, satellites, orbital launch infrastructure and aerospace engineering into a single technocratic architecture of national ascent."
 ARG_rise_space_horizon_austral_spirit:0 "Horizonte Austral"
 ARG_rise_space_horizon_austral_spirit_desc:0 "Argentina's aerospace ambitions are being organized through civilian research facilities, special project laboratories and a state-led scientific horizon."
 ARG_rise_conae_del_futuro_spirit:0 "CONAE del Futuro"
 ARG_rise_conae_del_futuro_spirit_desc:0 "The national space agency is increasingly capable of coordinating special projects, artificial intelligence applications and civilian research planning."
 ARG_rise_ingenieria_aeroespacial_spirit:0 "IngenierÃ­a Aeroespacial Argentina"
 ARG_rise_ingenieria_aeroespacial_spirit_desc:0 "Aerospace engineering facilities accelerate experimentation, avionics, drone systems and advanced special projects."
 ARG_rise_cielo_tecnocratico_spirit:0 "El Cielo TecnocrÃ¡tico"
 ARG_rise_cielo_tecnocratico_spirit_desc:0 "Argentina's scientific institutions now look upward with discipline: orbit, aerospace engineering and special projects become pillars of national state capacity."
 ARG_rise_programa_nacional_de_misiles_guiados:0 "Programa Nacional de Misiles Guiados"
 ARG_rise_programa_nacional_de_misiles_guiados_desc:0 "The aerospace state turns toward precision strike. Argentina begins a guided missile program built around avionics facilities, special projects, terminal guidance and disciplined strategic industry."
 ARG_rise_sistemas_de_navegacion_terminal:0 "Sistemas de NavegaciÃ³n Terminal"
 ARG_rise_sistemas_de_navegacion_terminal_desc:0 "Precision is not born from explosives, but from guidance. Argentine engineers refine sensors, control systems and terminal navigation for modern cruise and strike platforms."
 ARG_rise_plataformas_de_ataque_estrategico:0 "Plataformas de Ataque EstratÃ©gico"
 ARG_rise_plataformas_de_ataque_estrategico_desc:0 "Launch infrastructure and strategic delivery platforms give Argentina the industrial depth required to project force without surrendering the program to improvisation."
 ARG_rise_integracion_nuclear_tactica:0 "IntegraciÃ³n Nuclear TÃ¡ctica"
 ARG_rise_integracion_nuclear_tactica_desc:0 "Nuclear research facilities begin studying delivery integration, safety architecture and strategic compatibility. The program prepares doctrine and technology, not warheads."
 ARG_rise_doctrina_de_precision_austral:0 "Doctrina de PrecisiÃ³n Austral"
 ARG_rise_doctrina_de_precision_austral_desc:0 "The Argentine state formulates a doctrine of precise, limited and technologically disciplined strike systems, linking drones, cruise missiles and aerospace command networks."
 ARG_rise_alcance_continental:0 "Alcance Continental"
 ARG_rise_alcance_continental_desc:0 "Range changes geography. New rocket infrastructure and ballistic research prepare Argentina for a continental deterrent without yet crossing into strategic escalation."
 ARG_rise_la_lanza_del_sur:0 "La Lanza del Sur"
 ARG_rise_la_lanza_del_sur_desc:0 "The southern spear is not a weapon alone, but a system: facilities, guidance, launch sites, aerospace science and nuclear integration disciplined under one strategic horizon."
 ARG_rise_programa_misiles_guiados_spirit:0 "Programa de Misiles Guiados"
 ARG_rise_programa_misiles_guiados_spirit_desc:0 "Argentina is building the scientific and industrial base for guided missile development through aerospace facilities and special projects."
