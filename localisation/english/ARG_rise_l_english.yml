 ARG_rise_nuevo_triunfo_tooltip_req:0 "El Nuevo Triunfo ha sido elegido"
 ARG_rise.4.t:0 "El Destino de la Reconstruccion"
 ARG_rise.4.d:0 "The Pampas Engine has begun to turn. The first wounds of the crisis have not disappeared, but factories, fields and offices are moving again. Argentina now faces a political decision that will define the meaning of reconstruction. One road leads toward El Nuevo Triunfo: discipline, order, national authority and a harder state born from the ashes. The other leads toward El Proyecto Nacional: an active state, social reconstruction, provincial compromise and a renewed democratic-popular project. The age of survival is ending. The age of direction begins."
 ARG_rise.4.a:0 "El Nuevo Triunfo"
 ARG_rise.4.b:0 "El Proyecto Nacional"
 ARG_rise_el_proyecto_nacional:0 "El Proyecto Nacional"
 ARG_rise_el_proyecto_nacional_desc:0 "Tras la reconstruccion economica impulsada por The Pampas Engine, Argentina se encuentra ante una nueva etapa. Ya no se trata solamente de sobrevivir a la crisis, sino de definir el rumbo politico de la nacion.\n\nDiversos sectores reclaman un Estado mas activo, capaz de consolidar la recuperacion, ampliar los derechos sociales y fortalecer el mercado interno. Otros advierten que las viejas estructuras burocraticas podrian reaparecer bajo nuevas formas.\n\nEl futuro de Argentina vuelve a estar en disputa."
 ARG_rise_proyecto_nacional_tooltip_req:0 "El Proyecto Nacional ha sido elegido"
 ARG_rise_la_crisis_de_representacion:0 "La Crisis de Representacion"
 ARG_rise_la_crisis_de_representacion_desc:0 "Los viejos partidos han perdido su legitimidad. La sociedad desconfia de los discursos tradicionales y exige respuestas urgentes."
 ARG_rise_los_gobernadores_del_interior:0 "Los Gobernadores del Interior"
 ARG_rise_los_gobernadores_del_interior_desc:0 "Ante el vacio de poder en la capital, los lideres provinciales emergen como los nuevos actores fundamentales para la estabilizacion del pais."
 ARG_rise_la_coalicion_de_la_emergencia:0 "La Coalicion de la Emergencia"
 ARG_rise_la_coalicion_de_la_emergencia_desc:0 "Sindicatos, movimientos sociales y sectores productivos acuerdan un alto el fuego temporal para evitar el colapso total de la Nacion."
 ARG_rise_el_pacto_social_del_2003:0 "El Pacto Social del 2003"
 ARG_rise_el_pacto_social_del_2003_desc:0 "El Estado interviene para asegurar la paz social, combinando asistencia de emergencia con una firme voluntad de orden."
 ARG_rise.5.t:0 "El PaÃ­s de las Ruinas / The Nation of Ruins"
 ARG_rise.5.d:0 "Argentina ha sobrevivido a la tormenta, pero no ha salido indemne. Las instituciones han perdido credibilidad, la economÃ­a sigue marcada por la crisis y millones de ciudadanos ya no confÃ­an en el futuro. El colapso de 2001 no destruyÃ³ solamente el peso: tambiÃ©n quebrÃ³ la certeza de que el viejo orden podÃ­a seguir gobernando el paÃ­s. Desde las provincias comienza a formarse una nueva generaciÃ³n polÃ­tica convencida de que la reconstrucciÃ³n exige un Estado mÃ¡s presente, un mercado interno mÃ¡s fuerte y una legitimidad democrÃ¡tica renovada.\n\nArgentina survived the storm, but not without scars. Institutions have lost credibility, the economy remains marked by crisis, and millions of citizens no longer trust the future. The collapse of 2001 did not merely destroy the peso: it shattered the belief that the old order could continue governing the country. From the provinces, a new political generation begins to form, convinced that reconstruction requires a stronger state, a stronger domestic market, and renewed democratic legitimacy."
 ARG_rise.5.a:0 "El futuro exige sacrificios. / The future demands sacrifices."
 ARG_rise.6.t:0 "El Presidente del 22% / The President of 22%"
 ARG_rise.6.d:0 "Las elecciones han producido un resultado frÃ¡gil y decisivo al mismo tiempo. El nuevo presidente no llega con una mayorÃ­a arrolladora, sino con una oportunidad. Con poco mÃ¡s del veinte por ciento de los votos y un paÃ­s todavÃ­a traumatizado por la crisis, el gobierno deberÃ¡ construir legitimidad casi desde cero. En la Argentina posterior al colapso, gobernar ya no significa simplemente ganar una elecciÃ³n: significa convencer a una sociedad herida de que todavÃ­a existe un futuro comÃºn.\n\nThe election has produced an outcome both fragile and decisive. The new president does not arrive with an overwhelming majority, but with an opportunity. With barely more than twenty percent of the vote and a country still traumatized by crisis, the government must build legitimacy almost from scratch. In post-collapse Argentina, governing no longer means merely winning an election: it means convincing a wounded society that a common future still exists."
 ARG_rise.6.a:0 "La legitimidad se construye. / Legitimacy is built."
 ARG_rise.7.t:0 "Los SeÃ±ores de las Provincias / The Lords of the Provinces"
 ARG_rise.7.d:0 "En Argentina, el poder no reside solamente en la Casa Rosada. Los gobernadores provinciales controlan territorios, recursos, aparatos administrativos y redes polÃ­ticas indispensables para cualquier proyecto nacional. Sin su apoyo, ningÃºn gobierno puede estabilizar el paÃ­s. El Proyecto Nacional no nace como una orden vertical desde Buenos Aires, sino como un pacto difÃ­cil entre el centro y las provincias, entre la emergencia y la ambiciÃ³n de reconstrucciÃ³n.\n\nIn Argentina, power does not reside solely within the Casa Rosada. Provincial governors control territories, resources, administrative machines, and political networks essential to any national project. Without their support, no government can stabilize the country. The Proyecto Nacional is not born as a vertical command from Buenos Aires, but as a difficult pact between the center and the provinces, between emergency and the ambition of reconstruction."
 ARG_rise.7.a:0 "Hay que gobernar con ellos. / We must govern with them."
 ARG_rise.8.t:0 "El Pacto Social / The Social Pact"
 ARG_rise.8.d:0 "DespuÃ©s de aÃ±os de emergencia, el paÃ­s busca un nuevo equilibrio. El Estado, el trabajo organizado, los movimientos sociales y los sectores productivos intentan construir una fÃ³rmula capaz de sostener el crecimiento sin repetir los errores del pasado. La paz social ya no serÃ¡ considerada un dato natural, sino una construcciÃ³n polÃ­tica permanente. Nadie sabe cuÃ¡nto durarÃ¡ este acuerdo, pero por primera vez desde la crisis el futuro vuelve a parecer posible.\n\nAfter years of emergency, the country seeks a new balance. The state, organized labor, social movements, and productive sectors attempt to build a formula capable of sustaining growth without repeating the mistakes of the past. Social peace will no longer be treated as a natural condition, but as a permanent political construction. No one knows how long this arrangement will last, but for the first time since the crisis, the future appears possible again."
 ARG_rise.8.a:0 "Paz, trabajo y naciÃ³n. / Peace, labor, and nation."

