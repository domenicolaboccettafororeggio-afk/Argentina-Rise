 ARG_rise.10.d:0 "The crisis has consumed the old names of the Republic. After years of default, furious streets, and provisional governments, the Victory Party has managed to turn economic reconstruction into a new form of political legitimacy. NÃ©stor Kirchner, governor of Patagonia and still an outsider to the great salons of Buenos Aires, now enters the Casa Rosada with more wounds to heal than promises to celebrate. He has not received an imperial mandate: he has received a country to hold together."
 ARG_rise.10.a:0 "Let the Proyecto Nacional begin."
 ARG_rise.10.t:0 "Un Gobernador del Sur / A Governor from the South / Un Governatore del Sud"
 ARG_rise.10.d:0 "ESPAÃ‘OL:\nLa crisis ha devorado los viejos nombres de la RepÃºblica. DespuÃ©s de aÃ±os de default, calles furiosas y gobiernos provisionales, el Partido de la Victoria ha logrado transformar la reconstrucciÃ³n econÃ³mica en una nueva legitimidad polÃ­tica. NÃ©stor Kirchner, gobernador de la Patagonia y todavÃ­a ajeno a los grandes salones de Buenos Aires, entra ahora en la Casa Rosada con mÃ¡s heridas que curar que promesas que celebrar. No ha recibido un mandato imperial: ha recibido un paÃ­s que mantener unido.\n\nENGLISH:\nThe crisis has consumed the old names of the Republic. After years of default, furious streets, and provisional governments, the Victory Party has managed to turn economic reconstruction into a new form of political legitimacy. NÃ©stor Kirchner, governor of Patagonia and still an outsider to the great salons of Buenos Aires, now enters the Casa Rosada with more wounds to heal than promises to celebrate. He has not received an imperial mandate: he has received a country to hold together.\n\nITALIANO:\nLa crisi ha divorato i vecchi nomi della Repubblica. Dopo anni di default, piazze furiose e governi provvisori, il Victory Party Ã¨ riuscito a trasformare la ricostruzione economica in una nuova legittimitÃ  politica. NÃ©stor Kirchner, governatore della Patagonia e volto ancora estraneo ai grandi salotti di Buenos Aires, entra ora alla Casa Rosada con piÃ¹ ferite da curare che promesse da celebrare. Non ha ricevuto un mandato imperiale: ha ricevuto un Paese da tenere insieme."
 ARG_rise.10.a:0 "Que comience el Proyecto Nacional. / Let the Proyecto Nacional begin. / Che inizi il Proyecto Nacional."
 ARG_rise.11.t:0 "Las Jornadas de Diciembre / The Days of December / Le Giornate di Dicembre"
 ARG_rise.11.d:0 "ESPAÃ‘OL:\nDiciembre de 2001. El paÃ­s arde. Las calles de Buenos Aires son un campo de batalla de humo y gases lacrimÃ³genos. El helicÃ³ptero presidencial despegando del techo de la Casa Rosada se ha convertido en el sÃ­mbolo de un Estado que se derrumba bajo el peso de su propia deuda. El corralito ha confiscado los ahorros de toda una vida, y la clase media, tradicionalmente pacÃ­fica, golpea cacerolas con furia mientras los sectores populares saquean supermercados para sobrevivir. Treinta y nueve muertos, cinco presidentes en una semana y el default soberano mÃ¡s grande de la historia. Argentina ha tocado fondo.\n\nENGLISH:\nDecember 2001. The country burns. The streets of Buenos Aires are a battlefield of smoke and tear gas. The presidential helicopter taking off from the roof of the Casa Rosada has become the symbol of a State collapsing under the weight of its own debt. The 'corralito' has confiscated lifetime savings, and the traditionally peaceful middle class bangs pots and pans in fury while the popular sectors loot supermarkets to survive. Thirty-nine dead, five presidents in one week, and the largest sovereign default in history. Argentina has hit rock bottom.\n\nITALIANO:\nDicembre 2001. Il paese brucia. Le strade di Buenos Aires sono un campo di battaglia di fumo e gas lacrimogeni. L'elicottero presidenziale che decolla dal tetto della Casa Rosada Ã¨ diventato il simbolo di uno Stato che crolla sotto il peso del proprio debito. Il 'corralito' ha confiscato i risparmi di una vita, e la classe media, tradizionalmente pacifica, batte le pentole con furia mentre i ceti popolari saccheggiano i supermercati per sopravvivere. Trentanove morti, cinque presidenti in una settimana e il piÃ¹ grande default sovrano della storia. L'Argentina ha toccato il fondo."
 ARG_rise.11.a:0 "Que Dios nos ayude. / May God help us. / Che Dio ci aiuti."

 ARG_rise.12.t:0 "Â¡Que se vayan todos! / Out with them all! / Che se ne vadano tutti!"
 ARG_rise.12.d:0 "ESPAÃ‘OL:\nÂ«Â¡Que se vayan todos, que no quede ni uno solo!Â» El cÃ¡ntico resuena en cada esquina, en cada plaza, en cada asamblea barrial. No es sÃ³lo rabia contra un gobierno; es el repudio total a una clase dirigente percibida como corrupta, parasitaria e incapaz. Los partidos tradicionales ven sus sedes apedreadas y sus lÃ­deres no pueden caminar por la calle sin ser insultados. En este vacÃ­o de poder abismal, la polÃ­tica tradicional estÃ¡ muerta, y el paÃ­s se balancea peligrosamente entre la anarquÃ­a y la tentaciÃ³n del autoritarismo.\n\nENGLISH:\nÂ«Que se vayan todos, que no quede ni uno solo!Â» The chant echoes in every corner, every square, every neighborhood assembly. It is not just anger against a government; it is the total repudiation of a ruling class perceived as corrupt, parasitic, and incapable. Traditional parties see their headquarters stoned, and their leaders cannot walk down the street without being insulted. In this abysmal power vacuum, traditional politics is dead, and the country teeters dangerously between anarchy and the temptation of authoritarianism.\n\nITALIANO:\nÂ«Que se vayan todos, che non ne resti uno solo!Â» Il canto risuona in ogni angolo, in ogni piazza, in ogni assemblea di quartiere. Non Ã¨ solo rabbia contro un governo; Ã¨ il ripudio totale di una classe dirigente percepita come corrotta, parassitaria e incapace. I partiti tradizionali vedono le loro sedi prese a sassate e i loro leader non possono camminare per strada senza essere insultati. In questo abissale vuoto di potere, la politica tradizionale Ã¨ morta e il paese oscilla pericolosamente tra l'anarchia e la tentazione dell'autoritarismo."
 ARG_rise.12.a:0 "Un vacÃ­o peligroso. / A dangerous vacuum. / Un vuoto pericoloso."

 ARG_rise.13.t:0 "La Argentina de los Piquetes / The Argentina of Piquetes / L'Argentina dei Piquetes"
 ARG_rise.13.d:0 "ESPAÃ‘OL:\nDonde el Estado ha retrocedido, la sociedad civil ha avanzado por pura necesidad de supervivencia. A lo largo y ancho del paÃ­s, los piqueteros cortan las rutas nacionales exigiendo trabajo y asistencia, las fÃ¡bricas recuperadas son puestas a producir por sus propios obreros, y los clubes del trueque reemplazan al peso argentino, que se ha pulverizado. Esta nueva Argentina marginal y movilizada es ingobernable bajo los viejos paradigmas. Quien quiera gobernar deberÃ¡ entender este nuevo sujeto social.\n\nENGLISH:\nWhere the State has retreated, civil society has advanced out of pure necessity for survival. Across the country, 'piqueteros' block national routes demanding work and assistance, recovered factories are put into production by their own workers, and barter clubs replace the Argentine peso, which has been pulverized. This new marginal and mobilized Argentina is ungovernable under the old paradigms. Whoever wants to govern must understand this new social subject.\n\nITALIANO:\nDove lo Stato Ã¨ arretrato, la societÃ  civile Ã¨ avanzata per pura necessitÃ  di sopravvivenza. In tutto il paese, i 'piqueteros' bloccano le strade nazionali chiedendo lavoro e assistenza, le fabbriche recuperate vengono messe in produzione dai loro stessi operai, e i club del baratto sostituiscono il peso argentino, ormai polverizzato. Questa nuova Argentina marginale e mobilitata Ã¨ ingovernabile secondo i vecchi paradigmi. Chi vorrÃ  governare dovrÃ  capire questo nuovo soggetto sociale."
 ARG_rise.13.a:0 "El hambre no espera. / Hunger does not wait. / La fame non aspetta."

 ARG_rise.14.t:0 "Construir una Nueva MayorÃ­a / Building a New Majority / Costruire una Nuova Maggioranza"
 ARG_rise.14.d:0 "ESPAÃ‘OL:\nDe las cenizas del colapso institucional, una nueva fuerza comienza a articular el caos. Comprendiendo que el viejo justicialismo no basta y que el neoliberalismo ha muerto, un frente transversal empieza a tomar forma. Gobernadores del sur, organismos de derechos humanos, sindicatos disidentes y sectores progresistas convergen en una misma visiÃ³n. No prometen milagros econÃ³micos inmediatos, sino la reconstrucciÃ³n de la autoridad del Estado y la dignidad nacional. La campaÃ±a electoral se acelera, y el Proyecto Nacional ya tiene una base desde la cual disputar el poder.\n\nENGLISH:\nFrom the ashes of institutional collapse, a new force begins to articulate the chaos. Understanding that the old Justicialism is not enough and that neoliberalism is dead, a transversal front begins to take shape. Southern governors, human rights organizations, dissident unions, and progressive sectors converge on the same vision. They do not promise immediate economic miracles, but the reconstruction of State authority and national dignity. The electoral campaign accelerates, and the National Project now has a base from which to contest power.\n\nITALIANO:\nDalle ceneri del collasso istituzionale, una nuova forza inizia ad articolare il caos. Comprendendo che il vecchio giustizialismo non basta e che il neoliberismo Ã¨ morto, un fronte trasversale comincia a prendere forma. Governatori del sud, organizzazioni per i diritti umani, sindacati dissidenti e settori progressisti convergono in una stessa visione. Non promettono miracoli economici immediati, ma la ricostruzione dell'autoritÃ  dello Stato e della dignitÃ  nazionale. La campagna elettorale accelera e il Progetto Nazionale ha ora una base da cui disputare il potere."
 ARG_rise.14.a:0 "Estamos listos. / We are ready. / Siamo pronti."

 ARG_rise_las_jornadas_de_diciembre:0 "Las Jornadas de Diciembre"
 ARG_rise_las_jornadas_de_diciembre_desc:0 "El paÃ­s arde bajo el peso del default. Las protestas masivas en las calles de Buenos Aires marcan el fin de una era institucional."
 ARG_rise_que_se_vayan_todos:0 "Â¡Que se vayan todos!"
 ARG_rise_que_se_vayan_todos_desc:0 "La sociedad ha perdido toda fe en la clase polÃ­tica tradicional. El clamor popular exige una renovaciÃ³n total de las instituciones."
 ARG_rise_la_argentina_de_los_piquetes:0 "La Argentina de los Piquetes"
 ARG_rise_la_argentina_de_los_piquetes_desc:0 "Ante la ausencia del Estado, los movimientos sociales y piqueteros toman el control de las calles y rutas, exigiendo pan y trabajo."
 ARG_rise_construir_una_nueva_mayoria:0 "Construir una Nueva MayorÃ­a"
 ARG_rise_construir_una_nueva_mayoria_desc:0 "Para evitar la desintegraciÃ³n total, es necesario forjar una nueva coaliciÃ³n polÃ­tica transversal que pueda devolver la gobernabilidad al paÃ­s."

 ARG_rise.15.t:0 "Protestas y Cacerolazos / Protests and Cacerolazos / Proteste e Cacerolazos"
 ARG_rise.15.d:0 "ESPAÃ‘OL:\nLas medidas de austeridad no han traÃ­do el prometido alivio. En las calles de Buenos Aires y las principales capitales provinciales, las protestas se multiplican. El sonido metÃ¡lico de los 'cacerolazos' resuena cada noche, mientras los enfrentamientos con la policÃ­a dejan un saldo de heridos y edificios pÃºblicos daÃ±ados. El riesgo de colapso institucional y violencia generalizada aumenta cada dÃ­a, y el gobierno parece incapaz de dar respuestas.\n\nENGLISH:\nThe austerity measures have not brought the promised relief. In the streets of Buenos Aires and the main provincial capitals, protests are multiplying. The metallic sound of 'cacerolazos' echoes every night, while clashes with the police leave injured citizens and damaged public buildings. The risk of institutional collapse and widespread violence increases every day, and the government seems incapable of providing answers.\n\nITALIANO:\nLe misure di austeritÃ  non hanno portato il sollievo promesso. Nelle strade di Buenos Aires e delle principali capitali di provincia, le proteste si moltiplicano. Il suono metallico dei 'cacerolazos' risuona ogni notte, mentre gli scontri con la polizia lasciano feriti ed edificios pÃºblicos danneggiati. Il rischio di collasso istituzionale e violenza diffusa aumenta ogni giorno, e il governo sembra incapace di dare risposte."
 ARG_rise.15.a:0 "La calle estÃ¡ ardiendo. / The street is burning. / La strada brucia."

 ARG_rise.16.t:0 "Una Crisis de RepresentaciÃ³n / A Crisis of Representation / Una Crisi di Rappresentanza"
 ARG_rise.16.d:0 "ESPAÃ‘OL:\nEl tejido democrÃ¡tico se estÃ¡ desgarrando. La poblaciÃ³n ya no confÃ­a en la clase polÃ­tica tradicional, a la que percibe como sorda y cÃ³mplice de la debacle econÃ³mica. Las promesas vacÃ­as de los partidos histÃ³ricos han erosionado cualquier rastro de legitimidad institucional. En medio del descontento generalizado, el espacio para nuevas alternativas comienza a formarse, canalizando la rabia hacia un proyecto polÃ­tico que rompa con el pasado.\n\nENGLISH:\nThe democratic fabric is tearing apart. The population no longer trusts the traditional political class, perceived as deaf and complicit in the economic debacle. The empty promises of historical parties have eroded any trace of institutional legitimacy. Amidst widespread discontent, the space for new alternatives begins to form, channeling the anger towards a political project that breaks with the past.\n\nITALIANO:\nIl tessuto democratico si sta lacerando. La popolazione non confida piÃ¹ nella classe politica tradizionale, percepita come sorda e complice della disfatta economica. Le promesse vuote dei partiti storici hanno eroso ogni traccia di legittimitÃ  istituzionale. In mezzo al malcontento generale, lo spazio per nuove alternative comincia a formarsi, incanalando la rabbia verso un progetto politico che rompa con il passato."
 ARG_rise.16.a:0 "Nadie los escucha. / Nobody listens to them. / Nessuno li ascolta."

 ARG_rise.17.t:0 "El Espejismo de la SalvaciÃ³n / The Mirage of Salvation / L'Illusione della Salvezza"
 ARG_rise.17.d:0 "ESPAÃ‘OL:\nTras largas y opacas negociaciones, el Fondo Monetario Internacional ha aprobado un paquete de asistencia financiera de emergencia para la RepÃºblica. Respaldados por el motor de las exportaciones agrÃ­colas de las Pampas, los mercados internacionales conceden una frÃ¡gil tregua. El fantasma del colapso inmediato retrocede, ofreciendo un respiro que el gobierno presenta como una gran victoria. Sin embargo, en los despachos tÃ©cnicos, la realidad es inocultable: la crisis estructural sigue ahÃ­, y la dependencia financiera se ha profundizado. Nos hemos salvado hoy, pero a un costo que deberemos pagar maÃ±ana.\n\nENGLISH:\nFollowing long and opaque negotiations, the International Monetary Fund has approved an emergency financial assistance package for the Republic. Backed by the engine of agricultural exports from the Pampas, international markets grant a fragile truce. The specter of immediate collapse recedes, offering a respite that the government presents as a major victory. However, in the technical offices, the reality is undeniable: the structural crisis remains, and financial dependence has deepened. We have saved ourselves today, but at a cost we will have to pay tomorrow.\n\nITALIANO:\nDopo lunghe e opache negoziazioni, il Fondo Monetario Internazionale ha approvato un pacchetto di assistenza finanziaria di emergenza per la Repubblica. Sostenuti dal motore delle esportazioni agricole delle Pampas, i mercati internazionali concedono una fragile tregua. Il fantasma del collasso immediato arretra, offrendo un respiro che il governo presenta come una grande vittoria. Tuttavia, negli uffici tecnici, la realtÃ  Ã¨ innegabile: la crisi strutturale Ã¨ ancora lÃ¬, e la dipendenza finanziaria si Ã¨ approfondita. Ci siamo salvati oggi, ma a un costo che dovremo pagare domani."
 ARG_rise.17.a:0 "El reloj vuelve a correr. / The clock is ticking again. / L'orologio ricomincia a scorrere."

 ARG_rise.18.t:0 "Los Tiempos Funestos / The Dismal Times / I Tempi Funesti"
 ARG_rise.18.d:0 "ESPAÃ‘OL:\nEn un mensaje sobrio a la NaciÃ³n, el presidente Fernando de la RÃºa ha reconocido oficialmente las dificultades econÃ³micas que atraviesa la RepÃºblica. Lejos de la desesperaciÃ³n o del triunfalismo, sus palabras han sido medidas y profundamente institucionales. Ha prometido que, aunque la tormenta asome, las instituciones democrÃ¡ticas sabrÃ¡n resistir, apelando a la responsabilidad y el sacrificio de todos los sectores. No hay pÃ¡nico en su voz, sino la seriedad de un lÃ­der que aÃºn cree tener el timÃ³n. Sin embargo, en las calles, los ciudadanos comienzan a sentir que la normalidad tiene los dÃ­as contados. La ceniza empieza a caer.\n\nENGLISH:\nIn a sober message to the Nation, President Fernando de la RÃºa has officially acknowledged the economic difficulties facing the Republic. Far from despair or triumphalism, his words were measured and deeply institutional. He has promised that, although the storm approaches, democratic institutions will endure, appealing to the responsibility and sacrifice of all sectors. There is no panic in his voice, but the seriousness of a leader who still believes he holds the helm. However, on the streets, citizens begin to feel that normalcy's days are numbered. The ash begins to fall.\n\nITALIANO:\nIn un sobrio messaggio alla Nazione, il presidente Fernando de la RÃºa ha riconosciuto ufficialmente le difficoltÃ  economiche che la Repubblica sta attraversando. Lontane dalla disperazione o dal trionfalismo, le sue parole sono state misurate e profondamente istituzionali. Ha promesso che, sebbene la tempesta si avvicini, le istituzioni democratiche sapranno resistere, appellandosi alla responsabilitÃ  e al sacrificio di tutti i settori. Non c'Ã¨ panico nella sua voce, ma la serietÃ  di un leader che crede ancora di avere in mano il timone. Tuttavia, per le strade, i cittadini iniziano a sentire che la normalitÃ  ha i giorni contati. La cenere inizia a cadere."
 ARG_rise.18.a:0 "Confiemos en el Presidente. / Let us trust the President. / Fidiamoci del Presidente."

 ARG_rise.19.t:0 "El Primer Ajuste / The First Adjustment / Il Primo Aggiustamento"
 ARG_rise.19.d:0 "ESPAÃ‘OL:\nLas primeras medidas de austeridad severa han golpeado a la poblaciÃ³n. Con la reducciÃ³n drÃ¡stica del gasto social, miles de familias se encuentran de repente sin red de seguridad. Los sindicatos y los trabajadores estatales han convocado huelgas, paralizando servicios esenciales. La policÃ­a ha sido desplegada para contener las manifestaciones, marcando el inicio de un conflicto civil prolongado.\n\nENGLISH:\nThe first severe austerity measures have hit the population. With the drastic reduction in social spending, thousands of families suddenly find themselves without a safety net. Unions and state workers have called strikes, paralyzing essential services. Police have been deployed to contain the demonstrations, marking the beginning of a prolonged civil conflict.\n\nITALIANO:\nLe prime severe misure di austeritÃ  hanno colpito la popolazione. Con la drastica riduzione della spesa sociale, migliaia di famiglie si trovano improvvisamente senza rete di sicurezza. I sindacati e i lavoratori statali hanno indetto scioperi, paralizzando i servizi essenziali. La polizia Ã¨ stata dispiegata per contenere le manifestazioni, segnando l'inizio di un prolungato conflitto civile."
 ARG_rise.19.a:0 "La tensiÃ³n aumenta. / The tension rises. / La tensione sale."

 ARG_rise.20.t:0 "Rutas Bloqueadas / Blocked Routes / Strade Bloccate"
 ARG_rise.20.d:0 "ESPAÃ‘OL:\nEl movimiento piquetero ha ganado una fuerza imparable. Ante la falta de trabajo y el abandono estatal, los desempleados han optado por la acciÃ³n directa: cortar las principales arterias de transporte del paÃ­s. Las imÃ¡genes de neumÃ¡ticos ardiendo y rutas bloqueadas se transmiten a diario. El gobierno, sin recursos para ofrecer soluciones reales, oscila entre la represiÃ³n ineficaz y la inacciÃ³n.\n\nENGLISH:\nThe piquetero movement has gained unstoppable momentum. Faced with a lack of jobs and state abandonment, the unemployed have opted for direct action: cutting off the country's main transport arteries. Images of burning tires and blocked routes are broadcast daily. The government, lacking resources to offer real solutions, oscillates between ineffective repression and inaction.\n\nITALIANO:\nIl movimento piquetero ha acquisito una forza inarrestabile. Di fronte alla mancanza di lavoro e all'abbandono statale, i disoccupati hanno optato per l'azione diretta: bloccare le principali arterie di trasporto del paese. Le immagini di pneumatici in fiamme e strade bloccate vengono trasmesse quotidianamente. Il governo, senza risorse per offrire soluzioni reali, oscilla tra repressione inefficace e inazione."
 ARG_rise.20.a:0 "El paÃ­s estÃ¡ paralizado. / The country is paralyzed. / Il paese Ã¨ paralizzato."

 ARG_rise.21.t:0 "Un Estado Hueco / A Hollow State / Uno Stato Vuoto"
 ARG_rise.21.d:0 "ESPAÃ‘OL:\nLa ilusiÃ³n de normalidad se ha desmoronado. Las instituciones pÃºblicas siguen existiendo en papel, pero en la prÃ¡ctica son cÃ¡scaras vacÃ­as. Los hospitales carecen de insumos bÃ¡sicos, las escuelas apenas tienen luz y los empleados pÃºblicos sufren meses de atraso salarial. La clase media, alguna vez el orgullo de la naciÃ³n, se desliza rÃ¡pidamente hacia la pobreza, obligada a sobrevivir en una economÃ­a informal y precaria.\n\nENGLISH:\nThe illusion of normalcy has crumbled. Public institutions still exist on paper, but in practice, they are empty shells. Hospitals lack basic supplies, schools barely have electricity, and public employees suffer months of delayed salaries. The middle class, once the pride of the nation, is rapidly sliding into poverty, forced to survive in an informal and precarious economy.\n\nITALIANO:\nL'illusione di normalitÃ  Ã¨ crollata. Le istituzioni pubbliche esistono ancora sulla carta, ma in pratica sono gusci vuoti. Agli ospedali mancano le forniture di base, le scuole hanno a malapena la luce e i dipendenti pubblici subiscono mesi di ritardo salariale. La classe media, un tempo orgoglio della nazione, sta scivolando rapidamente verso la povertÃ , costretta a sopravvivere in un'economia informale e precaria."
 ARG_rise.21.a:0 "Sobrevivimos como podemos. / We survive as we can. / Sopravviviamo come possiamo."

 ARG_rise.22.t:0 "Vendiendo el MaÃ±ana / Selling Tomorrow / Vendendo il Domani"
 ARG_rise.22.d:0 "ESPAÃ‘OL:\nEn un intento desesperado por mantener a flote las finanzas, el gobierno ha puesto en marcha un plan extremo para maximizar las exportaciones. Todo lo que pueda venderse al extranjero, se vende. Sin embargo, esta polÃ­tica equivale a canibalizar la infraestructura nacional. Estamos hipotecando nuestro futuro y agotando nuestras Ãºltimas reservas estratÃ©gicas para pagar las cuentas de hoy. El paÃ­s se apaga.\n\nENGLISH:\nIn a desperate attempt to keep finances afloat, the government has launched an extreme plan to maximize exports. Anything that can be sold abroad is sold. However, this policy amounts to cannibalizing the national infrastructure. We are mortgaging our future and depleting our last strategic reserves to pay today's bills. The country is shutting down.\n\nITALIANO:\nIn un disperato tentativo di mantenere a galla le finanze, il governo ha lanciato un piano estremo per massimizzare le esportazioni. Tutto ciÃ² che puÃ² essere venduto all'estero, viene venduto. Tuttavia, questa politica equivale a cannibalizzare l'infrastruttura nazionale. Stiamo ipotecando il nostro futuro e esaurendo le nostre ultime riserve strategiche per pagare i conti di oggi. Il paese si sta spegnendo."
 ARG_rise.22.a:0 "Ya no queda nada. / There is nothing left. / Non Ã¨ rimasto piÃ¹ niente."

 ARG_rise.23.t:0 "SeÃ±ales en la Ceniza / Signs in the Ash / Segnali nella Cenere"
 ARG_rise.23.d:0 "ESPAÃ‘OL:\nHan pasado unos dÃ­as desde el discurso presidencial. Si bien la calma institucional se mantiene, las seÃ±ales silenciosas de la crisis comienzan a materializarse. Las provincias retienen fondos, los ministerios piden revisiones presupuestarias urgentes y los bancos operan con inusual cautela. Es el primer crujido invisible de la estructura nacional.\n\nENGLISH:\nA few days have passed since the presidential address. While institutional calm is maintained, the silent signs of the crisis begin to materialize. Provinces withhold funds, ministries request urgent budget revisions, and banks operate with unusual caution. It is the first invisible creak of the national structure.\n\nITALIANO:\nSono passati alcuni giorni dal discorso presidenziale. Sebbene la calma istituzionale si mantenga, i segnali silenziosi della crisi iniziano a materializzarsi. Le province trattengono fondi, i ministeri chiedono revisioni urgenti del bilancio e le banche operano con un'insolita cautela. Ãˆ il primo scricchiolio invisibile della struttura nazionale."
 ARG_rise.23.a:0 "Un crujido invisible. / An invisible creak. / Uno scricchiolio invisibile."

 ARG_rise_ultimo_prestamo_spirit:0 "El Ãšltimo PrÃ©stamo / The Last Loan / L'Ultimo Prestito"
 ARG_rise_ultimo_prestamo_spirit_desc:0 "ESPAÃ‘OL:\nEl paÃ­s depende del salvamento financiero condicionado del FMI. La austeridad es severa y los intereses consumen el presupuesto.\n\nENGLISH:\nThe country depends on the IMF's conditioned financial bailout. Austerity is severe and interest payments consume the budget.\n\nITALIANO:\nIl paese dipende dal salvataggio finanziario condizionato del FMI. L'austeritÃ  Ã¨ severa e gli interessi consumano il bilancio."

 ARG_rise.54.t:0 "El Silencio de las Instituciones / The Silence of the Institutions / Il Silenzio delle Istituzioni"
 ARG_rise.54.d:0 "ESPAÃ‘OL:\nFernando de la RÃºa se dirige a la NaciÃ³n en cadena nacional. La transmisiÃ³n de televisiÃ³n parpadea y el audio se corta por momentos. La gente apaga sus televisores o simplemente los ignora; su voz ya no representa autoridad alguna. Ante el evidente vacÃ­o de poder, Â¿cÃ³mo intentaremos responder?\n\nENGLISH:\nFernando de la RÃºa addresses the Nation in a national broadcast. The television transmission flickers and the audio cuts out at times. People turn off their televisions or simply ignore them; his voice no longer represents any authority. Facing an obvious power vacuum, how will we try to respond?\n\nITALIANO:\nFernando de la RÃºa si rivolge alla Nazione a reti unificate. La trasmissione televisiva sfarfalla e l'audio si interrompe a tratti. La gente spegne i televisori o semplicemente li ignora; la sua voce non rappresenta piÃ¹ alcuna autoritÃ . Di fronte a un vuoto di potere evidente, come cercheremo di rispondere?"
 ARG_rise.54.a:0 "Declarar el Estado de Sitio. / Declare a State of Siege. / Dichiarare lo Stato d'Assedio."
 ARG_rise.54.b:0 "Evitar el pÃ¡nico y callar. / Avoid panic and remain silent. / Evitare il panico e tacere."

 ARG_rise.55.t:0 "Desconfianza Bancaria / Bank Distrust / Sfiducia Bancaria"
 ARG_rise.55.d:0 "ESPAÃ‘OL:\nDe manera silenciosa, pero constante, los ciudadanos comienzan a retirar sus ahorros de los bancos y a guardarlos fuera del sistema financiero. Los depÃ³sitos se desvanecen y los bancos empiezan a quedarse sin liquidez.\n\nENGLISH:\nIn a quiet but steady manner, citizens begin to withdraw their savings from banks and store them outside the financial system. Deposits vanish, and banks start running out of liquidity.\n\nITALIANO:\nIn modo silenzioso ma costante, i cittadini iniziano a ritirare i propri risparmi dalle banche e a conservarli al di fuori del sistema finanziario. I depositi svaniscono e le banche iniziano a rimanere senza liquiditÃ ."
 ARG_rise.55.a:0 "La confianza se evapora. / Trust is evaporating. / La fiducia si sta evaporando."

 ARG_rise.56.t:0 "El PÃ¡nico del Corralito / The Corralito Panic / Il Panico del Corralito"
 ARG_rise.56.d:0 "ESPAÃ‘OL:\nEl pÃ¡nico bancario estalla de golpe. Multitudes furiosas y desesperadas se agolpan frente a las puertas cerradas de los bancos exigiendo sus ahorros. Para evitar la quiebra del sistema, el gobierno decreta el congelamiento forzoso de los depÃ³sitos, limitando al extremo el retiro de efectivo.\n\nENGLISH:\nThe bank panic erupts all at once. Furious and desperate crowds gather in front of the locked doors of banks demanding their savings. To prevent the collapse of the system, the government decrees a forced freeze on deposits, extremely limiting cash withdrawals.\n\nITALIANO:\nIl panico bancario esplode all'improvviso. Folle furiose e disperate si accalcano davanti alle porte sbarrate delle banche pretendendo i propri risparmi. Per evitare il collasso del sistema, il governo decreta il congelamento forzoso dei depositi, limitando all'estremo il prelievo di contanti."
 ARG_rise.56.a:0 "Un golpe devastador. / A devastating blow. / Un colpo devastante."

 ARG_rise.57.t:0 "ParÃ¡lisis Administrativa / Administrative Paralysis / Paralisi Amministrativa"
 ARG_rise.57.d:0 "ESPAÃ‘OL:\nLos empleados pÃºblicos dejan de presentarse a trabajar. Con salarios devaluados o impagos, los ministerios, las escuelas y los municipios se convierten en cÃ¡scaras vacÃ­as. El Estado federal pierde la capacidad de gestionar el dÃ­a a dÃ­a.\n\nENGLISH:\nPublic employees stop showing up for work. With devalued or unpaid salaries, ministries, schools, and municipalities become empty shells. The federal State loses the ability to manage day-to-day operations.\n\nITALIANO:\nI dipendenti pubblici smettono di presentarsi al lavoro. Con stipendi svalutati o non pagati, i ministeri, le scuole e i municipi si trasformano in gusci vuoti. Lo Stato federale perde la capacitÃ  di gestire le attivitÃ  quotidiane."
 ARG_rise.57.a:0 "Las oficinas estÃ¡n vacÃ­as. / The offices are empty. / Gli uffici sono vuoti."

 ARG_rise.58.t:0 "Provincias AutÃ³nomas / Autonomous Provinces / Province Autonome"
 ARG_rise.58.d:0 "ESPAÃ‘OL:\nLos gobernadores provinciales rompen con el poder central. Se niegan a enviar la recaudaciÃ³n fiscal a Buenos Aires y comienzan a emitir sus propias monedas de emergencia (Patacones y Lecop) para pagar a sus administraciones locales, fragmentando la unidad del Estado.\n\nENGLISH:\nProvincial governors break with the central power. They refuse to send tax revenues to Buenos Aires and begin issuing their own emergency currencies (Patacones and Lecop) to pay their local administrations, fragmenting the unity of the State.\n\nITALIANO:\nI governatori provinciali rompono con il potere centrale. Si rifiutano di inviare le entrate fiscali a Buenos Aires e iniziano a emettere le proprie valute d'emergenza (Patacones e Lecop) per pagare le amministrazioni locali, frammentando l'unitÃ  dello Stato."
 ARG_rise.58.a:0 "El Estado se fragmenta. / The State is fragmenting. / Lo Stato si sta frammentando."

 ARG_rise.59.t:0 "Brazos CaÃ­dos / Hesitant Security Forces / Esitazione delle Forze di Sicurezza"
 ARG_rise.59.d:0 "ESPAÃ‘OL:\nLas fuerzas de seguridad y la gendarmerÃ­a dudan. Ante las Ã³rdenes de reprimir las manifestaciones de jubilados y familias en las plazas, los comandantes locales deciden bajar las armas y negarse a actuar. El Estado pierde el control del monopolio de la fuerza.\n\nENGLISH:\nSecurity forces and the gendarmerie hesitate. Faced with orders to suppress demonstrations of retirees and families in the squares, local commanders decide to lower their weapons and refuse to act. The State loses control of the monopoly of force.\n\nITALIANO:\nLe forze di sicurezza e la gendarmeria esitano. Di fronte agli ordini di reprimere le manifestazioni di pensionati e famiglie nelle piazze, i comandanti locali decidono di abbassare le armi e rifiutano di agire. Lo Stato perde il controllo del monopolio della forza."
 ARG_rise.59.a:0 "Ya no hay quien nos defienda. / There is no one left to defend us. / Non c'Ã¨ piÃ¹ nessuno a difenderci."

 ARG_rise.60.t:0 "Los Libros Abiertos / Open Books / I Libri Aperti"
 ARG_rise.60.d:0 "ESPAÃ‘OL:\nUn informe reservado del Banco Central revela la verdad ineludible: las reservas de divisas estÃ¡n prÃ¡cticamente agotadas y el boom agrÃ­cola ha sido consumido por el servicio de la deuda. El Palacio de Hacienda se enfrenta a la realidad. O aceptamos la deshonra soberana del default ahora mismo, o firmamos un acuerdo de rescate de Ãºltimo minuto con el Fondo Monetario Internacional que impondrÃ¡ una dura tutela externa y altas tasas sobre nuestro futuro.\n\nENGLISH:\nA classified Central Bank report reveals the inescapable truth: foreign reserves are virtually exhausted and the agricultural boom has been consumed by debt servicing. The Ministry of Economy faces reality. Either we accept the sovereign disgrace of default right now, or we sign a last-minute rescue agreement with the International Monetary Fund that will impose harsh external tutelage and high rates on our future.\n\nITALIANO:\nUn rapporto riservato della Banca Centrale rivela l'ineludibile veritÃ : le riserve di valuta estera sono virtualmente esaurite e il boom agricolo Ã¨ stato consumato dal servicio del debito. Il Ministero dell'Economia affronta la realtÃ . O accettiamo il disonore sovrano del default proprio ora, o firmiamo un accordo di salvataggio dell'ultimo minuto con il Fondo Monetario Internazionale che imporrÃ  una dura tutela esterna e alti tassi sul nostro futuro."
 ARG_rise.60.a:0 "Declarar el Default. / Declare Default. / Dichiarare il Default."
 ARG_rise.60.b:0 "Aceptar el rescate del FMI. / Accept the IMF bailout. / Accettare il salvataggio del FMI."

 ARG_rise.61.t:0 "El Destino de la ReconstrucciÃ³n / The Fate of Reconstruction / Il Destino della Ricostruzione"
 ARG_rise.61.d:0 "ESPAÃ‘OL:\nLas cartas estÃ¡n sobre la mesa. Con el default formalizado o bajo la estricta tutela del Fondo, la ilusiÃ³n de la normalidad institucional de los aÃ±os noventa ha expirado definitivamente. El viejo orden yace en ruinas, y un profundo sentimiento de cambio impregna la sociedad. El futuro de la reconstrucciÃ³n argentina estÃ¡ en juego, y nuevas fuerzas polÃ­ticas ya se postulan para tomar el mando del destino nacional.\n\nENGLISH:\nThe cards are on the table. With the default finalized or under the strict tutelage of the Fund, the illusion of nineties institutional normalcy has definitively expired. The old order lies in ruins, and a deep sense of change permeates society. The future of Argentine reconstruction is at stake, and new political forces are already positioning themselves to take control of the national destiny.\n\nITALIANO:\nLe carte sono sul tavolo. Con il default formalizzato o sotto la stretta tutela del Fondo, l'illusione della normalitÃ  istituzionale degli anni novanta Ã¨ definitivamente scaduta. Il vecchio ordine giace in rovine, e un profondo senso di cambiamento permea la societÃ . Il futuro della ricostruzione argentina Ã¨ in gioco, e nuove forze politiche si stanno giÃ  posizionando per assumere la guida del destino nazionale."
 ARG_rise_la_cuestion_de_cuba:0 "La Cuestión de Cuba"
 ARG_rise_la_cuestion_de_cuba_desc:0 ""
 ARG_rise_la_liberacion_de_cuba:0 "Liberación de Cuba"
 ARG_rise_la_liberacion_de_cuba_desc:0 ""
 ARG_rise_integracion_administrativa_del_caribe:0 "Integración Administrativa del Caribe"
 ARG_rise.61.a:0 "Hacia un nuevo rumbo. / Towards a new direction. / Verso una nuova direzione."
 ARG_rise_la_cuestion_de_trinidad:0 "La Cuestión de Trinidad"
 ARG_rise_la_cuestion_de_trinidad_desc:0 "ESPAÑOL:\nLa Confederación Argentina extiende su mirada hacia el Caribe meridional. Trinidad y Tobago no es un frente cualquiera: es una puerta energética, naval y diplomática hacia el Atlántico tropical. Antes de los cañones, Buenos Aires probará la presión política.\n\nENGLISH:\nThe Argentine Confederation turns its gaze toward the southern Caribbean. Trinidad and Tobago is not just another front: it is an energy, naval, and diplomatic gate into the tropical Atlantic. Before the guns, Buenos Aires will test political pressure.\n\nITALIANO:\nLa Confederazione Argentina rivolge lo sguardo verso il Caribe meridionale. Trinidad e Tobago non è un fronte qualsiasi: è una porta energetica, navale e diplomatica verso l'Atlantico tropicale. Prima dei cannoni, Buenos Aires proverà la pressione politica."
 ARG_rise_integracion_administrativa_del_caribe_desc:0 "ESPAÑOL:\nEl control del Caribe meridional exige administración, puertos, infraestructura y una reconstrucción ordenada. Trinidad debe ser incorporada como una posesión funcional, no como una simple ocupación militar.\n\nENGLISH:\nControl of the southern Caribbean requires administration, ports, infrastructure, and orderly reconstruction. Trinidad must be incorporated as a functioning possession, not merely as a military occupation.\n\nITALIANO:\nIl controllo del Caribe meridionale richiede amministrazione, porti, infrastrutture e una ricostruzione ordinata. Trinidad deve essere incorporata come possedimento funzionale, non come semplice occupazione militare."
 ARG_rise_ciudadania_del_caribe:0 "Ciudadanía del Caribe"
 ARG_rise_ciudadania_del_caribe_desc:0 "ESPAÑOL:\nLa integración administrativa abre paso a una decisión más profunda: convertir Trinidad en parte política de la Confederación. La ciudadanía sellará la anexión con derechos, obligaciones y lealtad institucional.\n\nENGLISH:\nAdministrative integration opens the way to a deeper decision: turning Trinidad into a political part of the Confederation. Citizenship will seal the annexation through rights, duties, and institutional loyalty.\n\nITALIANO:\nL'integrazione amministrativa apre la strada a una decisione più profonda: trasformare Trinidad in parte politica della Confederazione. La cittadinanza sigillerà l'annessione attraverso diritti, doveri e lealtà istituzionale."
 ARG_rise_integracion_administrativa_del_caribe_tt:0 "Trinidad recibirá reclamación argentina, reconstrucción administrativa durante 1825 días, 1 infraestructura, 1 slot de construcción y 1 industria civil. / Trinidad will receive an Argentine claim, administrative reconstruction for 1825 days, 1 infrastructure, 1 building slot, and 1 civilian industry. / Trinidad riceverà una rivendicazione argentina, ricostruzione amministrativa per 1825 giorni, 1 infrastruttura, 1 slot edificio e 1 industria civile."
 ARG_rise_ciudadania_del_caribe_tt:0 "Trinidad se convertirá en core argentino y se retirará la reclamación extranjera de TRI. / Trinidad will become an Argentine core and TRI's foreign claim will be removed. / Trinidad diventerà core argentino e la rivendicazione estera di TRI sarà rimossa."
 ARG_rise.62.t:0 "Un Gobierno en Venta / A Government for Sale / Un Governo in Vendita"
 ARG_rise.62.d:0 "ESPAÑOL:\nUn cable reservado llega a Buenos Aires desde el Caribe. Horas después, una delegación discreta de Trinidad y Tobago cruza los corredores de la Cancillería bajo identidad protegida y solicita una audiencia privada con el Presidente argentino.\n\nEl mensaje es directo. Basdeo Panday ha comprendido que la Confederación Argentina se ha convertido en la principal potencia del continente. Sus asesores no creen que una guerra pueda salvar a Trinidad; solo destruiría sus puertos, sus refinerías y la autoridad que aún conserva el gobierno.\n\nLa propuesta llega sin ceremonia: entregar el poder de manera ordenada, garantizar la transferencia administrativa del territorio y evitar una invasión, a cambio de dinero, inmunidad personal y un exilio seguro para Panday y los principales miembros de su gabinete.\n\nNo es una rendición pública. Es una transacción de Estado, fría y calculada. Argentina puede comprar la paz, o rechazar el trato y demostrar que su autoridad no se negocia.\n\nENGLISH:\nA classified cable reaches Buenos Aires from the Caribbean. Hours later, a discreet delegation from Trinidad and Tobago passes through the corridors of the Foreign Ministry under protected identities and requests a private audience with the Argentine President.\n\nThe message is direct. Basdeo Panday has understood that the Argentine Confederation has become the main power on the continent. His advisers do not believe a war can save Trinidad; it would only destroy its ports, its refineries, and what remains of the government's authority.\n\nThe offer arrives without ceremony: hand over power in an orderly manner, guarantee the administrative transfer of the territory, and avoid an invasion, in exchange for money, personal immunity, and safe exile for Panday and the leading members of his cabinet.\n\nThis is not a public surrender. It is a cold and calculated transaction of state. Argentina may buy the peace, or reject the bargain and prove that its authority is not negotiated.\n\nITALIANO:\nUn dispaccio riservato arriva a Buenos Aires dal Caribe. Poche ore dopo, una delegazione discreta di Trinidad e Tobago attraversa i corridoi della Cancelleria sotto identità protetta e chiede un incontro privato con il Presidente argentino.\n\nIl messaggio è diretto. Basdeo Panday ha compreso che la Confederazione Argentina è diventata la principale potenza del continente. I suoi consiglieri non credono che una guerra possa salvare Trinidad; distruggerebbe soltanto i suoi porti, le sue raffinerie e ciò che resta dell'autorità del governo.\n\nLa proposta arriva senza cerimonie: consegnare il potere in modo ordinato, garantire il trasferimento amministrativo del territorio ed evitare un'invasione, in cambio di denaro, immunità personale ed esilio sicuro per Panday e per i principali membri del suo gabinetto.\n\nNon è una resa pubblica. È una transazione di Stato, fredda e calcolata. L'Argentina può comprare la pace, oppure rifiutare l'accordo e dimostrare che la sua autorità non si negozia."
 ARG_rise.62.a:0 "Aceptaremos el acuerdo. / We accept. / Accettiamo."
 ARG_rise.62.b:0 "No compraremos lo que podemos conquistar. / We will conquer. / Conquisteremo."
 ARG_rise_el_gigante_despierta:0 "El Gigante Despierta"
 ARG_rise_el_gigante_despierta_desc:0 "ESPAÑOL:\nBrasil deja de ser un observador prudente y se convierte en el principal rival estratégico de la Confederación Argentina. La frontera continental entra en una nueva etapa de tensión abierta.\n\nENGLISH:\nBrazil ceases to be a cautious observer and becomes the main strategic rival of the Argentine Confederation. The continental frontier enters a new phase of open tension.\n\nITALIANO:\nIl Brasile smette di essere un osservatore prudente e diventa il principale rivale strategico della Confederazione Argentina. La frontiera continentale entra in una nuova fase di tensione aperta."
 ARG_rise_la_guerra_del_amazonas:0 "La Guerra del Amazonas"
 ARG_rise_la_guerra_del_amazonas_desc:0 "ESPAÑOL:\nLa disputa con Brasil ya no puede resolverse con notas diplomáticas. Si Buenos Aires quiere imponer su orden continental, deberá aceptar el peso militar de una guerra amazónica.\n\nENGLISH:\nThe dispute with Brazil can no longer be resolved through diplomatic notes. If Buenos Aires wants to impose its continental order, it must accept the military burden of an Amazonian war.\n\nITALIANO:\nLa disputa con il Brasile non può più essere risolta con note diplomatiche. Se Buenos Aires vuole imporre il proprio ordine continentale, dovrà accettare il peso militare di una guerra amazzonica."
 ARG_rise_el_gigante_encadenado:0 "El Gigante Encadenado"
 ARG_rise_el_gigante_encadenado_desc:0 "ESPAÑOL:\nLa derrota brasileña no basta por sí sola. El territorio debe ser reclamado, estabilizado y sometido a una reconstrucción administrativa capaz de convertir la victoria militar en control real.\n\nENGLISH:\nBrazil's defeat is not enough on its own. The territory must be claimed, stabilized, and subjected to administrative reconstruction capable of turning military victory into real control.\n\nITALIANO:\nLa sconfitta brasiliana non basta da sola. Il territorio deve essere rivendicato, stabilizzato e sottoposto a una ricostruzione amministrativa capace di trasformare la vittoria militare in controllo reale."
 ARG_rise_ciudadania_amazonica:0 "Ciudadanía Amazónica"
 ARG_rise_ciudadania_amazonica_desc:0 "ESPAÑOL:\nLa fase de reconstrucción abre el camino a una integración política más profunda. Los territorios brasileños controlados por Argentina serán incorporados a la ciudadanía confederal sin borrar la memoria nacional brasileña.\n\nENGLISH:\nThe reconstruction phase opens the way to deeper political integration. Brazilian territories controlled by Argentina will be incorporated into confederal citizenship without erasing Brazilian national memory.\n\nITALIANO:\nLa fase di ricostruzione apre la strada a un'integrazione politica più profonda. I territori brasiliani controllati dall'Argentina saranno incorporati nella cittadinanza confederale senza cancellare la memoria nazionale brasiliana."
 ARG_rise_la_marcha_al_norte:0 "La Marcha al Norte"
 ARG_rise_la_marcha_al_norte_desc:0 "ESPAÑOL:\nCon el sur continental sometido a la gravedad argentina, la Confederación mira hacia el norte. La integración sudamericana deja de ser regional y se convierte en proyecto continental.\n\nENGLISH:\nWith the southern continent drawn into Argentine gravity, the Confederation looks north. South American integration ceases to be regional and becomes a continental project.\n\nITALIANO:\nCon il sud del continente attratto dalla gravità argentina, la Confederazione guarda verso nord. L'integrazione sudamericana smette di essere regionale e diventa un progetto continentale."
 ARG_rise_las_guayanas_abiertas:0 "Las Guayanas Abiertas"
 ARG_rise_las_guayanas_abiertas_desc:0 "ESPAÑOL:\nSurinam y Guyana son pequeñas puertas hacia el Atlántico norte y el Caribe. Abrirlas significa extender la presencia argentina más allá del Cono Sur.\n\nENGLISH:\nSuriname and Guyana are small gates toward the northern Atlantic and the Caribbean. Opening them means extending Argentine presence beyond the Southern Cone.\n\nITALIANO:\nSuriname e Guyana sono piccole porte verso l'Atlantico settentrionale e il Caribe. Aprirle significa estendere la presenza argentina oltre il Cono Sud."
 ARG_rise_el_arco_del_orinoco:0 "El Arco del Orinoco"
 ARG_rise_el_arco_del_orinoco_desc:0 "ESPAÑOL:\nVenezuela domina el arco energético del Orinoco. Controlar su rumbo significa disputar petróleo, costa, influencia caribeña y profundidad estratégica.\n\nENGLISH:\nVenezuela dominates the energy arc of the Orinoco. Controlling its direction means contesting oil, coastlines, Caribbean influence, and strategic depth.\n\nITALIANO:\nIl Venezuela domina l'arco energetico dell'Orinoco. Controllarne la direzione significa contendere petrolio, coste, influenza caraibica e profondità strategica."
 ARG_rise_la_ruta_de_los_andes_del_norte:0 "La Ruta de los Andes del Norte"
 ARG_rise_la_ruta_de_los_andes_del_norte_desc:0 "ESPAÑOL:\nEcuador y Perú forman la ruta andina septentrional. Someter esa línea permitiría unir costa, montaña y comercio bajo una arquitectura continental argentina.\n\nENGLISH:\nEcuador and Peru form the northern Andean route. Bringing that line under control would connect coast, mountains, and trade under an Argentine continental architecture.\n\nITALIANO:\nEcuador e Perù formano la rotta andina settentrionale. Sottomettere quella linea permetterebbe di unire costa, montagne e commercio sotto un'architettura continentale argentina."
 ARG_rise_bogota_debe_responder:0 "Bogotá Debe Responder"
 ARG_rise_bogota_debe_responder_desc:0 "ESPAÑOL:\nColombia no puede quedar fuera del nuevo equilibrio continental. Bogotá debe responder a la expansión argentina, por negociación o por presión armada.\n\nENGLISH:\nColombia cannot remain outside the new continental balance. Bogotá must answer Argentina's expansion, through negotiation or armed pressure.\n\nITALIANO:\nLa Colombia non può restare fuori dal nuovo equilibrio continentale. Bogotá deve rispondere all'espansione argentina, tramite negoziato o pressione armata."
 ARG_rise_la_union_continental:0 "La Unión Continental"
 ARG_rise_la_union_continental_desc:0 "ESPAÑOL:\nLa Confederación Argentina proclama una arquitectura continental capaz de unir los territorios sometidos bajo reclamaciones, reconstrucción y dirección estratégica desde Buenos Aires.\n\nENGLISH:\nThe Argentine Confederation proclaims a continental architecture capable of binding conquered territories through claims, reconstruction, and strategic direction from Buenos Aires.\n\nITALIANO:\nLa Confederazione Argentina proclama un'architettura continentale capace di unire i territori sottomessi attraverso rivendicazioni, ricostruzione e direzione strategica da Buenos Aires."
 ARG_rise_ciudadania_de_la_union_continental:0 "Ciudadanía de la Unión Continental"
 ARG_rise_ciudadania_de_la_union_continental_desc:0 "ESPAÑOL:\nLa unión continental no puede sostenerse solo con banderas y ocupación. Los territorios del norte sudamericano controlados por Argentina serán integrados en la ciudadanía confederal.\n\nENGLISH:\nContinental union cannot be sustained by flags and occupation alone. Northern South American territories controlled by Argentina will be integrated into confederal citizenship.\n\nITALIANO:\nL'unione continentale non può reggersi solo su bandiere e occupazione. I territori del nord sudamericano controllati dall'Argentina saranno integrati nella cittadinanza confederale."
 ARG_rise_el_gigante_encadenado_reconstruction_tt:0 "Plan de Reconstrucción Austral: se reclamarán los estados brasileños controlados y se aplicará reconstrucción administrativa durante 1825 días. / Austral Reconstruction Plan: controlled Brazilian states will be claimed and placed under administrative reconstruction for 1825 days. / Piano di Ricostruzione Australe: gli stati brasiliani controllati saranno rivendicati e sottoposti a ricostruzione amministrativa per 1825 giorni."
 ARG_rise_ciudadania_amazonica_tt:0 "Los estados core brasileños poseídos y controlados por Argentina se convertirán en cores argentinos y se retirará la reclamación extranjera brasileña. / Brazilian core states owned and controlled by Argentina will become Argentine cores and Brazil's foreign claim will be removed. / Gli stati core brasiliani posseduti e controllati dall'Argentina diventeranno core argentini e la rivendicazione estera brasiliana sarà rimossa."
 ARG_rise_la_union_continental_tt:0 "La Unión Continental reclamará territorios del norte sudamericano y extenderá el Plan de Reconstrucción Austral sobre los estados controlados por Argentina. / The Continental Union will claim northern South American territories and extend the Austral Reconstruction Plan over states controlled by Argentina. / L'Unione Continentale rivendicherà territori del nord sudamericano ed estenderà il Piano di Ricostruzione Australe sugli stati controllati dall'Argentina."
 ARG_rise_ciudadania_de_la_union_continental_tt:0 "Los estados core de Surinam, Guyana, Venezuela, Colombia, Ecuador y Perú poseídos y controlados por Argentina se convertirán en cores argentinos. / Core states of Suriname, Guyana, Venezuela, Colombia, Ecuador, and Peru owned and controlled by Argentina will become Argentine cores. / Gli stati core di Suriname, Guyana, Venezuela, Colombia, Ecuador e Perù posseduti e controllati dall'Argentina diventeranno core argentini."
 ARG_rise_la_conferencia_de_buenos_aires:0 "La Conferencia de Buenos Aires"
 ARG_rise_la_conferencia_de_buenos_aires_desc:0 "ESPAÑOL:\nLa Argentina ya no necesita perseguir cada bandera menor del hemisferio con una guerra. Ahora puede convocarlas.\n\nDurante quince días, Buenos Aires recibirá presidentes, primeros ministros, cancilleres, empresarios y generales de Centroamérica y el Caribe. En los salones oficiales se hablará de cooperación, seguridad marítima y desarrollo compartido. En las habitaciones cerradas se discutirá el verdadero precio de la soberanía.\n\nLa Conferencia de Buenos Aires no será una negociación entre iguales. Será la ceremonia con la que el nuevo poder austral invitará al hemisferio a aceptar una realidad ya consumada.\n\nENGLISH:\nArgentina no longer needs to chase every minor flag in the hemisphere with a war. It can now summon them.\n\nFor fifteen days, Buenos Aires will receive presidents, prime ministers, foreign ministers, businessmen and generals from Central America and the Caribbean. In the official halls, they will speak of cooperation, maritime security and shared development. Behind closed doors, they will discuss the true price of sovereignty.\n\nThe Buenos Aires Conference will not be a negotiation among equals. It will be the ceremony through which the new southern power invites the hemisphere to accept a reality already imposed.\n\nITALIANO:\nL'Argentina non ha più bisogno di inseguire ogni piccola bandiera dell'emisfero con una guerra. Ora può convocarle.\n\nPer quindici giorni, Buenos Aires accoglierà presidenti, primi ministri, ministri degli esteri, imprenditori e generali del Centro America e dei Caraibi. Nei saloni ufficiali si parlerà di cooperazione, sicurezza marittima e sviluppo condiviso. Nelle stanze chiuse si discuterà il vero prezzo della sovranità.\n\nLa Conferenza di Buenos Aires non sarà una trattativa tra pari. Sarà la cerimonia con cui la nuova potenza australe inviterà l'emisfero ad accettare una realtà già imposta."
 ARG_rise.63.t:0 "La Conferencia de Buenos Aires / The Buenos Aires Conference / La Conferenza di Buenos Aires"
 ARG_rise.63.d:0 "ESPAÑOL:\nDurante quince días, Buenos Aires se convierte en el centro político del hemisferio. Presidentes, ministros, generales y delegaciones del Centroamérica y del Caribe llegan para hablar de cooperación, seguridad y desarrollo.\n\nPero en los salones privados se discute otra cosa: deuda, protección, bases, garantías personales y el verdadero precio de la soberanía.\n\nENGLISH:\nFor fifteen days, Buenos Aires becomes the political center of the hemisphere. Presidents, ministers, generals and delegations from Central America and the Caribbean arrive to discuss cooperation, security and development.\n\nBut behind closed doors, another question is negotiated: debt, protection, bases, personal guarantees and the true price of sovereignty.\n\nITALIANO:\nPer quindici giorni, Buenos Aires diventa il centro politico dell’emisfero. Presidenti, ministri, generali e delegazioni del Centro America e dei Caraibi arrivano per discutere cooperazione, sicurezza e sviluppo.\n\nMa nei saloni privati si tratta altro: debito, protezione, basi, garanzie personali e il vero prezzo della sovranità."
 ARG_rise.63.a:0 "Que comience la conferencia. / Let the conference begin. / Che la conferenza abbia inizio."
 ARG_rise_american_common_market_spirit:0 "Mercado Común Americano"
 ARG_rise_american_common_market_spirit_desc:0 "El Mercado Común Americano elimina las principales barreras económicas entre los Estados miembros de la Confederación, favoreciendo inversiones, productividad y desarrollo de infraestructura."
 ARG_rise_american_common_market_spirit_tt:0 "Gains §YMercado Común Americano§! for §Y1095 days§!."
 ARG_rise_conference_table_06:0 "Estado Mayor Continental"
 ARG_rise_conference_table_06_desc:0 "La Conferencia entra en su fase militar: un mando continental unificado bajo direccion argentina."
 ARG_rise_continental_military_command_spirit:0 "Estado Mayor Continental"
 ARG_rise_continental_military_command_spirit_desc:0 "Las fuerzas armadas adheridas se integran bajo un Estado Mayor comun con sede en Buenos Aires, coordinando doctrina, logistica, planificacion y mando operativo."
 ARG_rise_continental_military_command_spirit_tt:0 "Gains §YEstado Mayor Continental§! for §Y1095 days§!."
 ARG_rise.77.t:0 "Estado Mayor Continental / Continental General Staff / Stato Maggiore Continentale"
 ARG_rise.77.d:0 "ESPAÑOL:\nLa Conferencia abandona el lenguaje comercial y entra en la sala militar. Los delegados reciben una propuesta directa: fusionar doctrinas, mandos, logistica y planificacion bajo un Estado Mayor Continental con sede en Buenos Aires.\n\nENGLISH:\nThe Conference leaves commercial language behind and enters the military room. Delegates receive a direct proposal: merge doctrines, commands, logistics and planning under a Continental General Staff based in Buenos Aires.\n\nITALIANO:\nLa Conferenza abbandona il linguaggio commerciale ed entra nella sala militare. I delegati ricevono una proposta diretta: fondere dottrine, comandi, logistica e pianificazione sotto uno Stato Maggiore Continentale con sede a Buenos Aires."
 ARG_rise.77.a:0 "Presentar la reforma militar. / Present the military reform. / Presentare la riforma militare."
 ARG_rise.78.t:0 "El Ejercito de la Confederacion / The Army of the Confederation / L'Esercito della Confederazione"
 ARG_rise.78.d:0 "ESPAÑOL:\nLos oficiales argentinos defienden una idea simple: una Confederacion continental no puede depender de fuerzas dispersas, doctrinas incompatibles y cadenas de mando politicas. Buenos Aires propone un mando comun, una logistica integrada y una planificacion operacional continental.\n\nENGLISH:\nArgentine officers defend a simple idea: a continental Confederation cannot rely on scattered forces, incompatible doctrines and political chains of command. Buenos Aires proposes common command, integrated logistics and continental operational planning.\n\nITALIANO:\nGli ufficiali argentini difendono un idea semplice: una Confederazione continentale non puo dipendere da forze disperse, dottrine incompatibili e catene di comando politiche. Buenos Aires propone comando comune, logistica integrata e pianificazione operativa continentale."
 ARG_rise.78.a:0 "Aprobar el Estado Mayor Continental. / Approve the Continental General Staff. / Approvare lo Stato Maggiore Continentale."
 ARG_rise.78.b:0 "Rinviar la reforma militar. / Postpone the military reform. / Rinviare la riforma militare."
 ARG_rise_conference_table_07:0 "Union Monetaria Americana"
 ARG_rise_conference_table_07_desc:0 "La Conferencia entra en su fase financiera: coordinar moneda, credito, deuda e inversiones bajo direccion de Buenos Aires."
 ARG_rise_american_monetary_union_spirit:0 "Union Monetaria Americana"
 ARG_rise_american_monetary_union_spirit_desc:0 "La arquitectura financiera continental coordina credito, tasas, inversiones y recaudacion bajo liderazgo argentino, reduciendo fricciones monetarias entre los territorios integrados."
 ARG_rise_american_monetary_union_spirit_tt:0 "Gains §YUnion Monetaria Americana§! for §Y1095 days§!."
 ARG_rise.79.t:0 "Union Monetaria Americana / American Monetary Union / Unione Monetaria Americana"
 ARG_rise.79.d:0 "ESPAÑOL:\nLa Conferencia deja atras la arquitectura militar y entra en el terreno mas sensible: moneda, credito, deuda e inversiones. Buenos Aires propone coordinar el sistema financiero continental bajo una direccion comun, capaz de convertir integracion territorial en poder economico real.\n\nENGLISH:\nThe Conference leaves military architecture behind and enters the most sensitive field: currency, credit, debt and investment. Buenos Aires proposes coordinating the continental financial system under a common direction, turning territorial integration into real economic power.\n\nITALIANO:\nLa Conferenza lascia alle spalle l architettura militare ed entra nel terreno piu sensibile: moneta, credito, debito e investimenti. Buenos Aires propone di coordinare il sistema finanziario continentale sotto una direzione comune, trasformando l integrazione territoriale in vero potere economico."
 ARG_rise.79.a:0 "Presentar la reforma financiera. / Present the financial reform. / Presentare la riforma finanziaria."
 ARG_rise.80.t:0 "El Banco del Continente / The Bank of the Continent / La Banca del Continente"
 ARG_rise.80.d:0 "ESPAÑOL:\nLos tecnocratas argentinos sostienen que una Confederacion continental no puede depender de mercados fragmentados, credito disperso y tasas dictadas desde fuera. La Union Monetaria Americana promete una sola arquitectura financiera, mas recaudacion, inversiones mas baratas y una voz economica continental.\n\nENGLISH:\nArgentine technocrats argue that a continental Confederation cannot depend on fragmented markets, scattered credit and rates dictated from abroad. The American Monetary Union promises one financial architecture, stronger revenue, cheaper investment and a continental economic voice.\n\nITALIANO:\nI tecnocrati argentini sostengono che una Confederazione continentale non puo dipendere da mercati frammentati, credito disperso e tassi dettati dall esterno. L Unione Monetaria Americana promette una sola architettura finanziaria, maggior gettito, investimenti meno costosi e una voce economica continentale."
 ARG_rise.80.a:0 "Aprobar la Union Monetaria. / Approve the Monetary Union. / Approvare l Unione Monetaria."
 ARG_rise.80.b:0 "Rinviar la reforma financiera. / Postpone the financial reform. / Rinviare la riforma finanziaria."
 ARG_rise_conference_table_08:0 "Proclamacion de la Confederacion Americana"
 ARG_rise_conference_table_08_desc:0 "La Conferencia llega a su cierre: Buenos Aires prepara la proclamacion formal de la Confederacion Americana."
 ARG_rise_american_confederation_spirit:0 "Confederacion Americana"
 ARG_rise_american_confederation_spirit_desc:0 "La Confederacion Americana convierte la arquitectura politica, economica, militar y financiera de Buenos Aires en una realidad continental permanente."
 ARG_rise_american_confederation_spirit_tt:0 "Gains permanent National Spirit: §YConfederacion Americana§!."
 ARG_rise.81.t:0 "Proclamacion de la Confederacion Americana / Proclamation of the American Confederation / Proclamazione della Confederazione Americana"
 ARG_rise.81.d:0 "ESPAÑOL:\nDurante la ultima sesion, las delegaciones regresan al salon principal. Ya no se discuten anexiones, mercados, mandos o bancos. Todo eso ha sido firmado. Ahora queda convertir el acuerdo en una forma politica visible: la Confederacion Americana, dirigida desde Buenos Aires.\n\nENGLISH:\nDuring the final session, the delegations return to the main hall. Annexations, markets, commands and banks are no longer debated. All of that has been signed. What remains is to turn the agreement into a visible political form: the American Confederation, directed from Buenos Aires.\n\nITALIANO:\nDurante l ultima sessione, le delegazioni tornano nel salone principale. Non si discutono piu annessioni, mercati, comandi o banche. Tutto questo e stato firmato. Ora resta da trasformare l accordo in una forma politica visibile: la Confederazione Americana, diretta da Buenos Aires."
 ARG_rise.81.a:0 "Firmar el tratado final. / Sign the final treaty. / Firmare il trattato finale."
 ARG_rise.82.t:0 "Una Sola Voz / One Voice / Una Sola Voce"
 ARG_rise.82.d:0 "ESPAÑOL:\nBuenos Aires proclama oficialmente la Confederacion Americana. La Constitucion comun, el Mercado Comun, el Estado Mayor Continental y la Union Monetaria dejan de ser mesas separadas: se convierten en una sola arquitectura de poder. America vuelve a hablar con una sola voz, y esa voz nace en el Plata.\n\nENGLISH:\nBuenos Aires officially proclaims the American Confederation. The common Constitution, the Common Market, the Continental General Staff and the Monetary Union cease to be separate tables: they become one architecture of power. America speaks with one voice again, and that voice rises from the Plata.\n\nITALIANO:\nBuenos Aires proclama ufficialmente la Confederazione Americana. La Costituzione comune, il Mercato Comune, lo Stato Maggiore Continentale e l Unione Monetaria smettono di essere tavoli separati: diventano una sola architettura di potere. L America torna a parlare con una sola voce, e quella voce nasce dal Plata."
 ARG_rise.82.a:0 "Que America vuelva a hablar con una sola voz. / Let America speak with one voice again. / Che l America torni a parlare con una sola voce."
