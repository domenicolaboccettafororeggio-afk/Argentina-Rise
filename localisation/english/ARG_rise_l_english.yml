 ARG_rise_talleres_supervivencia_spirit_name:0 "Talleres de Supervivencia"
 ARG_rise_technician_generation_spirit_name:0 "Technical Workforce"
 ARG_rise_trabajo_y_amor_spirit_name:0 "Work and Social Stability"
 ARG_rise_transicion_funesta_spirit_name:0 "Transicion Funesta"
 ARG_rise_vaca_muerta_continental_gaze_spirit_name:0 "Vaca Muerta's Continental Gaze"
 ARG_rise_working_nation_spirit_name:0 "Working Nation"
 ARG_rise_finance_civilian_industrial_district:0 "Financiar un Distrito Industrial Civil"
 ARG_rise_finance_civilian_industrial_district_desc:0 "El Estado argentino puede convertir capital politico y dinero publico en nueva capacidad productiva civil, financiando directamente un distrito industrial capaz de ampliar la base economica nacional."
 ARG_rise_expand_military_industry:0 "Expandir la Industria Militar"
 ARG_rise_expand_military_industry_desc:0 "El Estado moviliza capital politico, dinero publico y capacidad civil temporal para abrir una nueva linea de produccion militar en territorio argentino."
 ARG_rise_expand_naval_industry:0 "Expandir la Industria Naval"
 ARG_rise_expand_naval_industry_desc:0 "El Estado moviliza capital politico, dinero publico y capacidad civil temporal para abrir una nueva linea de produccion naval en territorio argentino."
 ARG_rise_expand_office_sector:0 "Expandir el Sector de Oficinas"
 ARG_rise_expand_office_sector_desc:0 "Con la economia nacional en marcha, el Estado puede financiar nuevos distritos de oficinas capaces de ampliar los servicios avanzados, la administracion economica y la base fiscal moderna."
 ARG_rise_build_commercial_agriculture_district:0 "Distrito de Agricultura Comercial"
 ARG_rise_build_commercial_agriculture_district_desc:0 "La inversion publica puede transformar tierras productivas en agricultura comercial organizada, ampliando la capacidad rural y el peso exportador argentino."
 ARG_rise_develop_fossil_fuels:0 "Desarrollar Fossil Fuels"
 ARG_rise_develop_fossil_fuels_desc:0 "El Estado argentino financia nuevas prospecciones, perforaciones y redes de extraccion para ampliar la base nacional de combustibles fosiles."
 ARG_rise_develop_light_metals:0 "Desarrollar Light Metals"
 ARG_rise_develop_light_metals_desc:0 "Una inversion publica masiva puede abrir nuevos yacimientos de metales livianos, indispensables para la industria moderna y las cadenas tecnologicas nacionales."
 ARG_rise_develop_technology_metals:0 "Desarrollar Technology Metals"
 ARG_rise_develop_technology_metals_desc:0 "La Argentina moviliza capital politico, fondos publicos y capacidad civil para explorar metales tecnologicos criticos para la industrializacion avanzada."
 ARG_rise_develop_precious_metals:0 "Desarrollar Precious Metals"
 ARG_rise_develop_precious_metals_desc:0 "El subsuelo argentino puede sostener una nueva frontera de metales preciosos, siempre que el Estado asuma los costos de una explotacion lenta y pesada."
 ARG_rise_develop_steel:0 "Desarrollar Steel"
 ARG_rise_develop_steel_desc:0 "La expansion siderurgica requiere prospeccion, transporte, energia y disciplina industrial. Cada nuevo corredor de acero fortalece la base material de la nacion."
 ARG_rise_develop_rubber:0 "Desarrollar Rubber"
 ARG_rise_develop_rubber_desc:0 "La industria quimica y sintetica argentina puede ampliar la disponibilidad de caucho, sosteniendo transporte, manufactura y futuras necesidades estrategicas."
 ARG_rise_military_procurement_decisions:0 "Adquisiciones Militares Argentinas"
 ARG_rise_military_procurement_decisions_desc:0 "Programas extraordinarios de adquisicion, conversion industrial y equipamiento militar financiados por el Estado argentino."
 ARG_rise_extraordinary_arsenals_program:0 "Programa Extraordinario de Arsenales"
 ARG_rise_extraordinary_arsenals_program_desc:0 "El Estado fuerza una conversion industrial de emergencia: talleres civiles, capital publico y disciplina politica se concentran durante semanas para levantar nuevos arsenales. La sociedad paga el costo en inestabilidad, pero la maquinaria militar argentina gana forma material."
 ARG_rise_extraordinary_military_equipment_purchase:0 "Compra Extraordinaria de Equipamiento Militar"
 ARG_rise_extraordinary_military_equipment_purchase_desc:0 "Una compra militar masiva combina contratos extranjeros, produccion acelerada y presion fiscal directa. Fusiles, vehiculos, artilleria, blindados y aeronaves llegan como un paquete integral para acelerar el rearme argentino."
 ARG_rise_buy_infantry_equipment_package:0 "Comprar Armas de Infanteria"
 ARG_rise_buy_infantry_equipment_package_desc:0 "El Estado argentino adquiere armas ligeras y equipos de mando para sostener una expansion rapida de sus fuerzas terrestres."
 ARG_rise_buy_artillery_munitions_package:0 "Comprar Artilleria y Municiones"
 ARG_rise_buy_artillery_munitions_package_desc:0 "Contratos de artilleria, municiones, sistemas antiaereos portatiles y armamento antitanque refuerzan el fuego de apoyo del ejercito."
 ARG_rise_buy_antitank_manpads_package:0 "Comprar Sistemas Antitanque y MANPADS"
 ARG_rise_buy_antitank_manpads_package_desc:0 "La Argentina compra sistemas antitanque y antiaereos portatiles para reforzar defensas moviles y unidades de primera linea."
 ARG_rise_buy_utility_vehicle_package:0 "Comprar Vehiculos Utilitarios"
 ARG_rise_buy_utility_vehicle_package_desc:0 "Una compra concentrada de vehiculos utilitarios mejora la movilidad, el transporte tactico y la capacidad logistica del ejercito."
 ARG_rise_buy_apc_ifv_package:0 "Comprar APC e IFV"
 ARG_rise_buy_apc_ifv_package_desc:0 "El Estado financia la adquisicion de transportes blindados y vehiculos de combate de infanteria adecuados al nivel tecnologico nacional."
 ARG_rise_buy_heavy_armor_package:0 "Comprar Blindados Pesados"
 ARG_rise_buy_heavy_armor_package_desc:0 "Una adquisicion costosa de carros de combate y artilleria autopropulsada acelera la formacion de una fuerza mecanizada pesada."
 ARG_rise_sell_surplus_infantry_weapons:0 "Vender Armas Excedentes"
 ARG_rise_sell_surplus_infantry_weapons_desc:0 "El Estado liquida excedentes de armas ligeras y equipos de mando, convirtiendo stockpile sobrante en liquidez fiscal."
 ARG_rise_sell_surplus_artillery:0 "Vender Artilleria Excedente"
 ARG_rise_sell_surplus_artillery_desc:0 "Piezas de artilleria almacenadas o poco prioritarias son vendidas mediante canales estatales controlados."
 ARG_rise_sell_surplus_antitank:0 "Vender Equipamiento Antitanque"
 ARG_rise_sell_surplus_antitank_desc:0 "Sistemas antitanque excedentes son retirados del inventario y convertidos en ingresos publicos."
 ARG_rise_sell_surplus_antiair:0 "Vender Equipamiento Antiaereo"
 ARG_rise_sell_surplus_antiair_desc:0 "El Estado vende sistemas antiaereos portatiles excedentes sin comprometer las necesidades inmediatas de defensa nacional."
 ARG_rise_sell_surplus_utility_vehicles:0 "Vender Vehiculos Militares Obsoletos"
 ARG_rise_sell_surplus_utility_vehicles_desc:0 "Vehiculos utilitarios sobrantes se transfieren al mercado exterior o a compradores secundarios para recuperar liquidez."
 ARG_rise_sell_obsolete_armored_vehicles:0 "Vender Blindados Obsoletos"
 ARG_rise_sell_obsolete_armored_vehicles_desc:0 "Blindados de generaciones previas son retirados del parque activo y vendidos para financiar nuevas adquisiciones."
 ARG_rise_argentine_bonds_decisions:0 "Bonos Argentinos"
 ARG_rise_argentine_bonds_decisions_desc:0 "El Estado argentino puede emitir bonos soberanos para comprar tiempo, financiar proyectos urgentes y sostener la transformacion nacional. La liquidez llega de inmediato, pero el vencimiento futuro puede abrir una crisis aun mayor."
 ARG_rise_bono_de_emergencia:0 "Bono de Emergencia"
 ARG_rise_bono_de_emergencia_desc:0 "Una emision corta y desesperada para sostener la tesoreria nacional durante una emergencia fiscal. Alivia el presente, pero encarece el futuro."
 ARG_rise_bono_de_reconstruccion:0 "Bono de Reconstruccion"
 ARG_rise_bono_de_reconstruccion_desc:0 "El Estado vende deuda para financiar una etapa de reconstruccion economica. Los mercados entregan liquidez, pero exigen un retorno severo."
 ARG_rise_bono_de_desarrollo_nacional:0 "Bono de Desarrollo Nacional"
 ARG_rise_bono_de_desarrollo_nacional_desc:0 "Una emision agresiva para planes industriales, energeticos o fiscales de gran escala. No es todavia una apuesta sistemica total, pero compromete seriamente el margen financiero argentino."
 ARG_rise_bono_de_industrializacion_nacional:0 "Bono de Industrializacion Nacional"
 ARG_rise_bono_de_industrializacion_nacional_desc:0 "Una emision monumental para financiar una transformacion nacional acelerada. Puede sostener megaproyectos, rearme e industria, pero su vencimiento amenaza con convertirse en una bomba fiscal."

 ARG_rise_bond_redistribution_emergency:0 "Liquidez Interna Redistribuida"
 ARG_rise_bond_redistribution_emergency_desc:0 "El pago de los bonos devuelve capital a hogares, bancos y empresas nacionales. El Estado pierde liquidez, pero una pequena parte del dinero vuelve a circular dentro de la economia argentina."
 ARG_rise_bond_redistribution_reconstruction:0 "Ahorro Nacional Reinyectado"
 ARG_rise_bond_redistribution_reconstruction_desc:0 "Los vencimientos pagados alimentan consumo, ahorro privado y actividad empresarial. La deuda sigue pesando sobre el Tesoro, pero el mercado interno recibe una inyeccion temporal de capital."
 ARG_rise_bond_redistribution_development:0 "Capital Argentino en Movimiento"
 ARG_rise_bond_redistribution_development_desc:0 "El reembolso de los bonos de desarrollo moviliza fondos hacia bancos, empresas y familias. Parte de esa liquidez retorna como inversion interna, recaudacion y actividad civil."
 ARG_rise_bond_redistribution_industrialization:0 "Redistribucion Financiera Nacional"
 ARG_rise_bond_redistribution_industrialization_desc:0 "El Estado paga un vencimiento enorme, pero el capital no desaparece: se redistribuye entre actores nacionales y sostiene temporalmente consumo, inversion, productividad y confianza economica."
 ARG_rise_mandato_del_plata:0 "El Mandato del Plata"
 ARG_rise_mandato_del_plata_desc:0 "The reborn Argentine state no longer treats the Plata basin as a passive borderland. It becomes a strategic mandate: trade, security, pressure, and continental order directed from Buenos Aires."
 ARG_rise_brasil_observa_en_silencio:0 "Brasil Observa en Silencio"
 ARG_rise_brasil_observa_en_silencio_desc:0 "Argentina will move carefully enough that Brasilia sees prudence before provocation. The balance of the continent must shift without inviting a premature continental rupture."
 ARG_rise_reclamando_el_rio_de_la_plata:0 "Reclamando el RÃ­o de la Plata"
 ARG_rise_reclamando_el_rio_de_la_plata_desc:0 "Uruguay is the eastern gate of the Plata. If Argentina is to organize the southern cone, the river mouth cannot remain outside the gravity of Buenos Aires."
 ARG_rise_la_cuestion_paraguaya:0 "La CuestiÃ³n Paraguaya"
 ARG_rise_la_cuestion_paraguaya_desc:0 "Paraguay sits at the interior hinge of the basin. Control of the rivers, roads, and political corridors requires an answer to the Paraguayan question."
 ARG_rise_la_frontera_andina:0 "La Frontera Andina"
 ARG_rise_la_frontera_andina_desc:0 "Bolivia connects the Plata to the heights of the continent. Its resources, passes, and political orientation are too important to be left outside Argentina's regional design."
 ARG_rise_el_destino_del_cono_sur:0 "El Destino del Cono Sur"
 ARG_rise_el_destino_del_cono_sur_desc:0 "Chile is the Pacific wall of the southern cone. The final shape of Argentine regional power will be decided where the Andes meet the sea."
 ARG_rise.2.t:0 "La Fiducia Ã¨ Spezzata"
 ARG_rise.2.d:0 "Il governo resta in piedi, ma il paese non gli crede piÃ¹. Nelle strade, nei mercati, nelle province e nei ministeri, la fiducia nel vecchio ordine si Ã¨ frantumata in silenzio prima ancora che nelle urne. La crisi non ha prodotto una sola ribellione, ma una stanchezza piÃ¹ profonda: la sensazione che le vecchie famiglie politiche sappiano soltanto amministrare il declino. Il Justicialismo tenta di presentarsi come rifugio naturale della rabbia popolare, ma una parte crescente della nazione cerca qualcosa di diverso: disciplina, industria, sicurezza, ordine, una volontÃ  capace di imporre direzione alla storia. La democrazia formale continua. Ma il centro morale del paese si sposta, e il New Triumph Party comincia a sembrare meno una protesta e piÃ¹ una risposta."
 ARG_rise.2.a:0 "Che il popolo giudichi chi ha consumato la Repubblica."
 ARG_rise.3.t:0 "Benvenuti in Argentina Rise"
 ARG_rise.3.d:0 "Benvenuti su Argentina Rise, la prima submod di Millennium Dawn creata da Ignoto Sognatore Channel.\n\nQuesta versione Ã¨ ancora in Alpha: molti contenuti sono giÃ  giocabili, ma il progetto Ã¨ in costante sviluppo. Focus, decisioni, eventi, bilanciamento, localizzazione e sistemi economici/militari saranno aggiornati progressivamente prima del rilascio ufficiale su Steam.\n\nGrazie per aver scelto di provare questa prima versione della rinascita argentina."
 ARG_rise.3.a:0 "Che inizi la rinascita."
 ARG_rise_tierra_infrastructure_program_1:0 "Programa de Dominio Territorial 1"
 ARG_rise_tierra_infrastructure_program_1_desc:0 "The Argentine state is accumulating the technical discipline, logistics doctrine, and construction capacity required to open roads, railways, supply hubs, and infrastructure across the national territory."
