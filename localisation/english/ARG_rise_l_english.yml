l_english:
 ARG_rise_the_pampas_engine:0 "The Pampas Engine"
 ARG_rise_the_pampas_engine_desc:0 "The fertile plains of the Pampas can drive a modern export economy if livestock, grain, cold storage, canning, and transport are organized as one industrial chain. By backing the meatpackers, ranchers, and agricultural exporters that keep Argentina fed and connected to global markets, we can turn rural production into national revenue."
 ARG_rise_the_soy_revolution:0 "The Soy Revolution"
 ARG_rise_the_soy_revolution_desc:0 "Soy has become one of Argentina's defining export crops. Expanding modern cultivation, storage, river transport, and processing capacity can turn the countryside into a stronger engine for national recovery."
 ARG_rise_the_hereford_standard:0 "The Hereford Standard"
 ARG_rise_the_hereford_standard_desc:0 "Argentina's cattle industry can move beyond volume alone. By standardizing breeding, feed quality, processing, and export certification, the Hereford line can become a benchmark for reliable beef production."
 ARG_rise_the_recovery_plan:0 "The Recovery Plan"
 ARG_rise_the_recovery_plan_desc:0 "Argentina needs a practical economic recovery program that restores confidence, keeps production moving, and gives the state room to rebuild without losing sight of the real economy."
 ARG_rise_arranque_productivo:0 "Arranque Productivo"
 ARG_rise_arranque_productivo_desc:0 "A recovery plan only matters if it puts people back to work. By linking productive employment, training, and leaner welfare dependency, Argentina can restart its economy from the shop floor upward."
 ARG_rise_re_industrializacion:0 "Re-industrializaciÃ³n"
 ARG_rise_re_industrializacion_desc:0 "A new industrial push can reconnect Argentine factories with domestic demand, regional supply chains, and the export economy. The goal is not nostalgia, but a productive base fit for the modern century."
 ARG_rise_technician_generation:0 "Technician Generation"
 ARG_rise_technician_generation_desc:0 "A new generation of technicians can connect classrooms, workshops, and factories. Structured apprenticeships and technical education will give Argentina the workforce needed for faster technological adoption."
 ARG_rise_trabajo_y_amor:0 "Trabajo y Amor"
 ARG_rise_trabajo_y_amor_desc:0 "Stable work, technical formation, office districts, and urban families can turn Argentina's recovery into a social renaissance: a country where labor gives people the confidence to build a future."
 ARG_rise_silos_del_parana:0 "Silos del ParanÃ¡"
 ARG_rise_silos_del_parana_desc:0 "The grain corridors of the ParanÃ¡ need storage, sorting, and a disciplined export rhythm if the countryside is to become a national recovery engine."
 ARG_rise_puertos_del_grano:0 "Puertos del Grano"
 ARG_rise_puertos_del_grano_desc:0 "River ports, grain terminals, and export logistics can turn agricultural abundance into predictable income for the recovering state."
 ARG_rise_frigorificos_nacionales:0 "FrigorÃ­ficos Nacionales"
 ARG_rise_frigorificos_nacionales_desc:0 "Cold storage, processing plants, and certified meatpacking chains will reconnect ranches to cities, ports, and foreign buyers."
 ARG_rise_marca_argentina_de_exportacion:0 "Marca Argentina de ExportaciÃ³n"
 ARG_rise_marca_argentina_de_exportacion_desc:0 "Argentina must sell reliability as much as beef and grain: traceability, standards, and a national export identity."
 ARG_rise_talleres_abiertos:0 "Talleres Abiertos"
 ARG_rise_talleres_abiertos_desc:0 "Small workshops and light industry are the first places where recovery becomes visible as machines restart and workers return."
 ARG_rise_credito_para_producir:0 "CrÃ©dito para Producir"
 ARG_rise_credito_para_producir_desc:0 "Credit must move toward firms that hire, build, repair, and produce rather than toward speculation and paralysis."
 ARG_rise_obras_de_emergencia:0 "Obras de Emergencia"
 ARG_rise_obras_de_emergencia_desc:0 "Targeted public works can absorb unemployment, repair the productive base, and keep the country moving through the first years of recovery."
 ARG_rise_el_pulso_del_empleo:0 "El Pulso del Empleo"
 ARG_rise_el_pulso_del_empleo_desc:0 "The pulse of employment is the pulse of national confidence: regular wages, formal work, and a visible way out of collapse."
 ARG_rise_parques_industriales_ligeros:0 "Parques Industriales Ligeros"
 ARG_rise_parques_industriales_ligeros_desc:0 "Light industrial parks give suppliers, workshops, and technical firms a place to cluster, learn, and expand."
 ARG_rise_maquinas_para_la_recuperacion:0 "MÃ¡quinas para la RecuperaciÃ³n"
 ARG_rise_maquinas_para_la_recuperacion_desc:0 "Recovery needs tools, spare parts, machine shops, and the patient rebuilding of domestic productive capacity."
 ARG_rise_proveedores_nacionales:0 "Proveedores Nacionales"
 ARG_rise_proveedores_nacionales_desc:0 "A stronger supplier base keeps value inside Argentina and prepares the industrial chain for larger ambitions."
 ARG_rise_la_fabrica_ordenada:0 "La FÃ¡brica Ordenada"
 ARG_rise_la_fabrica_ordenada_desc:0 "Order on the factory floor becomes order in the economy: schedules, suppliers, maintenance, and production targets aligned."
 ARG_rise_distritos_de_oficina:0 "Distritos de Oficina"
 ARG_rise_distritos_de_oficina_desc:0 "Modern office districts can organize finance, logistics, services, accounting, and administration around the growing productive economy."
 ARG_rise_contabilidad_del_crecimiento:0 "Contabilidad del Crecimiento"
 ARG_rise_contabilidad_del_crecimiento_desc:0 "Growth must be counted, taxed, financed, and directed. Better accounting turns recovery into state capacity."
 ARG_rise_ciudades_productivas:0 "Ciudades Productivas"
 ARG_rise_ciudades_productivas_desc:0 "Urban growth must serve work: housing, offices, transport, services, and stable families tied to productive districts."
 ARG_rise_administracion_productiva:0 "AdministraciÃ³n Productiva"
 ARG_rise_administracion_productiva_desc:0 "A productive administration does not merely regulate the recovery; it measures it, accelerates it, and makes it legible."
 ARG_rise_hereford_standard_spirit:0 "Hereford Standardization"
 ARG_rise_hereford_standard_spirit_desc:0 "Breeding, export certification, meatpacking, and ranch logistics are being standardized into a more productive rural system."
 ARG_rise_recovery_plan_spirit:0 "Recovery Discipline"
 ARG_rise_recovery_plan_spirit_desc:0 "A sober recovery program is lowering financial pressure while improving the state's ability to collect and direct revenue."
 ARG_rise_arranque_productivo_spirit:0 "Productive Restart"
 ARG_rise_arranque_productivo_spirit_desc:0 "Employment, training, and productive discipline are drawing workers back into the formal economy."
 ARG_rise_re_industrializacion_spirit:0 "Industrial Reactivation"
 ARG_rise_re_industrializacion_spirit_desc:0 "Factories, construction firms, and industrial planners are moving under a common reindustrialization push."
 ARG_rise_technician_generation_spirit:0 "Technical Workforce"
 ARG_rise_technician_generation_spirit_desc:0 "Technical formation is increasing the productivity of offices, factories, and the wider workforce."
 ARG_rise_trabajo_y_amor_spirit:0 "Work and Social Stability"
 ARG_rise_trabajo_y_amor_spirit_desc:0 "Office work, stable families, urban services, and technical mobility are giving Argentina a stronger demographic and productive base."
 ARG_rise_la_riqueza_de_la_virginidad:0 "La Riqueza de la Virginidad"
 ARG_rise_la_riqueza_de_la_virginidad_desc:0 "Argentina's untouched mineral basins, mountain corridors, and southern energy fields promise a new foundation for national development. The first step is to map, organize, and assert sovereign control over this natural wealth."
 ARG_rise_cordillera_soberana:0 "Cordillera Soberana"
 ARG_rise_cordillera_soberana_desc:0 "The Andes and Cuyo hold the metals needed for a modern industrial base. Expanding extraction in the mountain provinces can turn geological potential into strategic leverage."
 ARG_rise_brillo_del_porvenir:0 "Brillo del Porvenir"
 ARG_rise_brillo_del_porvenir_desc:0 "The far south holds more than energy. Advanced extraction in Tierra del Fuego can reveal precious and technology metals that turn the austral frontier into a strategic reserve for the future."
 ARG_rise_fiebre_del_oro_negro:0 "Fiebre del Oro Negro"
 ARG_rise_fiebre_del_oro_negro_desc:0 "Patagonia's oil fields can fuel a new cycle of state revenue, energy security, and export power. With the right push, the southern boom can become a national engine."
 ARG_rise_las_venas_del_monstruo:0 "Las Venas del Monstruo"
 ARG_rise_las_venas_del_monstruo_desc:0 "The northern interior can feed a vast industrial machine. By driving steel extraction at extreme scale, Argentina can give its reindustrialization project the raw backbone it demands."
 ARG_rise_el_caucho_de_las_pampas:0 "El Caucho de las Pampas"
 ARG_rise_el_caucho_de_las_pampas_desc:0 "Synthetic rubber, refining capacity, and chemical industry can turn the Pampas into a new industrial materials hub. From fuel chemistry to tires and polymers, Argentina can build a domestic supply chain where agriculture, oil, and manufacturing meet."
 ARG_rise_el_advenimiento_del_aliento_primordial:0 "El Advenimiento del Aliento Primordial"
 ARG_rise_el_advenimiento_del_aliento_primordial_desc:0 "Energy sovereignty begins with a national strategy: generation, transmission, storage, and industrial demand aligned under one long-term doctrine. Argentina must treat energy not as a constraint, but as the first breath of development."
 ARG_rise_el_nuevo_sol_levante:0 "El Nuevo Sol Levante"
 ARG_rise_el_nuevo_sol_levante_desc:0 "The northern and western skies offer a vast solar frontier. Modern photovoltaic deployment can diversify Argentina's grid and anchor a new renewable industry."
 ARG_rise_el_nuevo_sol_en_la_tierra:0 "El Nuevo Sol en la Tierra"
 ARG_rise_el_nuevo_sol_en_la_tierra_desc:0 "Nuclear power can bring the sun's discipline down to earth: steady, sovereign, and capable of carrying heavy industry through the century ahead."
 ARG_rise_la_potencia_del_rio:0 "La Potencia del RÃ­o"
 ARG_rise_la_potencia_del_rio_desc:0 "Argentina's rivers can be more than borders and arteries of trade. With modern dams and hydroelectric planning, they can become pillars of national power."
 ARG_rise_el_diablo_de_la_tierra:0 "El Diablo de la Tierra"
 ARG_rise_el_diablo_de_la_tierra_desc:0 "The land itself must be broken, measured, leveled, and made obedient. Argentina begins a territorial campaign of excavators, surveyors, concrete arteries, and cities dragged out of the soil by force of will."
 ARG_rise_el_arado_de_cronos:0 "El Arado de Cronos"
 ARG_rise_el_arado_de_cronos_desc:0 "The first titan cuts time into the earth, opening old ground for a new age of construction, settlement, and industrial command."
 ARG_rise_las_mandibulas_de_gaia:0 "Las MandÃ­bulas de Gaia"
 ARG_rise_las_mandibulas_de_gaia_desc:0 "Gaia's own jaws are forced open by drills and engines, revealing the space where Argentina will plant roads, factories, and cities."
 ARG_rise_el_yunque_de_rea:0 "El Yunque de Rea"
 ARG_rise_el_yunque_de_rea_desc:0 "On the anvil of the mother earth, engineers hammer terrain into platforms, corridors, and foundations fit for a continental project."
 ARG_rise_cimientos_de_oceano:0 "Cimientos de OcÃ©ano"
 ARG_rise_cimientos_de_oceano_desc:0 "The deep titan teaches scale: foundations laid as if for seas, ports, avenues, and industrial districts yet to rise."
 ARG_rise_la_columna_de_hiperion:0 "La Columna de HiperiÃ³n"
 ARG_rise_la_columna_de_hiperion_desc:0 "A column of light and concrete rises over the works, marking the passage from ordinary construction to monumental transformation."
 ARG_rise_la_herida_de_iapeto:0 "La Herida de JÃ¡peto"
 ARG_rise_la_herida_de_iapeto_desc:0 "The earth is wounded deliberately, not out of ruin but creation, as cuts through stone and soil prepare the next Argentine horizon."
 ARG_rise_atlas_bajo_la_pampa:0 "Atlas Bajo la Pampa"
 ARG_rise_atlas_bajo_la_pampa_desc:0 "Beneath the Pampas, Atlas bends his back to carry a heavier republic: roads, grids, industrial zones, and cities without apology."
 ARG_rise_los_caminos_de_coeo:0 "Los Caminos de Ceo"
 ARG_rise_los_caminos_de_coeo_desc:0 "The titan of measure lends his name to corridors drawn with terrible clarity, binding raw land into a rational national surface."
 ARG_rise_la_forja_de_crio:0 "La Forja de CrÃ­o"
 ARG_rise_la_forja_de_crio_desc:0 "In the forge of the south, steel, stone, asphalt, and machinery become instruments of occupation over the stubborn ground."
 ARG_rise_urbes_de_piedra_viva:0 "Urbes de Piedra Viva"
 ARG_rise_urbes_de_piedra_viva_desc:0 "Cities rise like living stone, not scattered settlements but deliberate monuments to density, production, and command over matter."
 ARG_rise_el_trono_de_la_materia:0 "El Trono de la Materia"
 ARG_rise_el_trono_de_la_materia_desc:0 "At the summit of the works, Argentina sits upon the throne of matter itself, with land reshaped into the obedient foundation of a new civilization."
 ARG_rise_montana_meat:0 "Montana Meat"
 ARG_rise_montana_meat_desc:0 "Argentina's cattle country is being reorganized around preserved meat, livestock logistics, and agricultural exports. Better processing capacity and stronger links between farms, packers, ports, and corporate buyers are turning the Pampas into a steadier source of tax income and export value."
 ARG_rise_soy_revolution_spirit:0 "Soy Export Expansion"
 ARG_rise_soy_revolution_spirit_desc:0 "A coordinated expansion of soybean cultivation, commercialized agriculture, and export taxation is strengthening Argentina's rural revenue base."
 ARG_rise_el_nuevo_triunfo:0 "El Nuevo Triunfo"
 ARG_rise_el_nuevo_triunfo_desc:0 "A new nationalist movement begins to organize itself beyond nostalgia and protest. Its first task is to turn scattered anger into a disciplined political force."
 ARG_rise_el_pueblo_unido:0 "El Pueblo Unido"
 ARG_rise_el_pueblo_unido_desc:0 "The New Triumph Party presents itself as the voice of a people tired of paralysis, promising unity, order, and national purpose."
 ARG_rise_la_marcha_nacional:0 "La Marcha Nacional"
 ARG_rise_la_marcha_nacional_desc:0 "Public rallies, veterans, youth groups, and patriotic associations bring the movement into the streets, giving the party visibility beyond the ballot box."
 ARG_rise_la_fuerza_del_orden:0 "La Fuerza del Orden"
 ARG_rise_la_fuerza_del_orden_desc:0 "The party builds its image around public security, institutional discipline, and the promise that Argentina can be governed with a firmer hand."
 ARG_rise_la_doctrina_del_hierro:0 "La Doctrina del Hierro"
 ARG_rise_la_doctrina_del_hierro_desc:0 "A harder ideological line gives the movement structure: hierarchy, sovereignty, and national command over the forces that shape the republic."
 ARG_rise_el_destino_argentino:0 "El Destino Argentino"
 ARG_rise_el_destino_argentino_desc:0 "The movement claims that Argentina is not a failed promise, but an unfinished destiny waiting for a generation willing to seize it."
 ARG_rise_la_nueva_grandeza:0 "La Nueva Grandeza"
 ARG_rise_la_nueva_grandeza_desc:0 "The New Triumph Party turns its rise into a national myth of restoration, discipline, and renewed power."
 ARG_rise_new_triumph_pressure_1:0 "New Triumph Mobilization"
 ARG_rise_new_triumph_pressure_1_desc:0 "The New Triumph Party is building permanent organization, local committees, and a disciplined nationalist message that begins to shift public life in its favor."
 ARG_rise_new_triumph_pressure_2:0 "United People Campaign"
 ARG_rise_new_triumph_pressure_2_desc:0 "The party's rhetoric of unity is becoming a daily political presence, drawing support from disillusioned voters while weakening rival blocs."
 ARG_rise_new_triumph_pressure_3:0 "National March Momentum"
 ARG_rise_new_triumph_pressure_3_desc:0 "Rallies, marches, and patriotic associations keep nationalist politics visible between elections, slowly normalizing the party's claim to national leadership."
 ARG_rise_new_triumph_pressure_4:0 "Order Bloc Pressure"
 ARG_rise_new_triumph_pressure_4_desc:0 "The language of order and security is pulling public debate toward the New Triumph Party and away from the exhausted center."
 ARG_rise_new_triumph_pressure_5:0 "Iron Doctrine Cadres"
 ARG_rise_new_triumph_pressure_5_desc:0 "A harder ideological cadre gives the movement discipline, consistency, and the ability to keep political pressure on its opponents every day."
 ARG_rise_new_triumph_pressure_6:0 "Argentine Destiny Narrative"
 ARG_rise_new_triumph_pressure_6_desc:0 "The movement's story of national destiny is reaching beyond its base, turning ordinary dissatisfaction into a broader nationalist expectation."
 ARG_rise_new_triumph_pressure_7:0 "New Greatness Hegemony"
 ARG_rise_new_triumph_pressure_7_desc:0 "The New Triumph Party has become a permanent force in Argentine public life, steadily eroding its rivals while presenting itself as the country's natural political future."
 ARG_rise_la_voluntad_inquebrantable:0 "La Voluntad Inquebrantable"
 ARG_rise_la_voluntad_inquebrantable_desc:0 "The national will hardens into something organized, patient, and difficult to break. Propaganda, destabilization, and foreign pressure may still arrive, but the New Triumph Party now speaks as if history itself has begun moving in its direction."
 ARG_rise_new_triumph_inquebrantable_will:0 "Inquebrantable Will"
 ARG_rise_new_triumph_inquebrantable_will_desc:0 "The New Triumph Party has embedded itself deeply into public institutions, patriotic associations, and national political language. Its opponents can still resist, but the daily momentum of Argentine politics now bends toward nationalist consolidation."
 ARG_rise_la_caridad_de_la_perseverancia:0 "La Caridad de la Perseverancia"
 ARG_rise_la_caridad_de_la_perseverancia_desc:0 "Argentina can no longer treat public spending as an inheritance without limits. A new doctrine of austerity, administrative discipline, and sustainable service delivery will make the state leaner without letting it collapse."
 ARG_rise_disciplina_del_aula:0 "Disciplina del Aula"
 ARG_rise_disciplina_del_aula_desc:0 "Order in the classroom is the first economy of education. Clear standards, attendance control, and disciplined schedules can reduce waste before budgets are touched."
 ARG_rise_eficiencia_educativa:0 "Eficiencia Educativa"
 ARG_rise_eficiencia_educativa_desc:0 "Schools must deliver measurable learning with fewer idle programs, duplicated offices, and disconnected mandates."
 ARG_rise_curricula_esencial:0 "Curricula Esencial"
 ARG_rise_curricula_esencial_desc:0 "A tighter curriculum focuses national education on the skills and knowledge that matter most for work, citizenship, and technical formation."
 ARG_rise_escuelas_de_rendimiento:0 "Escuelas de Rendimiento"
 ARG_rise_escuelas_de_rendimiento_desc:0 "Performance audits and practical benchmarks will identify which institutions need support, consolidation, or reform."
 ARG_rise_maestros_del_orden:0 "Maestros del Orden"
 ARG_rise_maestros_del_orden_desc:0 "Teacher placement, training, and evaluation must serve classroom stability rather than bureaucratic habit."
 ARG_rise_excelencia_sin_derroche:0 "Excelencia Sin Derroche"
 ARG_rise_excelencia_sin_derroche_desc:0 "The education system can defend excellence while refusing waste, protecting the useful core and cutting the ornamental excess."
 ARG_rise_medicina_funcional:0 "Medicina Funcional"
 ARG_rise_medicina_funcional_desc:0 "Public health begins with services that work: primary care, triage, basic supplies, and hospitals organized around patients rather than paperwork."
 ARG_rise_hospitales_sobrios:0 "Hospitales Sobrios"
 ARG_rise_hospitales_sobrios_desc:0 "Hospitals must operate with strict procurement, fewer idle contracts, and better use of existing equipment."
 ARG_rise_compras_sanitarias:0 "Compras Sanitarias"
 ARG_rise_compras_sanitarias_desc:0 "Centralized purchasing and transparent stock control can reduce the hidden costs of medicine, equipment, and emergency supply."
 ARG_rise_turnos_sin_demora:0 "Turnos Sin Demora"
 ARG_rise_turnos_sin_demora_desc:0 "Waiting lists are a budget problem as much as a medical one. Better scheduling can recover capacity already paid for by the state."
 ARG_rise_clinicas_de_rendimiento:0 "ClÃ­nicas de Rendimiento"
 ARG_rise_clinicas_de_rendimiento_desc:0 "Regional clinics will be judged by throughput, prevention, and practical results, not by the size of their administrative shadow."
 ARG_rise_salud_sin_derroche:0 "Salud Sin Derroche"
 ARG_rise_salud_sin_derroche_desc:0 "A sober health system protects essential care while eliminating the spending that does not heal anyone."
 ARG_rise_trabajo_sobre_subsidio:0 "Trabajo Sobre Subsidio"
 ARG_rise_trabajo_sobre_subsidio_desc:0 "Social policy must point toward work, training, and autonomy, not permanent dependency on fragmented benefits."
 ARG_rise_censo_de_beneficios:0 "Censo de Beneficios"
 ARG_rise_censo_de_beneficios_desc:0 "A complete registry of benefits will expose overlap, fraud, and programs that no longer serve their original purpose."
 ARG_rise_asistencia_productiva:0 "Asistencia Productiva"
 ARG_rise_asistencia_productiva_desc:0 "Aid should become a bridge to productive activity, linking recipients with local employment, training, and community obligations."
 ARG_rise_deber_civico:0 "Deber CÃ­vico"
 ARG_rise_deber_civico_desc:0 "The social contract requires duties as well as support. Public assistance must reinforce civic discipline and participation."
 ARG_rise_cultura_del_esfuerzo:0 "Cultura del Esfuerzo"
 ARG_rise_cultura_del_esfuerzo_desc:0 "Argentina can rebuild dignity by making work, responsibility, and self-improvement the center of social policy."
 ARG_rise_red_social_responsable:0 "Red Social Responsable"
 ARG_rise_red_social_responsable_desc:0 "A responsible safety net remains available for real need, but it must be precise, audited, and resistant to political patronage."
 ARG_rise_archivo_unico:0 "Archivo Ãšnico"
 ARG_rise_archivo_unico_desc:0 "A unified administrative record can reduce duplicated files, repeated procedures, and the quiet cost of a fragmented state."
 ARG_rise_oficina_esbelta:0 "Oficina Esbelta"
 ARG_rise_oficina_esbelta_desc:0 "Every office must justify its process, staffing, and reporting chain in service of a smaller but more capable state."
 ARG_rise_firma_digital:0 "Firma Digital"
 ARG_rise_firma_digital_desc:0 "Digital signatures and standardized workflows will shorten procedures that once consumed weeks of paper and salaries."
 ARG_rise_auditoria_permanente:0 "AuditorÃ­a Permanente"
 ARG_rise_auditoria_permanente_desc:0 "Continuous auditing makes waste harder to hide and gives reformers the evidence needed to close useless channels."
 ARG_rise_tecnocracia_sobria:0 "Tecnocracia Sobria"
 ARG_rise_tecnocracia_sobria_desc:0 "A sober technocracy values measurable administration, restrained spending, and competent execution over theatrical politics."
 ARG_rise_estado_de_precision:0 "Estado de PrecisiÃ³n"
 ARG_rise_estado_de_precision_desc:0 "The final goal is not a weak state, but a precise one: fewer leaks, clearer authority, and services that cost what they are worth."
 ARG_rise_el_nuevo_paraiso_de_las_oportunidades:0 "El Nuevo ParaÃ­so de las Oportunidades"
 ARG_rise_el_nuevo_paraiso_de_las_oportunidades_desc:0 "Argentina will present itself to the world as a land of work, opportunity, and national renewal. Those willing to build, settle, and serve the country's rise will find open doors."
 ARG_rise_puertas_abiertas_al_trabajo:0 "Puertas Abiertas al Trabajo"
 ARG_rise_puertas_abiertas_al_trabajo_desc:0 "The first promise is simple: those who come to work will find a country ready to receive their effort."
 ARG_rise_visas_de_la_nueva_patria:0 "Visas de la Nueva Patria"
 ARG_rise_visas_de_la_nueva_patria_desc:0 "A clearer visa system can turn migration from disorder into a deliberate instrument of national growth."
 ARG_rise_corredores_del_plata:0 "Corredores del Plata"
 ARG_rise_corredores_del_plata_desc:0 "Ports, airports, border crossings, and consular channels will guide new arrivals toward the regions that need them most."
 ARG_rise_familias_para_la_frontera:0 "Familias para la Frontera"
 ARG_rise_familias_para_la_frontera_desc:0 "Families willing to settle the interior can give life to towns, farms, workshops, and frontier cities that have waited too long."
 ARG_rise_la_llamada_del_sur:0 "La Llamada del Sur"
 ARG_rise_la_llamada_del_sur_desc:0 "The southern republic calls workers, builders, and dreamers to a new life under the Argentine sky."
 ARG_rise_techos_para_millones:0 "Techos para Millones"
 ARG_rise_techos_para_millones_desc:0 "Population growth must be matched by roofs, streets, water, and reliable civic infrastructure."
 ARG_rise_barrios_de_porvenir:0 "Barrios de Porvenir"
 ARG_rise_barrios_de_porvenir_desc:0 "New neighborhoods will be planned as places of work and belonging, not merely as shelters at the edge of the city."
 ARG_rise_ciudades_nuevas:0 "Ciudades Nuevas"
 ARG_rise_ciudades_nuevas_desc:0 "Argentina can grow beyond its old urban limits by founding new centers of housing, logistics, and production."
 ARG_rise_avenidas_del_crecimiento:0 "Avenidas del Crecimiento"
 ARG_rise_avenidas_del_crecimiento_desc:0 "Civil corridors, roads, and public works will bind expanding cities into a broader national economy."
 ARG_rise_la_gran_metropoli_austral:0 "La Gran MetrÃ³poli Austral"
 ARG_rise_la_gran_metropoli_austral_desc:0 "A greater austral metropolis can turn demographic expansion into a visible symbol of national momentum."
 ARG_rise_escritorios_del_progreso:0 "Escritorios del Progreso"
 ARG_rise_escritorios_del_progreso_desc:0 "A growing country needs offices, clerks, analysts, and service firms able to organize its new complexity."
 ARG_rise_servicios_de_alto_valor:0 "Servicios de Alto Valor"
 ARG_rise_servicios_de_alto_valor_desc:0 "Advanced services can turn education, administration, finance, and technology into a new source of skilled employment."
 ARG_rise_oficinas_del_plata:0 "Oficinas del Plata"
 ARG_rise_oficinas_del_plata_desc:0 "The Plata corridor can host office districts that connect trade, logistics, finance, and state capacity."
 ARG_rise_administradores_del_mercado:0 "Administradores del Mercado"
 ARG_rise_administradores_del_mercado_desc:0 "Growth requires people who can count, schedule, audit, sell, manage, and keep the productive machine coherent."
 ARG_rise_la_clase_empleada:0 "La Clase Empleada"
 ARG_rise_la_clase_empleada_desc:0 "A broad salaried class will anchor social mobility and give the new Argentina a disciplined civilian workforce."
 ARG_rise_manos_a_la_fabrica:0 "Manos a la FÃ¡brica"
 ARG_rise_manos_a_la_fabrica_desc:0 "New arrivals and young Argentines alike must find a place in workshops, plants, warehouses, and production lines."
 ARG_rise_turnos_de_produccion:0 "Turnos de ProducciÃ³n"
 ARG_rise_turnos_de_produccion_desc:0 "Factories that sleep waste machinery, wages, and ambition. More shifts can absorb more workers into national production."
 ARG_rise_parques_de_empleo:0 "Parques de Empleo"
 ARG_rise_parques_de_empleo_desc:0 "Industrial employment zones will concentrate transport, training, utilities, and recruitment where mass work can take root."
 ARG_rise_contrato_productivo_nacional:0 "Contrato Productivo Nacional"
 ARG_rise_contrato_productivo_nacional_desc:0 "Workers, firms, and the state must agree that employment exists to build national strength, not merely to survive another month."
 ARG_rise_la_nacion_trabajadora:0 "La NaciÃ³n Trabajadora"
 ARG_rise_la_nacion_trabajadora_desc:0 "The working nation is more than an economy: it is a social order built around production, duty, and shared advancement."
 ARG_rise_primer_juramento_civico:0 "Primer Juramento CÃ­vico"
 ARG_rise_primer_juramento_civico_desc:0 "Integration begins when newcomers and citizens accept a common civic language of loyalty, law, and service."
 ARG_rise_lengua_y_oficio:0 "Lengua y Oficio"
 ARG_rise_lengua_y_oficio_desc:0 "Language training and practical skills will turn arrival into belonging and belonging into productive contribution."
 ARG_rise_escuelas_de_integracion:0 "Escuelas de IntegraciÃ³n"
 ARG_rise_escuelas_de_integracion_desc:0 "Integration schools will teach work discipline, civic expectations, technical basics, and the habits of Argentine public life."
 ARG_rise_disciplina_compartida:0 "Disciplina Compartida"
 ARG_rise_disciplina_compartida_desc:0 "A larger population can remain cohesive if it shares rules, obligations, and a disciplined sense of national purpose."
 ARG_rise_un_solo_pueblo_productivo:0 "Un Solo Pueblo Productivo"
 ARG_rise_un_solo_pueblo_productivo_desc:0 "Argentina's demographic rise must end in one productive people: diverse in origin, unified in duty, and directed toward national greatness."
 ARG_rise_el_primer_dia_de_luz:0 "El Primer DÃ­a de Luz"
 ARG_rise_el_primer_dia_de_luz_desc:0 "The new dawn is not a metaphor but a grid of panels, towers, converters, and disciplined engineers drawing command from the Argentine sky."
 ARG_rise_los_vientos_del_genesis:0 "Los Vientos del GÃ©nesis"
 ARG_rise_los_vientos_del_genesis_desc:0 "Across plains and ridgelines, the first winds of creation are captured, measured, and bent into the service of national renewal."
 ARG_rise_corona_sobre_la_pampa:0 "Corona sobre la Pampa"
 ARG_rise_corona_sobre_la_pampa_desc:0 "A crown of light and motion rises above the Pampas, turning open horizons into a visible promise of clean power."
 ARG_rise_apolo_en_los_andes:0 "Apolo en los Andes"
 ARG_rise_apolo_en_los_andes_desc:0 "From the high west, Argentina calls the solar titan down from myth and fixes his fire into cables, substations, and sovereign voltage."
 ARG_rise_el_fuego_de_prometeo:0 "El Fuego de Prometeo"
 ARG_rise_el_fuego_de_prometeo_desc:0 "The forbidden fire is no longer stolen in fear. It is studied, contained, and placed under the authority of Argentine science."
 ARG_rise_la_camara_del_atomo:0 "La CÃ¡mara del Ãtomo"
 ARG_rise_la_camara_del_atomo_desc:0 "Within sealed chambers, matter reveals its hidden furnace, and the republic learns to speak the severe language of the atom."
 ARG_rise_el_sol_encadenado:0 "El Sol Encadenado"
 ARG_rise_el_sol_encadenado_desc:0 "A sun bound to earth can feed industry without sleep, carrying the weight of factories, cities, and the ambitions of a harder century."
 ARG_rise_liturgia_del_reactor:0 "Liturgia del Reactor"
 ARG_rise_liturgia_del_reactor_desc:0 "The reactor demands ritual precision: procedure, training, silence, calculation, and the obedience owed to power at its most absolute."
 ARG_rise_el_pacto_con_las_aguas:0 "El Pacto con las Aguas"
 ARG_rise_el_pacto_con_las_aguas_desc:0 "Argentina makes a pact with its rivers: their force will still flow, but now through turbines, gates, and the architecture of command."
 ARG_rise_murallas_contra_el_diluvio:0 "Murallas contra el Diluvio"
 ARG_rise_murallas_contra_el_diluvio_desc:0 "Against flood and waste, concrete walls rise as instruments of discipline, turning the old terror of water into stored national strength."
 ARG_rise_los_rios_de_atlas:0 "Los RÃ­os de Atlas"
 ARG_rise_los_rios_de_atlas_desc:0 "Titanic rivers shoulder the burden of the grid, bearing cities and industries as if the land itself had learned to carry fire."
 ARG_rise_el_trono_del_torrente:0 "El Trono del Torrente"
 ARG_rise_el_trono_del_torrente_desc:0 "At the throne of the torrent, the state claims mastery over falling water, and the roar of the river becomes the voice of power."
 ARG_rise_renewable_energy_drive_1:0 "Dawn Grid Mobilization"
 ARG_rise_renewable_energy_drive_1_desc:0 "The first renewable grid program links treasury discipline, substations, and new wind and solar sites into a national energy push."
 ARG_rise_renewable_energy_drive_2:0 "First Light Corridors"
 ARG_rise_renewable_energy_drive_2_desc:0 "Renewable corridors begin to cross the country, carrying the first disciplined surge of clean generation into the Argentine grid."
 ARG_rise_renewable_energy_drive_3:0 "Genesis Wind Directorate"
 ARG_rise_renewable_energy_drive_3_desc:0 "Wind districts are surveyed, financed, and connected with the cold precision of a permanent national program."
 ARG_rise_renewable_energy_drive_4:0 "Pampas Crown Grid"
 ARG_rise_renewable_energy_drive_4_desc:0 "The Pampas become a crown of renewable machinery, where open land and steady planning turn horizon into power."
 ARG_rise_renewable_energy_drive_5:0 "Andean Solar Command"
 ARG_rise_renewable_energy_drive_5_desc:0 "Argentina fixes solar command in the west, drawing altitude, light, and engineering into a larger sovereign system."
 ARG_rise_nuclear_energy_program_1:0 "Atomic Planning Bureau"
 ARG_rise_nuclear_energy_program_1_desc:0 "The state begins the bureaucratic and technical discipline required to make nuclear power a permanent national instrument."
 ARG_rise_nuclear_energy_program_2:0 "Promethean Reactor Works"
 ARG_rise_nuclear_energy_program_2_desc:0 "The first new reactor works bind capital, steel, safety doctrine, and atomic ambition into visible construction."
 ARG_rise_nuclear_energy_program_3:0 "Chamber of Containment"
 ARG_rise_nuclear_energy_program_3_desc:0 "Containment, fuel handling, and procedure become the core of a stricter nuclear establishment."
 ARG_rise_nuclear_energy_program_4:0 "Bound Sun Complex"
 ARG_rise_nuclear_energy_program_4_desc:0 "A second nuclear surge places the artificial sun deeper inside the national grid."
 ARG_rise_nuclear_energy_program_5:0 "Reactor Liturgical Order"
 ARG_rise_nuclear_energy_program_5_desc:0 "The reactor program matures into ritual precision, technical hierarchy, and sovereign energy endurance."
 ARG_rise_hydroelectric_power_1:0 "Cuyo Hydroelectric Mandate"
 ARG_rise_hydroelectric_power_1_desc:0 "A first hydroelectric mandate draws command from the western waters and adds firm power to the Argentine grid."
 ARG_rise_hydroelectric_power_2:0 "Cordoba Water Compact"
 ARG_rise_hydroelectric_power_2_desc:0 "The Cordoba project binds river management, turbines, and state planning into a second surge of national power."
 ARG_rise_hydroelectric_power_3:0 "Pampas Floodwall Turbines"
 ARG_rise_hydroelectric_power_3_desc:0 "Water discipline reaches the Pampas, where control works and turbines turn motion into sovereign energy."
 ARG_rise_hydroelectric_power_4:0 "Patagonian Torrent Works"
 ARG_rise_hydroelectric_power_4_desc:0 "Patagonian force is captured in concrete, steel, and transmission, adding another great block of power to the republic."
 ARG_rise_hydroelectric_power_5:0 "Austral Throne of Water"
 ARG_rise_hydroelectric_power_5_desc:0 "At the far south, the final hydroelectric throne anchors the national grid with cold and uncompromising power."
 ARG_rise_nuclear_reactor_random_tt:0 "Add Â§Y1 Nuclear ReactorÂ§! instantly in a random valid Argentine state."
 ARG_rise_resource_export_magnet:0 "Resource Export Magnet"
 ARG_rise_resource_export_magnet_desc:0 "Argentine minerals, metals, oil, and industrial feedstocks are being packaged as a strategic offer to foreign buyers, binding extraction to export demand."
 ARG_rise_state_perseverance_doctrine:0 "Doctrine of State Perseverance"
 ARG_rise_state_perseverance_doctrine_desc:0 "The Argentine state is being reorganized around disciplined spending, fiscal clarity, administrative restraint, and the hard belief that a lighter state can still become a stronger one."
 ARG_rise_education_discipline_1:0 "Classroom Discipline"
 ARG_rise_education_discipline_1_desc:0 "Attendance, scheduling, and basic order are reducing waste in the education system while restoring the classroom as a productive institution."
 ARG_rise_education_discipline_2:0 "Educational Efficiency"
 ARG_rise_education_discipline_2_desc:0 "Duplicated programs and idle mandates are being cut back so schools can concentrate on measurable learning."
 ARG_rise_education_discipline_3:0 "Essential Curriculum"
 ARG_rise_education_discipline_3_desc:0 "A leaner curriculum puts technical skills, literacy, civic duty, and productive knowledge at the center of national education."
 ARG_rise_education_discipline_4:0 "Performance Schools"
 ARG_rise_education_discipline_4_desc:0 "Schools are being measured by results, useful training, and their contribution to a disciplined future workforce."
 ARG_rise_education_discipline_5:0 "Teachers of Order"
 ARG_rise_education_discipline_5_desc:0 "Teacher placement and formation are being aligned with national productivity, classroom stability, and a stricter educational culture."
 ARG_rise_education_discipline_6:0 "Excellence Without Waste"
 ARG_rise_education_discipline_6_desc:0 "The education system preserves excellence while refusing ornamental spending, turning limited public money into stronger human capital."
 ARG_rise_health_discipline_1:0 "Functional Medicine"
 ARG_rise_health_discipline_1_desc:0 "Primary care, triage, and hospital discipline are being organized around practical outcomes rather than administrative sprawl."
 ARG_rise_health_discipline_2:0 "Sober Hospitals"
 ARG_rise_health_discipline_2_desc:0 "Hospitals are learning to do more with less through stricter procurement, scheduling, and use of existing capacity."
 ARG_rise_health_discipline_3:0 "Sanitary Procurement"
 ARG_rise_health_discipline_3_desc:0 "Centralized purchasing and supply controls are reducing hidden health costs while protecting essential medical services."
 ARG_rise_health_discipline_4:0 "Appointments Without Delay"
 ARG_rise_health_discipline_4_desc:0 "Better scheduling and throughput recover labor capacity from a system that once trapped people in waiting lists."
 ARG_rise_health_discipline_5:0 "Performance Clinics"
 ARG_rise_health_discipline_5_desc:0 "Regional clinics are being judged by prevention, access, and practical output rather than the size of their paperwork."
 ARG_rise_health_discipline_6:0 "Health Without Waste"
 ARG_rise_health_discipline_6_desc:0 "A sober health system protects the population while stripping away spending that does not heal, stabilize, or strengthen the nation."
 ARG_rise_social_discipline_1:0 "Work Over Subsidy"
 ARG_rise_social_discipline_1_desc:0 "Social policy is being redirected toward work, training, and productive autonomy instead of permanent dependency."
 ARG_rise_social_discipline_2:0 "Benefits Census"
 ARG_rise_social_discipline_2_desc:0 "A complete registry of benefits exposes overlap, fraud, and inactive programs that drain the state without rebuilding society."
 ARG_rise_social_discipline_3:0 "Productive Assistance"
 ARG_rise_social_discipline_3_desc:0 "Aid becomes a bridge toward employment, training, and community obligations rather than a final destination."
 ARG_rise_social_discipline_4:0 "Civic Duty"
 ARG_rise_social_discipline_4_desc:0 "Support from the state is tied to duties, participation, and a disciplined understanding of the national social contract."
 ARG_rise_social_discipline_5:0 "Culture of Effort"
 ARG_rise_social_discipline_5_desc:0 "Work, responsibility, and self-improvement are becoming the moral center of social policy."
 ARG_rise_social_discipline_6:0 "Responsible Social Net"
 ARG_rise_social_discipline_6_desc:0 "Argentina preserves a safety net for real need while making it precise, audited, and resistant to patronage."
 ARG_rise_administration_discipline_1:0 "Unified Archive"
 ARG_rise_administration_discipline_1_desc:0 "Administrative records are being unified to reduce duplicated files, repeated procedures, and opportunities for hidden waste."
 ARG_rise_administration_discipline_2:0 "Lean Office"
 ARG_rise_administration_discipline_2_desc:0 "Every office must justify its staff, process, and reporting chain in service of a smaller but more capable state."
 ARG_rise_administration_discipline_3:0 "Digital Signature"
 ARG_rise_administration_discipline_3_desc:0 "Digital signatures and standardized workflows shorten procedures that once consumed weeks of paper and salaries."
 ARG_rise_administration_discipline_4:0 "Permanent Audit"
 ARG_rise_administration_discipline_4_desc:0 "Continuous auditing makes waste harder to hide and gives reformers the evidence needed to close useless channels."
 ARG_rise_administration_discipline_5:0 "Sober Technocracy"
 ARG_rise_administration_discipline_5_desc:0 "A sober technocracy values measurable administration, restrained spending, and competent execution over theatrical politics."
 ARG_rise_administration_discipline_6:0 "State of Precision"
 ARG_rise_administration_discipline_6_desc:0 "The final goal is not a weak state, but a precise one: fewer leaks, clearer authority, and services that cost what they are worth."
 ARG_rise_la_gravedad_del_sur:0 "La Gravedad del Sur"
 ARG_rise_la_gravedad_del_sur_desc:0 "Argentina no longer seeks a place inside the continental order; it begins to become the weight around which that order must move. Diplomacy, production, migration, energy, and discipline will be gathered into one patient force."
 ARG_rise_el_meridiano_de_buenos_aires:0 "El Meridiano de Buenos Aires"
 ARG_rise_el_meridiano_de_buenos_aires_desc:0 "Buenos Aires will define a new diplomatic meridian for the south, measuring regional affairs through Argentine stability, Argentine markets, and Argentine ambition."
 ARG_rise_embajadas_productivas:0 "Embajadas Productivas"
 ARG_rise_embajadas_productivas_desc:0 "Embassies must become productive instruments: mapping industries, ports, political factions, migrant corridors, and the practical interests that bind neighbors to Argentina."
 ARG_rise_la_voz_del_cono_sur:0 "La Voz del Cono Sur"
 ARG_rise_la_voz_del_cono_sur_desc:0 "The southern cone needs a voice capable of speaking with order, scale, and endurance. Argentina will present itself as the serious answer to regional drift."
 ARG_rise_prestigio_de_la_estabilidad:0 "Prestigio de la Estabilidad"
 ARG_rise_prestigio_de_la_estabilidad_desc:0 "A stable Argentina becomes persuasive without shouting. Inflation disciplined, services rationalized, and industry rising will make neighboring elites listen."
 ARG_rise_doctrina_del_plata:0 "Doctrina del Plata"
 ARG_rise_doctrina_del_plata_desc:0 "The Plata basin becomes more than geography. It becomes a doctrine of trade, ports, security, migration, and political gravity centered on Argentina."
 ARG_rise_mesa_del_plata:0 "Mesa del Plata"
 ARG_rise_mesa_del_plata_desc:0 "Regional influence begins at the table: customs, transport, finance, food, and administrative agreements shaped by the country with the will to organize them."
 ARG_rise_corredores_del_mercosur:0 "Corredores del Mercosur"
 ARG_rise_corredores_del_mercosur_desc:0 "Mercosur can be treated as infrastructure, not rhetoric. Roads, ports, warehouses, and procedures will turn integration into dependency."
 ARG_rise_credito_de_estabilidad_austral:0 "CrÃ©dito de Estabilidad Austral"
 ARG_rise_credito_de_estabilidad_austral_desc:0 "A country that has survived debt learns how debt governs others. Argentine credit and stabilization packages can become instruments of regional patience and pressure."
 ARG_rise_puertos_bajo_nuestra_sombra:0 "Puertos Bajo Nuestra Sombra"
 ARG_rise_puertos_bajo_nuestra_sombra_desc:0 "The ports of the south carry grain, fuel, steel, machines, and political consequence. Whoever organizes the docks organizes the horizon."
 ARG_rise_cinturon_de_dependencias:0 "CinturÃ³n de Dependencias"
 ARG_rise_cinturon_de_dependencias_desc:0 "Dependency does not need to announce itself. It can be built through contracts, logistics, finance, replacement parts, skilled labor, and quiet administrative habit."
 ARG_rise_diplomacia_del_acero_y_la_luz:0 "Diplomacia del Acero y la Luz"
 ARG_rise_diplomacia_del_acero_y_la_luz_desc:0 "Argentina's resources, power generation, and industrial materials can become diplomatic arguments stronger than speeches."
 ARG_rise_vaca_muerta_mira_al_continente:0 "Vaca Muerta Mira al Continente"
 ARG_rise_vaca_muerta_mira_al_continente_desc:0 "The shale fields of Neuquen do not face only domestic demand. Their true horizon is continental dependence on Argentine fuel, planning, and capital."
 ARG_rise_minerales_para_la_region:0 "Minerales para la RegiÃ³n"
 ARG_rise_minerales_para_la_region_desc:0 "Metals from the mountains and the south will supply more than Argentine factories. They will feed the regional industries that learn to look southward for stability."
 ARG_rise_rutas_del_petroleo_austral:0 "Rutas del PetrÃ³leo Austral"
 ARG_rise_rutas_del_petroleo_austral_desc:0 "Oil, ports, rail, and roads form a language of power. The routes that carry fuel can also carry obligation."
 ARG_rise_precio_de_la_soberania:0 "Precio de la SoberanÃ­a"
 ARG_rise_precio_de_la_soberania_desc:0 "Sovereignty has a price, and Argentina will learn how to set it: access to resources, credit, infrastructure, and protection in exchange for alignment."
 ARG_rise_oficina_continental:0 "Oficina Continental"
 ARG_rise_oficina_continental_desc:0 "A continent cannot be influenced by impulse. It requires files, analysts, permanent desks, and officials trained to see every neighbor as a system."
 ARG_rise_redes_de_lealtad:0 "Redes de Lealtad"
 ARG_rise_redes_de_lealtad_desc:0 "Political loyalty grows through careers, favors, shared training, economic exposure, and the knowledge that Argentina remembers its friends."
 ARG_rise_prensa_del_orden:0 "Prensa del Orden"
 ARG_rise_prensa_del_orden_desc:0 "The Argentine model must become visible: order without paralysis, growth without surrender, and a national state that appears inevitable."
 ARG_rise_intereses_permanentes:0 "Intereses Permanentes"
 ARG_rise_intereses_permanentes_desc:0 "Governments change, but interests remain. Argentina will cultivate institutions, firms, officers, unions, and administrators who understand where permanence lies."
 ARG_rise_sombra_administrativa:0 "Sombra Administrativa"
 ARG_rise_sombra_administrativa_desc:0 "The strongest influence is often bureaucratic: standards copied, databases shared, procedures adopted, advisers retained, and decisions quietly shaped before they become public."
 ARG_rise_atlas_del_continente:0 "Atlas del Continente"
 ARG_rise_atlas_del_continente_desc:0 "Before command comes knowledge. Argentina must map the continent as a strategist maps weight: roads, ports, mountains, rivers, armies, industries, and fractures."
 ARG_rise_frontera_de_seguridad:0 "Frontera de Seguridad"
 ARG_rise_frontera_de_seguridad_desc:0 "A rising power cannot treat its borders as lines alone. They are belts of logistics, surveillance, infrastructure, and political preparation."
 ARG_rise_preparacion_del_comando_america:0 "PreparaciÃ³n del Comando AmÃ©rica"
 ARG_rise_preparacion_del_comando_america_desc:0 "The armed forces must think beyond defense without rushing toward war. Planning, mobility, supply, and command doctrine will mature before the continent is tested."
 ARG_rise_ultimatum_del_sur:0 "UltimÃ¡tum del Sur"
 ARG_rise_ultimatum_del_sur_desc:0 "An ultimatum is only serious when decades of industry, diplomacy, intelligence, and military preparation stand behind it."
 ARG_rise_la_hora_americana:0 "La Hora Americana"
 ARG_rise_la_hora_americana_desc:0 "The final hour will not arrive as a surprise. It will arrive because the continent has already learned the weight of Argentina."
 ARG_rise_la_justicia_del_orden_nuevo:0 "La Justicia del Orden Nuevo"
 ARG_rise_la_justicia_del_orden_nuevo_desc:0 "A growing Argentina cannot allow criminal networks, corruption, judicial paralysis, and internal destabilization to feed on its rise. The state begins a modern security doctrine built on courts, intelligence, police coordination, and administrative precision."
 ARG_rise_codigo_de_precision:0 "CÃ³digo de PrecisiÃ³n"
 ARG_rise_codigo_de_precision_desc:0 "The law must become clear, fast, and difficult to exploit. Argentina begins rewriting legal procedures around precision rather than delay."
 ARG_rise_tribunales_de_integridad:0 "Tribunales de Integridad"
 ARG_rise_tribunales_de_integridad_desc:0 "Specialized courts will handle corruption, organized crime, and strategic economic offenses with discipline and institutional focus."
 ARG_rise_fiscalias_de_alto_rendimiento:0 "FiscalÃ­as de Alto Rendimiento"
 ARG_rise_fiscalias_de_alto_rendimiento_desc:0 "Prosecutors need data, coordination, and operational tempo equal to the networks they pursue."
 ARG_rise_sentencia_del_estado:0 "Sentencia del Estado"
 ARG_rise_sentencia_del_estado_desc:0 "The state must prove that its judgment is not theatrical, but certain, procedural, and impossible to ignore."
 ARG_rise_comando_federal_de_seguridad:0 "Comando Federal de Seguridad"
 ARG_rise_comando_federal_de_seguridad_desc:0 "Police, border units, federal investigators, and provincial forces begin operating under a stricter national security architecture."
 ARG_rise_ciudades_bajo_control:0 "Ciudades Bajo Control"
 ARG_rise_ciudades_bajo_control_desc:0 "Urban security becomes a condition of national development: ports, stations, industrial districts, and neighborhoods must be protected as one system."
 ARG_rise_fronteras_internas:0 "Fronteras Internas"
 ARG_rise_fronteras_internas_desc:0 "Criminal economies move through internal corridors. Argentina will map, monitor, and close the routes that feed disorder."
 ARG_rise_paz_de_acero_civil:0 "Paz de Acero Civil"
 ARG_rise_paz_de_acero_civil_desc:0 "The objective is not chaos under uniform, but civil peace enforced by a state that no longer negotiates with predatory networks."
 ARG_rise_oficina_contra_el_crimen_organizado:0 "Oficina contra el Crimen Organizado"
 ARG_rise_oficina_contra_el_crimen_organizado_desc:0 "Cartels, mafias, smuggling rings, and corrupt intermediaries are treated as systems to be dismantled, not scandals to be survived."
 ARG_rise_golpear_las_rutas_grises:0 "Golpear las Rutas Grises"
 ARG_rise_golpear_las_rutas_grises_desc:0 "The gray routes of cash, contraband, narcotics, weapons, and favors must be struck where logistics, finance, and politics meet."
 ARG_rise_cierre_del_dinero_sucio:0 "Cierre del Dinero Sucio"
 ARG_rise_cierre_del_dinero_sucio_desc:0 "Dirty money is the oxygen of organized crime. Banks, shell firms, property registries, and procurement chains will be brought under scrutiny."
 ARG_rise_extincion_de_los_carteles:0 "ExtinciÃ³n de los Carteles"
 ARG_rise_extincion_de_los_carteles_desc:0 "The state will not merely contain cartel influence. It will make cartel power incompatible with Argentine territory."
 ARG_rise_red_nacional_de_vigilancia:0 "Red Nacional de Vigilancia"
 ARG_rise_red_nacional_de_vigilancia_desc:0 "Surveillance, databases, field reporting, and strategic analysis become instruments for protecting growth before threats mature."
 ARG_rise_custodia_de_infraestructuras_criticas:0 "Custodia de Infraestructuras CrÃ­ticas"
 ARG_rise_custodia_de_infraestructuras_criticas_desc:0 "Energy, ports, dams, reactors, data networks, and industrial corridors are now national security assets."
 ARG_rise_contrainteligencia_interior:0 "Contrainteligencia Interior"
 ARG_rise_contrainteligencia_interior_desc:0 "Foreign destabilization, criminal penetration, and political sabotage require a domestic counterintelligence culture."
 ARG_rise_el_estado_impermeable:0 "El Estado Impermeable"
 ARG_rise_el_estado_impermeable_desc:0 "An impermeable state does not mean a loud state. It means one that detects infiltration, closes channels, and protects its strategic organs."
 ARG_rise_la_republica_inexpugnable:0 "La RepÃºblica Inexpugnable"
 ARG_rise_la_republica_inexpugnable_desc:0 "Argentina becomes a republic difficult to corrupt, difficult to infiltrate, and difficult to destabilize: a secure platform for industry, migration, energy, and continental power."
 ARG_rise_security_state_foundation:0 "Security State Foundation"
 ARG_rise_security_state_foundation_desc:0 "The new order begins by making security a permanent administrative function: disciplined, audited, and tied to national development."
 ARG_rise_legal_precision_code:0 "Legal Precision Code"
 ARG_rise_legal_precision_code_desc:0 "A precise state needs precise law. Procedures are shortened, loopholes narrowed, and public authority made harder to exhaust."
 ARG_rise_integrity_tribunals:0 "Integrity Tribunals"
 ARG_rise_integrity_tribunals_desc:0 "Specialized courts give the state a controlled instrument against corruption, institutional capture, and strategic criminal penetration."
 ARG_rise_high_performance_prosecutors:0 "High Performance Prosecutors"
 ARG_rise_high_performance_prosecutors_desc:0 "Prosecution is reorganized around tempo, data, and coordination with national security institutions."
 ARG_rise_state_sentence:0 "Sentence of the State"
 ARG_rise_state_sentence_desc:0 "The state speaks through procedure, evidence, and consequence. Its judgment becomes quieter, faster, and more difficult to evade."
 ARG_rise_federal_security_command:0 "Federal Security Command"
 ARG_rise_federal_security_command_desc:0 "Federal and provincial security organs are drawn into a common architecture of command, reporting, and operational discipline."
 ARG_rise_controlled_cities:0 "Controlled Cities"
 ARG_rise_controlled_cities_desc:0 "Urban order protects factories, stations, ports, offices, families, and the credibility of the Argentine model."
 ARG_rise_internal_corridor_control:0 "Internal Corridor Control"
 ARG_rise_internal_corridor_control_desc:0 "The routes used by criminal economies are mapped as infrastructure: roads, warehouses, crossings, cash flows, and institutional weak points."
 ARG_rise_civil_steel_peace:0 "Civil Peace of Steel"
 ARG_rise_civil_steel_peace_desc:0 "Public security becomes firm without becoming theatrical, giving society the calm required for long national growth."
 ARG_rise_organized_crime_office:0 "Organized Crime Office"
 ARG_rise_organized_crime_office_desc:0 "Argentina treats organized crime as a system of finance, logistics, political cover, and territorial pressure."
 ARG_rise_gray_routes_crackdown:0 "Gray Routes Crackdown"
 ARG_rise_gray_routes_crackdown_desc:0 "Contraband, favors, illicit finance, and violent intermediaries are struck through their routes rather than their symbols."
 ARG_rise_dirty_money_closure:0 "Dirty Money Closure"
 ARG_rise_dirty_money_closure_desc:0 "The state follows dirty money through firms, contracts, property, banks, and procurement until it becomes visible enough to seize."
 ARG_rise_cartel_extinction_doctrine:0 "Cartel Extinction Doctrine"
 ARG_rise_cartel_extinction_doctrine_desc:0 "Cartel power is not allowed to coexist with Argentine sovereignty, investment, or urban order."
 ARG_rise_national_surveillance_grid:0 "National Surveillance Grid"
 ARG_rise_national_surveillance_grid_desc:0 "Databases, intelligence desks, field reports, and technical monitoring become a single protective nervous system."
 ARG_rise_critical_infrastructure_custody:0 "Critical Infrastructure Custody"
 ARG_rise_critical_infrastructure_custody_desc:0 "Ports, energy networks, dams, reactors, data systems, and industrial arteries are guarded as organs of national power."
 ARG_rise_domestic_counterintelligence:0 "Domestic Counterintelligence"
 ARG_rise_domestic_counterintelligence_desc:0 "Foreign penetration, sabotage, organized crime, and political destabilization are treated as overlapping threats."
 ARG_rise_impermeable_state:0 "Impermeable State"
 ARG_rise_impermeable_state_desc:0 "The Argentine state learns to absorb pressure without leaking authority, data, or institutional confidence."
 ARG_rise_impregnable_republic:0 "Impregnable Republic"
 ARG_rise_impregnable_republic_desc:0 "The republic is not merely stable; it is hardened, coordinated, and difficult to corrupt from within or destabilize from without."
 ARG_rise_new_paradise_opportunities_spirit:0 "Paradise of Opportunities"
 ARG_rise_new_paradise_opportunities_spirit_desc:0 "Argentina is opening a controlled but ambitious demographic strategy: work, migration, urban stability, and productive growth are tied into one national promise."
 ARG_rise_open_doors_work_spirit:0 "Open Doors to Work"
 ARG_rise_open_doors_work_spirit_desc:0 "Labor channels are being opened for migrants who can enter productive life quickly and reinforce the national workforce."
 ARG_rise_new_homeland_visas_spirit:0 "New Homeland Visas"
 ARG_rise_new_homeland_visas_spirit_desc:0 "A disciplined visa system gives Argentina the ability to attract workers and families without losing administrative control."
 ARG_rise_plata_corridors_spirit:0 "Plata Corridors"
 ARG_rise_plata_corridors_spirit_desc:0 "Migratory routes, transport hubs, and tax registration are being organized around the great economic corridors of the Plata."
 ARG_rise_frontier_families_spirit:0 "Frontier Families"
 ARG_rise_frontier_families_spirit_desc:0 "Settled families turn demographic attraction into permanent communities, work, schools, and local stability."
 ARG_rise_call_of_the_south_spirit:0 "Call of the South"
 ARG_rise_call_of_the_south_spirit_desc:0 "Argentina is becoming visible abroad as a serious destination for work, order, and long-term settlement."
 ARG_rise_roofs_for_millions_spirit:0 "Roofs for Millions"
 ARG_rise_roofs_for_millions_spirit_desc:0 "Housing capacity and urban planning are beginning to absorb workers into stable cities instead of informal pressure."
 ARG_rise_neighborhoods_of_future_spirit:0 "Neighborhoods of the Future"
 ARG_rise_neighborhoods_of_future_spirit_desc:0 "New districts are being organized around transport, services, families, and access to productive employment."
 ARG_rise_new_cities_spirit:0 "New Cities"
 ARG_rise_new_cities_spirit_desc:0 "Urban expansion is creating taxable, inhabitable, and economically useful space for the demographic rise ahead."
 ARG_rise_growth_avenues_spirit:0 "Avenues of Growth"
 ARG_rise_growth_avenues_spirit_desc:0 "Roads, offices, and urban services connect population growth with productive districts and state capacity."
 ARG_rise_great_austral_metropolis_spirit:0 "Great Austral Metropolis"
 ARG_rise_great_austral_metropolis_spirit_desc:0 "Argentina begins to imagine its cities at continental scale: dense, stable, connected, and attractive to new citizens."
 ARG_rise_desks_of_progress_spirit:0 "Desks of Progress"
 ARG_rise_desks_of_progress_spirit_desc:0 "Office work becomes a productive sector of its own, measuring, coordinating, and monetizing national growth."
 ARG_rise_high_value_services_spirit:0 "High Value Services"
 ARG_rise_high_value_services_spirit_desc:0 "Advanced services, logistics, finance, and administrative firms give the urban economy a stronger fiscal base."
 ARG_rise_plata_offices_spirit:0 "Plata Offices"
 ARG_rise_plata_offices_spirit_desc:0 "Office parks and service districts along the Plata form a modern administrative and commercial backbone."
 ARG_rise_market_administrators_spirit:0 "Market Administrators"
 ARG_rise_market_administrators_spirit_desc:0 "Better market administration improves taxation, service income, and the state's ability to read the economy."
 ARG_rise_salaried_class_spirit:0 "Salaried Class"
 ARG_rise_salaried_class_spirit_desc:0 "A larger salaried class gives Argentina a stable urban workforce, more efficient offices, and a broader social base for growth."
 ARG_rise_hands_to_factory_spirit:0 "Hands to the Factory"
 ARG_rise_hands_to_factory_spirit_desc:0 "Workers return to industrial employment as factories become a practical answer to unemployment and stagnation."
 ARG_rise_production_shifts_spirit:0 "Production Shifts"
 ARG_rise_production_shifts_spirit_desc:0 "Longer and better organized production schedules raise the output of the civilian industrial base."
 ARG_rise_employment_parks_spirit:0 "Employment Parks"
 ARG_rise_employment_parks_spirit_desc:0 "Industrial parks are built around hiring capacity, workforce absorption, and steady formal employment."
 ARG_rise_national_productive_contract_spirit:0 "National Productive Contract"
 ARG_rise_national_productive_contract_spirit_desc:0 "The state, firms, and workers are bound into a practical agreement: productivity first, stability through work."
 ARG_rise_working_nation_spirit:0 "Working Nation"
 ARG_rise_working_nation_spirit_desc:0 "Argentina's recovery becomes visible in factories, payrolls, production lines, and a workforce that expects growth."
 ARG_rise_first_civic_oath_spirit:0 "First Civic Oath"
 ARG_rise_first_civic_oath_spirit_desc:0 "New arrivals and old citizens are tied together by civic discipline, work, and a shared expectation of order."
 ARG_rise_language_and_trade_spirit:0 "Language and Trade"
 ARG_rise_language_and_trade_spirit_desc:0 "Integration through language, training, and useful skills turns migration into productive national capacity."
 ARG_rise_integration_schools_spirit:0 "Integration Schools"
 ARG_rise_integration_schools_spirit_desc:0 "Schools and training centers help new families enter Argentine life through work, language, and practical formation."
 ARG_rise_shared_discipline_spirit:0 "Shared Discipline"
 ARG_rise_shared_discipline_spirit_desc:0 "A common civic discipline stabilizes urban growth and strengthens the fiscal logic of integration."
 ARG_rise_one_productive_people_spirit:0 "One Productive People"
 ARG_rise_one_productive_people_spirit_desc:0 "The demographic project becomes a productive people: integrated, urban, taxable, and increasingly confident in Argentina's future."
 ARG_rise_southern_gravity_spirit:0 "Southern Gravity"
 ARG_rise_southern_gravity_spirit_desc:0 "Argentina begins to pull regional diplomacy, trade, security, and influence into its own field of gravity."
 ARG_rise_buenos_aires_meridian_spirit:0 "Buenos Aires Meridian"
 ARG_rise_buenos_aires_meridian_spirit_desc:0 "Buenos Aires becomes the reference point through which southern affairs are measured and organized."
 ARG_rise_productive_embassies_spirit:0 "Productive Embassies"
 ARG_rise_productive_embassies_spirit_desc:0 "Diplomacy is reorganized around investment, contracts, economic mapping, and strategic access."
 ARG_rise_southern_cone_voice_spirit:0 "Voice of the Southern Cone"
 ARG_rise_southern_cone_voice_spirit_desc:0 "Argentina presents itself as the stable and serious voice of the southern cone."
 ARG_rise_prestige_of_stability_spirit:0 "Prestige of Stability"
 ARG_rise_prestige_of_stability_spirit_desc:0 "Order, fiscal discipline, and industrial recovery make Argentine influence easier to accept."
 ARG_rise_plata_doctrine_spirit:0 "Plata Doctrine"
 ARG_rise_plata_doctrine_spirit_desc:0 "The Plata basin becomes a doctrine of trade, ports, migration, security, and regional direction."
 ARG_rise_plata_table_spirit:0 "Plata Table"
 ARG_rise_plata_table_spirit_desc:0 "Regional coordination begins with procedures, transport, finance, and administrative habits."
 ARG_rise_mercosur_corridors_spirit:0 "Mercosur Corridors"
 ARG_rise_mercosur_corridors_spirit_desc:0 "Infrastructure and commercial corridors turn integration into practical dependence."
 ARG_rise_austral_stability_credit_spirit:0 "Austral Stability Credit"
 ARG_rise_austral_stability_credit_spirit_desc:0 "Argentine credit and investment become tools of patience, leverage, and regional alignment."
 ARG_rise_ports_under_our_shadow_spirit:0 "Ports Under Our Shadow"
 ARG_rise_ports_under_our_shadow_spirit_desc:0 "Ports, customs, exports, and logistics carry Argentine influence through everyday commerce."
 ARG_rise_dependency_belt_spirit:0 "Dependency Belt"
 ARG_rise_dependency_belt_spirit_desc:0 "Dependency is built through credit, logistics, spare parts, contracts, and administrative habit."
 ARG_rise_steel_and_light_diplomacy_spirit:0 "Steel and Light Diplomacy"
 ARG_rise_steel_and_light_diplomacy_spirit_desc:0 "Resources and energy become diplomatic instruments in Argentina's continental strategy."
 ARG_rise_vaca_muerta_continental_gaze_spirit:0 "Vaca Muerta's Continental Gaze"
 ARG_rise_vaca_muerta_continental_gaze_spirit_desc:0 "The shale fields look beyond domestic demand and toward regional dependence."
 ARG_rise_minerals_for_region_spirit:0 "Minerals for the Region"
 ARG_rise_minerals_for_region_spirit_desc:0 "Metals from Argentine soil feed regional industries that learn to depend on Argentine stability."
 ARG_rise_austral_oil_routes_spirit:0 "Austral Oil Routes"
 ARG_rise_austral_oil_routes_spirit_desc:0 "Oil routes become routes of obligation, investment, logistics, and political consequence."
 ARG_rise_price_of_sovereignty_spirit:0 "Price of Sovereignty"
 ARG_rise_price_of_sovereignty_spirit_desc:0 "Access to Argentine resources is no longer merely commercial; it carries strategic conditions."
 ARG_rise_continental_office_spirit:0 "Continental Office"
 ARG_rise_continental_office_spirit_desc:0 "A permanent analytical office studies the continent as a system to be influenced."
 ARG_rise_loyalty_networks_spirit:0 "Loyalty Networks"
 ARG_rise_loyalty_networks_spirit_desc:0 "Careers, favors, training, advisers, and shared interests become durable political networks."
 ARG_rise_press_of_order_spirit:0 "Press of Order"
 ARG_rise_press_of_order_spirit_desc:0 "The Argentine model becomes visible abroad as a promise of order, growth, and seriousness."
 ARG_rise_permanent_interests_spirit:0 "Permanent Interests"
 ARG_rise_permanent_interests_spirit_desc:0 "Argentina cultivates institutions and factions that understand where permanence lies."
 ARG_rise_administrative_shadow_spirit:0 "Administrative Shadow"
 ARG_rise_administrative_shadow_spirit_desc:0 "Influence becomes bureaucratic, procedural, quiet, and difficult to reverse."
 ARG_rise_continental_atlas_spirit:0 "Continental Atlas"
 ARG_rise_continental_atlas_spirit_desc:0 "Before command comes knowledge: routes, ports, industries, borders, armies, and fractures."
 ARG_rise_security_frontier_spirit:0 "Security Frontier"
 ARG_rise_security_frontier_spirit_desc:0 "Borders become belts of surveillance, preparation, logistics, and influence defense."
 ARG_rise_america_command_preparation_spirit:0 "America Command Preparation"
 ARG_rise_america_command_preparation_spirit_desc:0 "Continental planning matures slowly, before any open confrontation becomes necessary."
 ARG_rise_southern_ultimatum_spirit:0 "Southern Ultimatum"
 ARG_rise_southern_ultimatum_spirit_desc:0 "An ultimatum matters only when decades of influence, industry, intelligence, and logistics stand behind it."
 ARG_rise_american_hour_spirit:0 "American Hour"
 ARG_rise_american_hour_spirit_desc:0 "The continent begins to feel that Argentine power is no longer an ambition, but a historical fact gathering weight."
 ARG_rise_silos_del_parana_spirit:0 "Parana Storage Network"
 ARG_rise_silos_del_parana_spirit_desc:0 "Silos, sorting facilities, and rural logistics are giving the grain economy a steadier rhythm."
 ARG_rise_puertos_del_grano_spirit:0 "Grain Port Corridors"
 ARG_rise_puertos_del_grano_spirit_desc:0 "River ports and export terminals turn agricultural output into predictable state revenue."
 ARG_rise_frigorificos_nacionales_spirit:0 "National Cold Chain"
 ARG_rise_frigorificos_nacionales_spirit_desc:0 "Meatpacking, cold storage, and certified processing reconnect ranches to cities and foreign buyers."
 ARG_rise_marca_argentina_de_exportacion_spirit:0 "Argentine Export Mark"
 ARG_rise_marca_argentina_de_exportacion_spirit_desc:0 "Reliable standards and export identity let Argentina sell confidence as well as grain and beef."
 ARG_rise_talleres_abiertos_spirit:0 "Open Workshops"
 ARG_rise_talleres_abiertos_spirit_desc:0 "Workshops, small suppliers, and repair yards are beginning to move again after years of paralysis."
 ARG_rise_credito_para_producir_spirit:0 "Credit for Production"
 ARG_rise_credito_para_producir_spirit_desc:0 "Credit is redirected toward firms that hire, build, repair, and produce."
 ARG_rise_obras_de_emergencia_spirit:0 "Emergency Works"
 ARG_rise_obras_de_emergencia_spirit_desc:0 "Targeted public works absorb unemployment and restore the material confidence of the country."
 ARG_rise_el_pulso_del_empleo_spirit:0 "Pulse of Employment"
 ARG_rise_el_pulso_del_empleo_spirit_desc:0 "Formal work, regular wages, and visible movement give the recovery a human pulse."
 ARG_rise_parques_industriales_ligeros_spirit:0 "Light Industrial Parks"
 ARG_rise_parques_industriales_ligeros_spirit_desc:0 "Small industrial parks cluster suppliers, technicians, workshops, and early manufacturing."
 ARG_rise_maquinas_para_la_recuperacion_spirit:0 "Machines for Recovery"
 ARG_rise_maquinas_para_la_recuperacion_spirit_desc:0 "Machine tools, repairs, and replacement parts begin rebuilding productive capacity."
 ARG_rise_proveedores_nacionales_spirit:0 "National Suppliers"
 ARG_rise_proveedores_nacionales_spirit_desc:0 "Domestic suppliers keep value inside Argentina and strengthen the industrial chain."
 ARG_rise_la_fabrica_ordenada_spirit:0 "Ordered Factory"
 ARG_rise_la_fabrica_ordenada_spirit_desc:0 "Schedules, maintenance, suppliers, and production targets restore discipline to the factory floor."
 ARG_rise_distritos_de_oficina_spirit:0 "Office Districts"
 ARG_rise_distritos_de_oficina_spirit_desc:0 "Modern office districts organize accounting, logistics, finance, and administration around the recovery."
 ARG_rise_contabilidad_del_crecimiento_spirit:0 "Accounting of Growth"
 ARG_rise_contabilidad_del_crecimiento_spirit_desc:0 "Growth becomes more useful when it can be counted, taxed, financed, and directed."
 ARG_rise_ciudades_productivas_spirit:0 "Productive Cities"
 ARG_rise_ciudades_productivas_spirit_desc:0 "Urban growth begins to serve work, offices, transport, services, and stable households."
 ARG_rise_administracion_productiva_spirit:0 "Productive Administration"
 ARG_rise_administracion_productiva_spirit_desc:0 "The state learns to read the recovery and convert economic movement into capacity."
 ARG_rise_contratos_del_excedente_energetico:0 "Contratos del Excedente EnergÃƒÂ©tico"
 ARG_rise_contratos_del_excedente_energetico_desc:0 "The great works of river, atom, wind, and sun have created more power than the old economy can immediately absorb. Argentina can now turn surplus energy into contracts, industrial corridors, regional leverage, and disciplined fiscal revenue without wasting the foundation of its sovereignty."
 ARG_rise_energy_surplus_commercialization:0 "Energy Surplus Commercialization"
 ARG_rise_energy_surplus_commercialization_desc:0 "Argentina has begun treating surplus electricity as a strategic commercial asset. Energy is no longer only domestic capacity; it is contract power, industrial attraction, and continental leverage."
 ARG_rise_mercosur_power_export_contract:0 "Mercosur Power Export Contract"
 ARG_rise_mercosur_power_export_contract_desc:0 "A portion of Argentina's surplus generation is committed to regional buyers, strengthening export revenue and tying neighboring economies to Argentine reliability."
 ARG_rise_electroindustrial_power_contracts:0 "Electroindustrial Power Contracts"
 ARG_rise_electroindustrial_power_contracts_desc:0 "Energy-intensive firms receive guaranteed access to Argentine power in exchange for fiscal contribution, employment, and productive anchoring."
 ARG_rise_continental_grid_services:0 "Continental Grid Services"
 ARG_rise_continental_grid_services_desc:0 "Argentina reserves a larger block of electricity for continental balancing, emergency supply, and strategic energy services. The grid becomes a treasury instrument and a diplomatic fact."
 ARG_rise_energy_surplus_decisions:0 "Argentine Energy Surplus"
 ARG_rise_energy_surplus_decisions_desc:0 "Surplus electricity can be commercialized through export contracts, electroindustrial demand, and regional grid services. Each contract consumes part of the national surplus while generating treasury and fiscal benefits."
 ARG_rise_export_energy_to_mercosur:0 "Export Energy to Mercosur"
 ARG_rise_export_energy_to_mercosur_desc:0 "Commit a modest block of surplus electricity to regional buyers. The contract produces immediate treasury revenue and temporary export benefits, but consumes part of our energy surplus."
 ARG_rise_sign_electroindustrial_contracts:0 "Sign Electroindustrial Contracts"
 ARG_rise_sign_electroindustrial_contracts_desc:0 "Sell guaranteed power access to energy-intensive industrial and office-sector investors. This converts surplus electricity into productive fiscal activity."
 ARG_rise_sell_grid_services_to_the_continent:0 "Sell Grid Services to the Continent"
 ARG_rise_sell_grid_services_to_the_continent_desc:0 "Use Argentina's surplus electricity as a continental balancing service. The contract is lucrative, but it reserves a serious block of power for external commitments."
 ARG_rise_los_anos_de_ceniza:0 "Los Anos de Ceniza"
 ARG_rise_los_anos_de_ceniza_desc:0 "The Argentine economy enters its ash years: exhausted public trust, emergency budgets, failing confidence, and a state forced to choose survival over dignity."
 ARG_rise_cuentas_al_borde_del_abismo:0 "Cuentas al Borde del Abismo"
 ARG_rise_cuentas_al_borde_del_abismo_desc:0 "Every ministry, province, bank, and debtor is brought before the numbers. The republic must see the abyss before it can move away from it."
 ARG_rise_el_ajuste_inevitable:0 "El Ajuste Inevitable"
 ARG_rise_el_ajuste_inevitable_desc:0 "There are cuts no government wants to make, and bills no government can ignore. The old parties sell necessity as prudence and lose another piece of the nation."
 ARG_rise_respirar_con_deuda:0 "Respirar con Deuda"
 ARG_rise_respirar_con_deuda_desc:0 "Argentina does not escape the debt overnight. It learns to breathe beneath it, buying time from creditors and squeezing every fragile margin."
 ARG_rise_la_moneda_herida:0 "La Moneda Herida"
 ARG_rise_la_moneda_herida_desc:0 "The peso becomes a wound carried in every wage, price, and savings account. Trust in the democratic managers of the crisis begins to rot."
 ARG_rise_pan_trabajo_y_emergencia:0 "Pan, Trabajo y Emergencia"
 ARG_rise_pan_trabajo_y_emergencia_desc:0 "No miracle can be promised. Only bread, emergency work, and the bare minimum needed to keep the streets from swallowing the state."
 ARG_rise_talleres_de_supervivencia:0 "Talleres de Supervivencia"
 ARG_rise_talleres_de_supervivencia_desc:0 "Small workshops, repaired machines, improvised shifts, and exhausted workers keep a thin pulse beating through the productive economy."
 ARG_rise_mercados_de_ultima_hora:0 "Mercados de Ultima Hora"
 ARG_rise_mercados_de_ultima_hora_desc:0 "Exports, emergency deals, and last-minute commercial arrangements become tools of survival rather than prosperity."
 ARG_rise_la_economia_resiste:0 "La EconomÃƒÂ­a Resiste"
 ARG_rise_la_economia_resiste_desc:0 "The economy has not recovered. But it has not died. That difference is enough to carry Argentina into the next bitter month."
 ARG_rise_barriles_de_emergencia:0 "Barriles de Emergencia"
 ARG_rise_barriles_de_emergencia_desc:0 "Every usable barrel matters. Argentina turns toward emergency extraction to keep transport, factories, and lights from failing."
 ARG_rise_luz_para_el_invierno:0 "Luz para el Invierno"
 ARG_rise_luz_para_el_invierno_desc:0 "The first emergency fossil plant is not a monument. It is smoke, concrete, and necessity: power enough to endure the cold season."
 ARG_rise_las_reservas_del_dia_siguiente:0 "Las Reservas del Dia Siguiente"
 ARG_rise_las_reservas_del_dia_siguiente_desc:0 "The country builds for tomorrow because today is already compromised. More fossil capacity is forced into existence before the grid breaks."
 ARG_rise_exportar_para_sobrevivir:0 "Exportar para Sobrevivir"
 ARG_rise_exportar_para_sobrevivir_desc:0 "Resources leave the country not as triumph, but as oxygen. Argentina sells what it can so the state can keep moving."
 ARG_rise_la_transicion_funesta:0 "La Transicion Funesta"
 ARG_rise_la_transicion_funesta_desc:0 "Austerity becomes structure, emergency becomes doctrine, and the population learns that harder medicine may be accepted when the old cure has failed."
 ARG_rise_la_democracia_exhausta:0 "La Democracia Exhausta"
 ARG_rise_la_democracia_exhausta_desc:0 "The democratic order survives institutionally, but not emotionally. A large part of the nation begins looking for force, discipline, and a new historical will."
 ARG_rise_crisis_de_ceniza_spirit:0 "Crisis de Ceniza"
 ARG_rise_crisis_de_ceniza_spirit_desc:0 "Argentina has entered a phase of exhaustion and emergency in which every temporary measure weakens faith in the old system."
 ARG_rise_cuentas_al_borde_spirit:0 "Cuentas al Borde del Abismo"
 ARG_rise_cuentas_al_borde_spirit_desc:0 "Emergency fiscal accounting raises revenue, but the political cost of the crisis is immediate."
 ARG_rise_ajuste_inevitable_spirit:0 "Ajuste Inevitable"
 ARG_rise_ajuste_inevitable_spirit_desc:0 "State costs are forced downward through painful measures that accelerate social distrust."
 ARG_rise_respirar_con_deuda_spirit:0 "Respirar con Deuda"
 ARG_rise_respirar_con_deuda_spirit_desc:0 "Debt pressure eases slightly, but only enough for the country to keep breathing."
 ARG_rise_moneda_herida_spirit:0 "Moneda Herida"
 ARG_rise_moneda_herida_spirit_desc:0 "The damaged currency increases fiscal pressure and pushes more citizens away from the old political center."
 ARG_rise_pan_trabajo_emergencia_spirit:0 "Pan, Trabajo y Emergencia"
 ARG_rise_pan_trabajo_emergencia_spirit_desc:0 "Emergency labor programs keep unemployment politically survivable, though not painless."
 ARG_rise_talleres_supervivencia_spirit:0 "Talleres de Supervivencia"
 ARG_rise_talleres_supervivencia_spirit_desc:0 "Improvised workshops and repaired productive chains keep basic industry alive."
 ARG_rise_mercados_ultima_hora_spirit:0 "Mercados de Ultima Hora"
 ARG_rise_mercados_ultima_hora_spirit_desc:0 "Last-minute export arrangements bring badly needed cash while feeding corruption and public disgust."
 ARG_rise_economia_resiste_spirit:0 "La EconomÃƒÂ­a Resiste"
 ARG_rise_economia_resiste_spirit_desc:0 "The economy remains fragile, but the worst collapse is delayed."
 ARG_rise_barriles_emergencia_spirit:0 "Barriles de Emergencia"
 ARG_rise_barriles_emergencia_spirit_desc:0 "Emergency oil extraction offers relief at a visible social and institutional cost."
 ARG_rise_luz_para_invierno_spirit:0 "Luz para el Invierno"
 ARG_rise_luz_para_invierno_spirit_desc:0 "Fossil generation is expanded quickly to prevent a deeper energy crisis."
 ARG_rise_reservas_dia_siguiente_spirit:0 "Reservas del Dia Siguiente"
 ARG_rise_reservas_dia_siguiente_spirit_desc:0 "The grid receives crude emergency capacity while oil output becomes a survival instrument."
 ARG_rise_exportar_para_sobrevivir_spirit:0 "Exportar para Sobrevivir"
 ARG_rise_exportar_para_sobrevivir_spirit_desc:0 "Resource exports are organized as a lifeline for the state."
 ARG_rise_transicion_funesta_spirit:0 "Transicion Funesta"
 ARG_rise_transicion_funesta_spirit_desc:0 "The public learns to accept harsher administration as the cost of avoiding collapse."
 ARG_rise_democracia_exhausta_spirit:0 "Democracia Exhausta"
 ARG_rise_democracia_exhausta_spirit_desc:0 "The institutions remain, but belief in the old political order has been badly hollowed out."
 ARG_rise.1.t:0 "I Tempi Funesti"
 ARG_rise.1.d:0 "L'Argentina sta entrando in una nuova epoca di incertezza. Le fabbriche rallentano, il debito cresce e lo Stato inizia a reggersi su misure dure, fredde, sempre piÃ¹ impopolari.\n\nNelle strade, nei ministeri e nei mercati, la fiducia si consuma lentamente. Il vecchio ordine democratico continua a esistere, ma sotto la superficie iniziano ad apparire le prime crepe.\n\nI partiti tradizionali parlano ancora il linguaggio della stabilitÃ , ma sempre piÃ¹ cittadini avvertono che qualcosa si sta spezzando. L'economia sopravvive, ma senza slancio. Le istituzioni resistono, ma senza convinzione.\n\nPer ora la Repubblica continua il suo cammino. Ma gli anni della cenere sono appena iniziati."
 ARG_rise.1.a:0 "Che Dio protegga l'Argentina."
 ARG_rise_pan_y_acero:0 "Pan y Acero"
 ARG_rise_pan_y_acero_desc:0 "Argentina turns from survival to rearmament. Bread remains the promise of the state, but steel becomes its method: factories, sacrifice, mobilization, and the first visible outline of continental power."
 ARG_rise_ejercito_del_acero_nacional:0 "Ejercito del Acero Nacional"
 ARG_rise_ejercito_del_acero_nacional_desc:0 "The army is reorganized as the land arm of the new industrial republic, built around discipline, logistics, and national production."
 ARG_rise_conscripcion_de_la_republica_productiva:0 "Conscripcion de la Republica Productiva"
 ARG_rise_conscripcion_de_la_republica_productiva_desc:0 "Military service is framed as a productive school of the nation, linking discipline, technical formation, and territorial duty."
 ARG_rise_batallones_del_interior:0 "Batallones del Interior"
 ARG_rise_batallones_del_interior_desc:0 "The interior provinces become a reservoir of organized manpower, prepared for defense, logistics, and national mobilization."
 ARG_rise_oficiales_de_la_nueva_escuela:0 "Oficiales de la Nueva Escuela"
 ARG_rise_oficiales_de_la_nueva_escuela_desc:0 "A new officer class is formed around technical competence, operational planning, and loyalty to the transformed Argentine state."
 ARG_rise_doctrina_de_maniobra_austral:0 "Doctrina de Maniobra Austral"
 ARG_rise_doctrina_de_maniobra_austral_desc:0 "The army begins to study the continent as a field of depth, distance, rivers, mountains, cities, and decisive maneuver."
 ARG_rise_talleres_blindados_del_plata:0 "Talleres Blindados del Plata"
 ARG_rise_talleres_blindados_del_plata_desc:0 "Industrial workshops are aligned with armored modernization, turning civilian capacity into the first machinery of national force."
 ARG_rise_orugas_sobre_la_pampa:0 "Orugas sobre la Pampa"
 ARG_rise_orugas_sobre_la_pampa_desc:0 "Tracked vehicles, maintenance yards, and mechanized formations begin to reshape the strategic geography of the Pampas."
 ARG_rise_cuerpo_mecanizado_san_martin:0 "Cuerpo Mecanizado San Martin"
 ARG_rise_cuerpo_mecanizado_san_martin_desc:0 "Argentina prepares a mechanized corps worthy of long roads, hard borders, and the weight of a continental doctrine."
 ARG_rise_la_lanza_continental:0 "La Lanza Continental"
 ARG_rise_la_lanza_continental_desc:0 "The mechanized arm is imagined not as parade steel, but as the spear of a future operational system."
 ARG_rise_artilleria_de_precision:0 "Artilleria de Precision"
 ARG_rise_artilleria_de_precision_desc:0 "Firepower becomes a matter of sensors, calculation, industry, and patient accumulation rather than spectacle."
 ARG_rise_logistica_de_la_profundidad:0 "Logistica de la Profundidad"
 ARG_rise_logistica_de_la_profundidad_desc:0 "The army learns that a continental force is built first through depots, fuel, workshops, railheads, and command discipline."
 ARG_rise_puentes_rieles_y_municion:0 "Puentes, Rieles y Municion"
 ARG_rise_puentes_rieles_y_municion_desc:0 "Bridges, rails, and ammunition networks bind industry to maneuver, giving the army endurance before glory."
 ARG_rise_el_martillo_operacional:0 "El Martillo Operacional"
 ARG_rise_el_martillo_operacional_desc:0 "The land arm prepares to concentrate force methodically, striking only after the state has built the weight behind the blow."
 ARG_rise_comando_terrestre_austral:0 "Comando Terrestre Austral"
 ARG_rise_comando_terrestre_austral_desc:0 "The land columns are brought under a modern command architecture for planning, readiness, and future continental operations."
 ARG_rise_la_columna_del_continente:0 "La Columna del Continente"
 ARG_rise_la_columna_del_continente_desc:0 "Argentina now possesses the outline of a land force that can carry national power beyond defense and into history."
 ARG_rise_fuerza_aerea_de_la_nueva_era:0 "Fuerza Aerea de la Nueva Era"
 ARG_rise_fuerza_aerea_de_la_nueva_era_desc:0 "The air force is rebuilt as a technical service of sovereignty, reconnaissance, deterrence, and national reach."
 ARG_rise_escuelas_del_cielo_austral:0 "Escuelas del Cielo Austral"
 ARG_rise_escuelas_del_cielo_austral_desc:0 "Training institutions become the first runway of air power, producing pilots, technicians, controllers, and doctrine."
 ARG_rise_pilotos_del_horizonte:0 "Pilotos del Horizonte"
 ARG_rise_pilotos_del_horizonte_desc:0 "A new generation of pilots is trained for distance, endurance, and the demanding geography of the southern continent."
 ARG_rise_mando_aereo_integrado:0 "Mando Aereo Integrado"
 ARG_rise_mando_aereo_integrado_desc:0 "Air operations are reorganized around integrated command, information discipline, and national response time."
 ARG_rise_alas_de_interdiccion:0 "Alas de Interdiccion"
 ARG_rise_alas_de_interdiccion_desc:0 "The air force studies interdiction as the art of paralyzing hostile movement before armies collide."
 ARG_rise_fabricas_de_motores_y_alas:0 "Fabricas de Motores y Alas"
 ARG_rise_fabricas_de_motores_y_alas_desc:0 "The aircraft industry begins with components, repair lines, engines, avionics, and the patience of industrial learning."
 ARG_rise_cazas_para_la_soberania:0 "Cazas para la Soberania"
 ARG_rise_cazas_para_la_soberania_desc:0 "Fighter modernization is treated as sovereignty in metal form: expensive, technical, and politically unavoidable."
 ARG_rise_drones_de_observacion_nacional:0 "Drones de Observacion Nacional"
 ARG_rise_drones_de_observacion_nacional_desc:0 "Unmanned systems give the state eyes over borders, infrastructure, sea lanes, and the productive interior."
 ARG_rise_cielo_cerrado:0 "Cielo Cerrado"
 ARG_rise_cielo_cerrado_desc:0 "Argentina prepares layered control of its airspace, turning warning, interception, and command into a national shield."
 ARG_rise_radar_sobre_la_cordillera:0 "Radar sobre la Cordillera"
 ARG_rise_radar_sobre_la_cordillera_desc:0 "Sensors rise over the mountains and approaches, giving the state a clearer eye over the strategic horizon."
 ARG_rise_defensa_aerea_estratificada:0 "Defensa Aerea Estratificada"
 ARG_rise_defensa_aerea_estratificada_desc:0 "Air defense becomes a network rather than a battery: warning, launchers, command, and layered denial."
 ARG_rise_aeronaves_de_transporte_estrategico:0 "Aeronaves de Transporte Estrategico"
 ARG_rise_aeronaves_de_transporte_estrategico_desc:0 "Strategic transport links the republic to its own distances, making mobilization credible across a vast country."
 ARG_rise_la_red_del_aire:0 "La Red del Aire"
 ARG_rise_la_red_del_aire_desc:0 "Bases, radars, transport, drones, and fighters are fused into a disciplined air network for the new state."
 ARG_rise_comando_aeroespacial_argentino:0 "Comando Aeroespacial Argentino"
 ARG_rise_comando_aeroespacial_argentino_desc:0 "The air force begins to look upward, linking aircraft, sensors, satellites, and future aerospace doctrine."
 ARG_rise_el_trueno_del_sur:0 "El Trueno del Sur"
 ARG_rise_el_trueno_del_sur_desc:0 "The southern sky becomes an instrument of national force, prepared for deterrence, surveillance, and continental reach."
 ARG_rise_armada_del_atlantico_sur:0 "Armada del Atlantico Sur"
 ARG_rise_armada_del_atlantico_sur_desc:0 "The navy is rebuilt around the South Atlantic, maritime sovereignty, industrial shipbuilding, and long-range logistics."
 ARG_rise_astilleros_de_la_soberania:0 "Astilleros de la Soberania"
 ARG_rise_astilleros_de_la_soberania_desc:0 "Shipyards become the naval face of industrial sovereignty, binding steel, ports, labor, and strategic patience."
 ARG_rise_cascos_del_plata:0 "Cascos del Plata"
 ARG_rise_cascos_del_plata_desc:0 "Hull production begins the slow material recovery of Argentine sea power, one industrial lesson at a time."
 ARG_rise_fragatas_de_proyeccion:0 "Fragatas de Proyeccion"
 ARG_rise_fragatas_de_proyeccion_desc:0 "The navy studies frigates as tools of escort, presence, denial, and future expeditionary credibility."
 ARG_rise_escuadra_de_alta_mar:0 "Escuadra de Alta Mar"
 ARG_rise_escuadra_de_alta_mar_desc:0 "Argentina prepares a fleet able to act beyond coastal symbolism, sustained by shipyards and doctrine."
 ARG_rise_submarinos_de_la_profundidad:0 "Submarinos de la Profundidad"
 ARG_rise_submarinos_de_la_profundidad_desc:0 "Submarine warfare returns as a doctrine of silence, endurance, denial, and strategic uncertainty in the South Atlantic."
 ARG_rise_silencio_bajo_el_atlantico:0 "Silencio bajo el Atlantico"
 ARG_rise_silencio_bajo_el_atlantico_desc:0 "The submarine arm trains for invisibility beneath the routes, platforms, and waters that define maritime sovereignty."
 ARG_rise_patrulla_de_la_plataforma:0 "Patrulla de la Plataforma"
 ARG_rise_patrulla_de_la_plataforma_desc:0 "Naval patrols protect offshore resources, sea lanes, fisheries, and the industrial perimeter of Argentine power."
 ARG_rise_el_puno_sumergido:0 "El Puno Sumergido"
 ARG_rise_el_puno_sumergido_desc:0 "The submerged arm becomes a strategic fist held below the waterline, forcing rivals to respect distance and uncertainty."
 ARG_rise_infanteria_de_marina_austral:0 "Infanteria de Marina Austral"
 ARG_rise_infanteria_de_marina_austral_desc:0 "Marine forces are prepared for ports, islands, river mouths, littoral corridors, and the harsh geography of the south."
 ARG_rise_bases_del_litoral:0 "Bases del Litoral"
 ARG_rise_bases_del_litoral_desc:0 "The coastline is organized through bases, maintenance points, surveillance posts, and hardened logistics."
 ARG_rise_convoyes_y_puertos_de_guerra:0 "Convoyes y Puertos de Guerra"
 ARG_rise_convoyes_y_puertos_de_guerra_desc:0 "Ports and convoy systems are prepared to sustain the fleet, the army, and the industrial state in crisis."
 ARG_rise_logistica_oceanica:0 "Logistica Oceanica"
 ARG_rise_logistica_oceanica_desc:0 "Oceanic logistics transform naval ambition from a flag at sea into a system that can endure distance."
 ARG_rise_comando_naval_del_sur:0 "Comando Naval del Sur"
 ARG_rise_comando_naval_del_sur_desc:0 "Shipyards, submarines, patrols, marines, and ports are subordinated to a strategic command for the South Atlantic."
 ARG_rise_la_muralla_azul:0 "La Muralla Azul"
 ARG_rise_la_muralla_azul_desc:0 "The sea ceases to be an exposed frontier and becomes a blue wall: costly, industrial, and essential to Argentine destiny."
 ARG_rise_pan_y_acero_mobilization:0 "Mobilizacion de Pan y Acero"
 ARG_rise_pan_y_acero_mobilization_desc:0 "The rearmament drive has begun to draw civilian stability into the furnace of national military industry. Argentina gains will, factories, and strategic pressure, but the social cost is visible."
 ARG_rise_pan_y_acero_threat:0 "Argentina launches the Pan y Acero rearmament program"
 ARG_rise_ejercito_logistica_profunda:0 "Logistica Profunda del Ejercito"
 ARG_rise_ejercito_logistica_profunda_desc:0 "The army learns that continental power is not born from courage alone, but from fuel, supply, roads, workshops, and reserves moving in disciplined silence."
 ARG_rise_ejercito_cuerpo_mecanizado:0 "Cuerpo Mecanizado Argentino"
 ARG_rise_ejercito_cuerpo_mecanizado_desc:0 "Mechanized formations turn industry into movement, binding steel, fuel, and doctrine into the first hard instrument of continental maneuver."
 ARG_rise_ejercito_comando_continental:0 "Comando Continental del Ejercito"
 ARG_rise_ejercito_comando_continental_desc:0 "The army becomes a strategic institution of the new state: organized, supplied, hardened, and prepared for the geography of an entire continent."
 ARG_rise_fuerza_aerea_red_integrada:0 "Red Integrada del Aire"
 ARG_rise_fuerza_aerea_red_integrada_desc:0 "Airfields, controllers, radar posts, and command rooms are tied into a single nervous system for the defense of Argentine skies."
 ARG_rise_fuerza_aerea_superioridad_austral:0 "Superioridad Austral"
 ARG_rise_fuerza_aerea_superioridad_austral_desc:0 "The air force no longer thinks only in patrols, but in control: altitude, speed, interception, and the denial of the sky to any rival."
 ARG_rise_fuerza_aerea_comando_aeroespacial:0 "Comando Aeroespacial Nacional"
 ARG_rise_fuerza_aerea_comando_aeroespacial_desc:0 "The aerial arm becomes a national command of range, detection, interception, and strategic coordination over the southern cone."
 ARG_rise_armada_astilleros_atlantico:0 "Astilleros del Atlantico Sur"
 ARG_rise_armada_astilleros_atlantico_desc:0 "The navy begins in the shipyard: hulls, welders, docks, steel inventories, and the stubborn industrial patience of sea power."
 ARG_rise_armada_patrulla_submarina:0 "Patrulla Silenciosa de la Plataforma"
 ARG_rise_armada_patrulla_submarina_desc:0 "Below the South Atlantic, patrol routes become doctrine. Detection, endurance, and silence turn the continental shelf into a strategic shield."
 ARG_rise_armada_muralla_azul:0 "Doctrina de la Muralla Azul"
 ARG_rise_armada_muralla_azul_desc:0 "The fleet, escorts, ports, and patrol lines form a blue wall around Argentina's projection, trade, and future oceanic command."
