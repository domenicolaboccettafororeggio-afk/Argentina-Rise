 ARG_rise_buenos_aires_conference_decisions:0 "Conferencia de Buenos Aires"
 ARG_rise_estado_de_la_conferencia:0 "Estado de la Conferencia"
 ARG_rise_estado_de_la_conferencia_desc:0 "La Conferencia de Buenos Aires reúne a las delegaciones americanas bajo la mirada de Buenos Aires."
 ARG_rise_conference_table_04:0 "Carta Constitucional de la Confederacion Americana"
 ARG_rise_conference_table_04_desc:0 "La fase territorial ha terminado. Buenos Aires convoca a las delegaciones para definir el orden comun de la Confederacion Americana."
 ARG_rise.73.t:0 "Carta Constitucional de la Confederacion Americana"
 ARG_rise.73.d:0 "ESPAÑOL:\nLas delegaciones reconocen que la fase de adhesiones territoriales ha concluido. Ya no se discuten anexiones ni protectorados. Ahora la Conferencia debe ordenar juridicamente el nuevo espacio americano bajo una carta comun.\n\nENGLISH:\nThe delegations recognize that the phase of territorial accessions has ended. Annexations and protectorates are no longer on the table. The Conference must now give legal form to the new American space under a common charter.\n\nITALIANO:\nLe delegazioni riconoscono che la fase delle adesioni territoriali e conclusa. Non si discutono piu annessioni o protettorati. La Conferenza deve ora dare forma giuridica al nuovo spazio americano sotto una carta comune."
 ARG_rise.73.a:0 "Abrir la sesion constitucional."
 ARG_rise.74.t:0 "La Ratificacion de la Carta"
 ARG_rise.74.d:0 "ESPAÑOL:\nEl texto final define ciudadania, administracion, defensa comun y la integracion politica de los territorios incorporados durante la Conferencia. La Confederacion puede aprobarlo ahora o retrasar su ratificacion.\n\nENGLISH:\nThe final text defines citizenship, administration, common defense and the political integration of the territories incorporated during the Conference. The Confederation can approve it now or delay ratification.\n\nITALIANO:\nIl testo finale definisce cittadinanza, amministrazione, difesa comune e integrazione politica dei territori incorporati durante la Conferenza. La Confederazione puo approvarlo ora o rinviarne la ratifica."
 ARG_rise.74.a:0 "Aprobar la Carta."
 ARG_rise.74.b:0 "Rinviare la ratifica."
 ARG_rise_conference_table_05:0 "Mercado Comun Americano"
 ARG_rise_conference_table_05_desc:0 "La Conferencia abandona la expansion territorial y entra en la fase economica: comercio, obras, circulacion y mercado comun."
 ARG_rise.75.t:0 "Mercado Comun Americano"
 ARG_rise.75.d:0 "ESPAÑOL:\nLa Conferencia entra en su fase economica. Los delegados ya no discuten fronteras, sino puertos, rutas, aduanas, energia, capitales y la circulacion de bienes dentro de un espacio americano comun.\n\nENGLISH:\nThe Conference enters its economic phase. The delegates no longer discuss borders, but ports, roads, customs, energy, capital and the movement of goods inside a common American space.\n\nITALIANO:\nLa Conferenza entra nella sua fase economica. I delegati non discutono piu confini, ma porti, strade, dogane, energia, capitali e circolazione delle merci dentro uno spazio americano comune."
 ARG_rise.75.a:0 "Presentar el proyecto economico."
 ARG_rise.76.t:0 "La Firma del Mercado Comun"
 ARG_rise.76.d:0 "ESPAÑOL:\nEl acuerdo propone reducir barreras internas, coordinar obras logisticas y convertir a Buenos Aires en el centro financiero del nuevo mercado continental. La alternativa es retrasar la liberalizacion hasta que la estructura politica este mas consolidada.\n\nENGLISH:\nThe agreement proposes lowering internal barriers, coordinating logistics projects and turning Buenos Aires into the financial center of the new continental market. The alternative is to delay liberalization until the political structure is more consolidated.\n\nITALIANO:\nL accordo propone di ridurre le barriere interne, coordinare opere logistiche e trasformare Buenos Aires nel centro finanziario del nuovo mercato continentale. L alternativa e rinviare la liberalizzazione finche la struttura politica non sara piu consolidata."
 ARG_rise.76.a:0 "Firmar el Mercado Comun."
 ARG_rise.76.b:0 "Rinviare la liberalizzazione."
