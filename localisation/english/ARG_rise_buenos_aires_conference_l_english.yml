l_english:
 ARG_rise_open_lesser_antilles_table:0 "Mesa de las Antillas Menores / Lesser Antilles Table / Tavolo delle Piccole Antille"
 ARG_rise_open_lesser_antilles_table_desc:0 "ESPAÑOL:\nAbrir el primer bloque de negociaciones con las pequeñas islas del Caribe oriental.\n\nENGLISH:\nOpen the first negotiation bloc with the small islands of the Eastern Caribbean.\n\nITALIANO:\nAprire il primo blocco di negoziati con le piccole isole dei Caraibi orientali."
 ARG_rise.64.t:0 "La Mesa de las Antillas Menores / The Lesser Antilles Table / Il Tavolo delle Piccole Antille"
 ARG_rise.64.d:0 "ESPAÑOL:\nLas delegaciones de las Antillas Menores aceptan abrir conversaciones formales con Buenos Aires. La discusión ya no trata solo de cooperación: autonomía local, protección naval, inversiones, deuda y representación política están sobre la mesa.\n\nENGLISH:\nThe delegations of the Lesser Antilles agree to open formal talks with Buenos Aires. The discussion is no longer only about cooperation: local autonomy, naval protection, investments, debt and political representation are now on the table.\n\nITALIANO:\nLe delegazioni delle Piccole Antille accettano di aprire colloqui formali con Buenos Aires. La discussione non riguarda più solo la cooperazione: autonomia locale, protezione navale, investimenti, debito e rappresentanza politica sono ora sul tavolo."
 ARG_rise.64.a:0 "Comenzar las negociaciones. / Begin the negotiations. / Iniziare i negoziati."
 ARG_rise.65.t:0 "Garantías para las Islas / Guarantees for the Islands / Garanzie per le Isole"
 ARG_rise.65.d:0 "ESPAÑOL:\nLas islas piden garantías: autonomía municipal, protección naval, inversiones portuarias y una representación digna dentro del nuevo orden austral. Buenos Aires puede comprar la paz o convertir la conferencia en un ultimátum.\n\nENGLISH:\nThe islands demand guarantees: municipal autonomy, naval protection, port investments and dignified representation inside the new southern order. Buenos Aires can purchase peace or turn the conference into an ultimatum.\n\nITALIANO:\nLe isole chiedono garanzie: autonomia municipale, protezione navale, investimenti portuali e una rappresentanza dignitosa nel nuovo ordine australe. Buenos Aires può comprare la pace o trasformare la conferenza in un ultimatum."
 ARG_rise.65.a:0 "Aceptar la integración negociada. / Accept negotiated integration. / Accettare l'integrazione negoziata."
 ARG_rise.65.b:0 "La soberanía no se compra dos veces. / Sovereignty is not bought twice. / La sovranità non si compra due volte."
 ARG_rise.66.t:0 "El Ultimátum Austral / The Southern Ultimatum / L'Ultimatum Australe"
 ARG_rise.66.d:0 "ESPAÑOL:\nLas Antillas Menores rechazan el protectorado argentino. En Buenos Aires, la paciencia diplomática se agota y el Estado Mayor prepara una respuesta coercitiva.\n\nENGLISH:\nThe Lesser Antilles reject the Argentine protectorate. In Buenos Aires, diplomatic patience runs out and the General Staff prepares a coercive response.\n\nITALIANO:\nLe Piccole Antille rifiutano il protettorato argentino. A Buenos Aires, la pazienza diplomatica si esaurisce e lo Stato Maggiore prepara una risposta coercitiva."
 ARG_rise.66.a:0 "Preparar la coerción. / Prepare coercion. / Preparare la coercizione."
 ARG_rise_open_guianas_table:0 "Mesa del Caribe Mayor / Greater Caribbean Table / Tavolo dei Caraibi Maggiori"
 ARG_rise_open_guianas_table_desc:0 "ESPAÑOL:\nAbrir las negociaciones con Santo Domingo, Port-au-Prince, Kingston y Nassau.\n\nENGLISH:\nOpen negotiations with Santo Domingo, Port-au-Prince, Kingston and Nassau.\n\nITALIANO:\nApri i negoziati con Santo Domingo, Port-au-Prince, Kingston e Nassau."
 ARG_rise.67.t:0 "Mesa del Caribe Mayor / Greater Caribbean Table / Tavolo dei Caraibi Maggiori"
 ARG_rise.67.d:0 "ESPAÑOL:\nLas delegaciones de Santo Domingo, Port-au-Prince, Kingston y Nassau llegan a Buenos Aires con intereses distintos. No son micro-islas asustadas, sino Estados con población, puertos, turismo, deuda y orgullo nacional.\n\nENGLISH:\nThe delegations from Santo Domingo, Port-au-Prince, Kingston and Nassau arrive in Buenos Aires with different interests. They are not frightened micro-islands, but states with population, ports, tourism, debt and national pride.\n\nITALIANO:\nLe delegazioni di Santo Domingo, Port-au-Prince, Kingston e Nassau arrivano a Buenos Aires con interessi diversi. Non sono micro-isole spaventate, ma Stati con popolazione, porti, turismo, debito e orgoglio nazionale."
 ARG_rise.67.a:0 "Abrir el segundo tavolo. / Open the second table. / Aprire il secondo tavolo."
 ARG_rise.68.t:0 "Garantías para el Caribe Mayor / Guarantees for the Greater Caribbean / Garanzie per i Caraibi Maggiori"
 ARG_rise.68.d:0 "ESPAÑOL:\nLos Estados del Caribe Mayor exigen autonomía administrativa, inversión portuaria, protección naval argentina, garantías para sus élites y alivio de deuda. Buenos Aires debe decidir si integra mediante concesiones o impone el ultimátum del Plata.\n\nENGLISH:\nThe Greater Caribbean states demand administrative autonomy, port investment, Argentine naval protection, guarantees for their elites and debt relief. Buenos Aires must decide whether to integrate through concessions or impose the ultimatum of the Plata.\n\nITALIANO:\nGli Stati dei Caraibi Maggiori chiedono autonomia amministrativa, investimenti portuali, protezione navale argentina, garanzie per le élite e sollievo dal debito. Buenos Aires deve decidere se integrare con concessioni o imporre l'ultimatum del Plata."
 ARG_rise.68.a:0 "Integrar mediante garantías e inversiones. / Integrate through guarantees and investments. / Integrare con garanzie e investimenti."
 ARG_rise.68.b:0 "Presentar el ultimátum del Plata. / Present the ultimatum of the Plata. / Presentare l'ultimatum del Plata."
 ARG_rise.69.t:0 "La Ruptura Caribeña / The Caribbean Break / La Rottura Caraibica"
 ARG_rise.69.d:0 "ESPAÑOL:\nLas delegaciones rechazan la integración. Buenos Aires declara que el tiempo de la fragmentación caribeña ha terminado y prepara la coerción.\n\nENGLISH:\nThe delegations reject integration. Buenos Aires declares that the age of Caribbean fragmentation is over and prepares coercion.\n\nITALIANO:\nLe delegazioni rifiutano l'integrazione. Buenos Aires dichiara che il tempo della frammentazione caraibica è finito e prepara la coercizione."
 ARG_rise.69.a:0 "Preparar la coerción. / Prepare coercion. / Preparare la coercizione."
 ARG_rise_conference_table_03:0 "Mesa de America Central / Central America Table / Tavolo dell'America Centrale"
 ARG_rise_conference_table_03_desc:0 "ESPAÑOL:\nAbrir el tavolo dedicado a America Central.\n\nENGLISH:\nOpen the table dedicated to Central America.\n\nITALIANO:\nApri il tavolo dedicato all'America Centrale."
 ARG_rise.70.t:0 "Mesa de America Central / Central America Table / Tavolo dell'America Centrale"
 ARG_rise.70.d:0 "ESPAÑOL:\nEl Canal de Panama domina la apertura del tavolo. Los observadores estadounidenses siguen cada palabra, mientras los delegados centroamericanos comprenden que la decision puede cambiar los equilibrios del continente.\n\nENGLISH:\nThe Panama Canal dominates the opening of the table. American observers follow every word, while the Central American delegates understand that this decision may change the balance of the continent.\n\nITALIANO:\nIl Canale di Panama domina l'apertura del tavolo. Gli osservatori statunitensi seguono ogni parola, mentre i delegati centroamericani comprendono che questa decisione puo cambiare gli equilibri del continente."
 ARG_rise.70.a:0 "Abrir la discusion centroamericana. / Open the Central American discussion. / Aprire la discussione centroamericana."
 ARG_rise.71.t:0 "La Cena del Palacio San Martin / Dinner at Palacio San Martin / La Cena del Palacio San Martin"
 ARG_rise.71.d:0 "ESPAÑOL:\nDurante una cena reservada en el Palacio San Martin emergen tres cuestiones: seguridad regional, control de las rutas comerciales y autonomia politica de los gobiernos centroamericanos. Buenos Aires puede ofrecer inversiones, proteccion naval y acceso privilegiado al mercado argentino, o exigir alineamiento inmediato.\n\nENGLISH:\nDuring a private dinner at Palacio San Martin, three issues emerge: regional security, control of trade routes and political autonomy for Central American governments. Buenos Aires can offer investment, naval protection and privileged access to the Argentine market, or demand immediate alignment.\n\nITALIANO:\nDurante una cena riservata al Palacio San Martin emergono tre questioni: sicurezza regionale, controllo delle rotte commerciali e autonomia politica dei governi centroamericani. Buenos Aires puo offrire investimenti, protezione navale e accesso privilegiato al mercato argentino, oppure pretendere un allineamento immediato."
 ARG_rise.71.a:0 "Ofrecer inversiones y proteccion naval. / Offer investment and naval protection. / Offrire investimenti e protezione navale."
 ARG_rise.71.b:0 "Exigir alineamiento inmediato. / Demand immediate alignment. / Pretendere allineamento immediato."
 ARG_rise.72.t:0 "La Seguridad de America Central / The Security of Central America / La Sicurezza dell'America Centrale"
 ARG_rise.72.d:0 "ESPAÑOL:\nEl negoziado fracasa. La delegacion argentina abandona el tavolo y el Ministro de Relaciones Exteriores declara que Buenos Aires garantizara con la fuerza la seguridad de America Central.\n\nENGLISH:\nThe negotiation fails. The Argentine delegation leaves the table and the Foreign Minister declares that Buenos Aires will guarantee the security of Central America by force.\n\nITALIANO:\nIl negoziato fallisce. La delegazione argentina abbandona il tavolo e il Ministro degli Esteri dichiara che Buenos Aires garantira con la forza la sicurezza dell'America Centrale."
 ARG_rise.72.a:0 "Garantizar la seguridad por la fuerza. / Guarantee security by force. / Garantire la sicurezza con la forza."
