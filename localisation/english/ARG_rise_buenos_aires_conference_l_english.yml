 ARG_rise.64.t:0 "La Mesa de las Antillas Menores / The Lesser Antilles Table / Il Tavolo delle Piccole Antille"
 ARG_rise.64.d:0 "ESPAÃ‘OL:\nEn el tercer dÃ­a de la Conferencia, las delegaciones de las Antillas Menores fueron conducidas al SalÃ³n Blanco bajo una discreta vigilancia militar.\n\nNo eran gobiernos capaces de desafiar a la Argentina. Eran islas, puertos, bancos, hoteles, banderas, votos en organismos internacionales y pequeÃ±as soberanÃ­as que todavÃ­a fingÃ­an tener margen de maniobra.\n\nLos discursos hablaron de cooperaciÃ³n, resiliencia climÃ¡tica, seguridad marÃ­tima y desarrollo turÃ­stico. Pero en las mesas laterales se discutieron otras cosas: deudas, inmunidades, bases navales, concesiones portuarias, pasaportes, cuentas privadas y el futuro de unas Ã©lites que comprendÃ­an demasiado bien el tamaÃ±o del nuevo poder austral.\n\nLas islas no serÃ­an conquistadas como Brasil. SerÃ­an convencidas, compradas o abandonadas frente a una pregunta simple: cuÃ¡nto valÃ­a su independencia cuando Buenos Aires ya controlaba el continente.\n\nENGLISH:\nOn the third day of the Conference, the delegations of the Lesser Antilles were escorted into the White Hall under discreet military watch.\n\nThey were not governments capable of challenging Argentina. They were islands, ports, banks, hotels, flags, votes in international organizations and small sovereignties still pretending to have room to maneuver.\n\nThe speeches spoke of cooperation, climate resilience, maritime security and tourism development. But at the side tables, other matters were discussed: debts, immunities, naval bases, port concessions, passports, private accounts and the future of elites who understood all too well the size of the new southern power.\n\nThe islands would not be conquered like Brazil. They would be convinced, purchased or left alone before a simple question: what was their independence worth when Buenos Aires already controlled the continent?\n\nITALIANO:\nNel terzo giorno della Conferenza, le delegazioni delle Piccole Antille furono accompagnate nel Salone Bianco sotto una discreta sorveglianza militare.\n\nNon erano governi capaci di sfidare lâ€™Argentina. Erano isole, porti, banche, alberghi, bandiere, voti negli organismi internazionali e piccole sovranitÃ  che fingevano ancora di avere margine di manovra.\n\nI discorsi parlarono di cooperazione, resilienza climatica, sicurezza marittima e sviluppo turistico. Ma ai tavoli laterali si discussero altre cose: debiti, immunitÃ , basi navali, concessioni portuali, pasaporti, conti privati e il futuro di Ã©lite che comprendevano fin troppo bene la dimensione del nuovo potere australe.\n\nLe isole non sarebbero state conquistate come il Brasile. Sarebbero state convinte, comprate o lasciate sole davanti a una domanda semplice: quanto valeva la loro indipendenza quando Buenos Aires controllava giÃ  il continente."
