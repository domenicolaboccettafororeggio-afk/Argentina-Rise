 ARG_rise_open_lesser_antilles_table:0 "Mesa de las Antillas Menores / Lesser Antilles Table / Tavolo delle Piccole Antille"
 ARG_rise_open_lesser_antilles_table_desc:0 "ESPAÑOL:\nAbrir el primer bloque de negociaciones con las pequeñas islas del Caribe oriental.\n\nENGLISH:\nOpen the first negotiation bloc with the small islands of the Eastern Caribbean.\n\nITALIANO:\nAprire il primo blocco di negoziati con le piccole isole dei Caraibi orientali."
 ARG_rise.64.t:0 "La Mesa de las Antillas Menores / The Lesser Antilles Table / Il Tavolo delle Piccole Antille"
 ARG_rise.64.d:0 "ESPAÑOL:\nEn el tercer día de la Conferencia, las delegaciones de las Antillas Menores fueron conducidas al Salón Blanco bajo una discreta vigilancia militar.\n\nNo eran gobiernos capaces de desafiar a la Argentina. Eran islas, puertos, bancos, hoteles, banderas, votos en organismos internacionales y pequeñas soberanías que todavía fingían tener margen de maniobra.\n\nLos discursos hablaron de cooperación, resiliencia climática, seguridad marítima y desarrollo turístico. Pero en las mesas laterales se discutieron otras cosas: deudas, inmunidades, bases navales, concesiones portuarias, pasaportes, cuentas privadas y el futuro de unas élites que comprendían demasiado bien el tamaño del nuevo poder austral.\n\nLas islas no serían conquistadas como Brasil. Serían convencidas, compradas o abandonadas frente a una pregunta simple: cuánto valía su independencia cuando Buenos Aires ya controlaba el continente.\n\nENGLISH:\nOn the third day of the Conference, the delegations of the Lesser Antilles were escorted into the White Hall under discreet military watch.\n\nThey were not governments capable of challenging Argentina. They were islands, ports, banks, hotels, flags, votes in international organizations and small sovereignties still pretending to have room to maneuver.\n\nThe speeches spoke of cooperation, climate resilience, maritime security and tourism development. But at the side tables, other matters were discussed: debts, immunities, naval bases, port concessions, passports, private accounts and the future of elites who understood all too well the size of the new southern power.\n\nThe islands would not be conquered like Brazil. They would be convinced, purchased or left alone before a simple question: what was their independence worth when Buenos Aires already controlled the continent?\n\nITALIANO:\nNel terzo giorno della Conferenza, le delegazioni delle Piccole Antille furono accompagnate nel Salone Bianco sotto una discreta sorveglianza militare.\n\nNon erano governi capaci di sfidare l’Argentina. Erano isole, porti, banche, alberghi, bandiere, voti negli organismi internazionali e piccole sovranità che fingevano ancora di avere margine di manovra.\n\nI discorsi parlarono di cooperazione, resilienza climatica, sicurezza marittima e sviluppo turistico. Ma ai tavoli laterali si discussero altre cose: debiti, immunità, basi navali, concessioni portuali, pasaporti, conti privati e il futuro di élite che comprendevano fin troppo bene la dimensione del nuovo potere australe.\n\nLe isole non sarebbero state conquistate come il Brasile. Sarebbero state convinte, comprate o lasciate sole davanti a una domanda semplice: quanto valeva la loro indipendenza quando Buenos Aires controllava già il continente."
 ARG_rise.64.a:0 "El precio de la soberanía será discutido en privado. / The price of sovereignty will be discussed in private. / Il prezzo della sovranità sarà discusso in privato."
