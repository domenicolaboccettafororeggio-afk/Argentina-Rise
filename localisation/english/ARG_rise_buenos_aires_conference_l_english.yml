l_english:
 ARG_rise_buenos_aires_conference_decisions: "La Conferencia de Buenos Aires / The Buenos Aires Conference / La Conferenza di Buenos Aires"
 ARG_rise_buenos_aires_conference_decisions_desc: "ES: Durante quince días, delegaciones de Centroamérica y el Caribe negociarán su lugar en el nuevo orden austral.\n\nEN: For fifteen days, delegations from Central America and the Caribbean will negotiate their place in the new southern order.\n\nIT: Per quindici giorni, le delegazioni del Centro America e dei Caraibi negozieranno il proprio posto nel nuovo ordine australe."
 ARG_rise_estado_de_la_conferencia: "Estado de la Conferencia / State of the Conference / Stato della Conferenza"
 ARG_rise_estado_de_la_conferencia_desc: "ES: Los salones están abiertos, las delegaciones han llegado y Buenos Aires observa quién firmará, quién negociará y quién se atreverá a resistir.\n\nEN: The halls are open, the delegations have arrived, and Buenos Aires watches who will sign, who will bargain, and who will dare to resist.\n\nIT: I saloni sono aperti, le delegazioni sono arrivate e Buenos Aires osserva chi firmerà, chi tratterà e chi oserà resistere."
 ARG_rise_estado_de_la_conferencia_tt: "La Conferencia de Buenos Aires está activa."
