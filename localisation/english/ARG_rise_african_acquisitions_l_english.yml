l_english:
 ARG_rise_proyeccion_transatlantica:0 "Transatlantic Projection"
 ARG_rise_proyeccion_transatlantica_desc:0 "Establishing our presence beyond our home continent is a vital step for our rising global stature. We will look towards West Africa as our gateway."
 ARG_rise_proyeccion_transatlantica_tt:0 "Unlocks African Strategic Acquisitions decisions."
 ARG_rise_african_strategic_acquisitions:0 "African Strategic Acquisitions"
 ARG_rise_african_strategic_acquisitions_desc:0 "To expand our global footprint, we can acquire naval bases and strategic footholds along the African coast through financial investments and diplomatic influence."
 ARG_rise_search_african_candidate:0 "Search for an African Candidate"
 ARG_rise_search_african_candidate_desc:0 "Search for a suitable coastal nation in West, East, or Southern Africa to establish a strategic projection base."
 ARG_rise_negotiate_with_candidate:0 "Negotiate with Candidate"
 ARG_rise_negotiate_with_candidate_desc:0 "Offer a financial package to the selected candidate in exchange for a strategic port region and political subordination."
 ARG_rise.201.t:0 "Negotiations Opened"
 ARG_rise.201.d:0 "We are ready to initiate negotiations with [event_target:ARG_rise_african_candidate_country.GetName]. Choose the type of offer we will present to their government."
 ARG_rise.201.a:0 "Prepare an Economic Offer (Cost: 5B Treasury)"
 ARG_rise.201.b:0 "Prepare a Strategic Agreement (Cost: 3B Treasury)"
 ARG_rise.201.c:0 "Prepare a Coercive Offer (Cost: 1B Treasury)"
 ARG_rise.202.t:0 "Argentine Proposal"
 ARG_rise.202.d:0 "The rising Argentine Confederation has approached our government. They are offering a significant financial investment to help rebuild our infrastructure, in exchange for the transfer of our strategic coastal port and our acceptance of Argentine political oversight."
 ARG_rise.202.a:0 "Accept the offer and cede our coastal port."
 ARG_rise.202.b:0 "Reject the proposal."
 ARG_rise.202.c:0 "Propose a Counteroffer (+2B Treasury to original cost)"
 ARG_rise.203.t:0 "Candidate Accepts Proposal"
 ARG_rise.203.d:0 "The candidate government has accepted our terms. Their strategic coastal port has been transferred to our direct control, and they have become our satellite state."
 ARG_rise.203.a:0 "A major diplomatic success."
 ARG_rise.204.t:0 "Candidate Rejects Proposal"
 ARG_rise.204.d:0 "The candidate government has flatly rejected our terms. Our funds remain untouched, and we may attempt negotiations again in the future."
 ARG_rise.204.a:0 "Disappointing."
 ARG_rise.205.t:0 "Negotiations Aborted"
 ARG_rise.205.d:0 "Geopolitical conditions changed during the negotiations, making the agreement impossible to finalize. No funds were transferred."
 ARG_rise.205.a:0 "Understood."
 ARG_rise.206.t:0 "Candidate Counteroffer"
 ARG_rise.206.d:0 "The candidate has responded with a counteroffer. They will accept our terms only if we pay an additional 2 billion dollars to help cover their transition costs."
 ARG_rise.206.a:0 "Accept the counteroffer and pay the increased cost."
 ARG_rise.206.b:0 "Reject the counteroffer."
 ARG_rise.207.t:0 "Candidate Country Identified"
 ARG_rise.207.d:0 "Our intelligence and diplomatic corps have identified a potential candidate for our Transatlantic Projection: [event_target:ARG_rise_african_candidate_country.GetName]. By negotiating with their government, we can acquire their strategic coastal region and secure a major foothold in Africa."
 ARG_rise.207.a:0 "Approve candidate and initiate preparations."
 ARG_rise.207.b:0 "Discard candidate and continue searching."
 ARG_rise_test_force_candidate_accept:0 "TEST - Force Candidate Accept"
 ARG_rise_test_force_candidate_accept_desc:0 "Overrides the next negotiation attempt to guarantee the selected candidate accepts."
 ARG_rise_test_force_candidate_counteroffer:0 "TEST - Force Candidate Counteroffer"
 ARG_rise_test_force_candidate_counteroffer_desc:0 "Overrides the next negotiation attempt to guarantee the selected candidate counteroffers."
 ARG_rise_test_force_candidate_reject:0 "TEST - Force Candidate Reject"
 ARG_rise_test_force_candidate_reject_desc:0 "Overrides the next negotiation attempt to guarantee the selected candidate rejects."
 ARG_rise_test_reset_candidate:0 "TEST - Reset Selection"
 ARG_rise_test_reset_candidate_desc:0 "Clears all selected candidates, active negotiations, cooldowns, and overrides to start fresh."
 ARG_rise_african_acquisitions_unlocked:0 "Transatlantic strategic projections are authorized"
 ARG_rise_african_negotiation_in_progress:0 "Diplomatic negotiations are in progress"
 ARG_rise_angola_acquisition_completed:0 "Strategic acquisition of Angola completed"
 ARG_rise_angola_acquisition_refused:0 "Strategic acquisition of Angola rejected"
