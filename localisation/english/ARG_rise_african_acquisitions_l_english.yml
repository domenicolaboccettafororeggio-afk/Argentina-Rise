l_english:
 ARG_rise_proyeccion_transatlantica:0 "Transatlantic Projection"
 ARG_rise_proyeccion_transatlantica_desc:0 "Establishing our presence beyond our home continent is a vital step for our rising global stature. We will look towards West Africa as our gateway."
 ARG_rise_proyeccion_transatlantica_tt:0 "Unlocks African Strategic Acquisitions decisions."
 ARG_rise_african_strategic_acquisitions:0 "African Strategic Acquisitions"
 ARG_rise_african_strategic_acquisitions_desc:0 "To expand our global footprint, we can acquire naval bases and strategic footholds along the African coast through financial investments and diplomatic influence."
 ARG_rise_negotiate_with_angola:0 "Negotiate with Angola"
 ARG_rise_negotiate_with_angola_desc:0 "Offer a financial package to the government of Angola in exchange for the strategic port of Benguela (State 299) and political subordination."
 ARG_rise.201.t:0 "Offer Prepared for Angola"
 ARG_rise.201.d:0 "We have finalized our diplomatic proposal for Luanda. We offer substantial financial aid in exchange for the transfer of Benguela and political alignment as an Argentine satellite."
 ARG_rise.201.a:0 "Send the proposal to Luanda."
 ARG_rise.202.t:0 "Argentine Proposal"
 ARG_rise.202.d:0 "The rising Argentine Confederation has approached our government. They are offering a significant financial investment to help rebuild our infrastructure, in exchange for the transfer of the Benguela port and our acceptance of Argentine political oversight."
 ARG_rise.202.a:0 "Accept the offer and cede Benguela."
 ARG_rise.202.b:0 "Reject the proposal."
 ARG_rise.203.t:0 "Angola Accepts Proposal"
 ARG_rise.203.d:0 "The Angolan government has accepted our terms. Benguela (State 299) has been transferred to our direct control, and Angola has become our satellite state. This provides us with our first strategic bridgehead in Africa."
 ARG_rise.203.a:0 "A major diplomatic success."
 ARG_rise.204.t:0 "Angola Rejects Proposal"
 ARG_rise.204.d:0 "The government of Angola has flatly rejected our terms. Our funds remain untouched, and we may attempt negotiations again in the future."
 ARG_rise.204.a:0 "Disappointing."
 ARG_rise.205.t:0 "Negotiations Aborted"
 ARG_rise.205.d:0 "Geopolitical conditions changed during the negotiations, making the agreement impossible to finalize. No funds were transferred."
 ARG_rise.205.a:0 "Understood."
 ARG_rise_african_acquisitions_unlocked:0 "Transatlantic strategic projections are authorized"
 ARG_rise_african_negotiation_in_progress:0 "Diplomatic negotiations are in progress"
 ARG_rise_angola_acquisition_completed:0 "Strategic acquisition of Angola completed"
 ARG_rise_angola_acquisition_refused:0 "Strategic acquisition of Angola rejected"
