 ARG_rise.93.t: "After Mexico: A New Reality"
 ARG_rise.93.d: "The integration of Mexico has ended a continental war, but it has also ended the old assumptions of the hemisphere. Argentina must decide how the world will first encounter its new power."
 ARG_rise.93.a: "A multipolar order must be built."
 ARG_rise.93.b: "Argentina will stand on its own feet."
 ARG_rise.93.c: "Offer restraint and seek a new detente."
 ARG_rise.94.t: "The World Takes Notice"
 ARG_rise.94.d: "The Mexican campaign is over. In every capital, diplomats now ask the same question: what place will an enlarged Argentina claim in the international order?"
 ARG_rise.94.a: "The old map no longer answers."
 ARG_rise.95.t: "Washington Reviews the Hemisphere"
 ARG_rise.95.d: "The White House confronts a strategic fact it did not choose. Argentina has altered the balance of the Americas, and every response carries a cost."
 ARG_rise.95.a: "The hemisphere has entered a new chapter."
 ARG_rise.96.t: "Moscow Studies the Southern Power"
 ARG_rise.96.d: "In Moscow, Argentina is neither a footnote nor a finished answer. Its rise may be an opening, a risk, or simply a development to be measured with patience."
 ARG_rise.96.a: "The balance is changing."
 ARG_rise.97.t: "Beijing Watches the New Continent"
 ARG_rise.97.d: "Beijing sees a continental power emerging beyond familiar alignments. The question is not whether Argentina matters, but what kind of partner it may become."
 ARG_rise.97.a: "Observe the new reality."
 ARG_rise.98.t: "Europe Measures the Distance"
 ARG_rise.98.d: "European governments speak in different tones, but agree on one point: the consolidation of Argentina demands a considered response rather than an old reflex."
 ARG_rise.98.a: "The Atlantic is no longer a certainty."
 ARG_rise.99.t: "A New Place at the Table"
 ARG_rise.99.d: "The first shock has passed. Argentina has not asked for permission to exist; it has made the world account for a reality that cannot be ignored."
 ARG_rise.99.a: "The next chapter belongs to Argentina."
 ARG_rise_opinion_arg_multipolar_usa: "Argentine Multipolar Posture"
 ARG_rise_opinion_arg_multipolar_usa_desc: "Argentina has challenged Washington's preferred order."
 ARG_rise_opinion_arg_multipolar_sov: "Argentine Multipolar Posture"
 ARG_rise_opinion_arg_multipolar_sov_desc: "Argentina has signaled a more plural international order."
