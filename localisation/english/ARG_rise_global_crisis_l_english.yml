 ARG_rise_opinion_arg_multipolar_eu_desc: "Argentina's new posture unsettles European capitals."
 ARG_rise_opinion_arg_autonomy_usa: "Argentine Strategic Autonomy"
 ARG_rise_opinion_arg_autonomy_usa_desc: "Argentina has declared an independent course."
 ARG_rise_opinion_arg_detente_usa: "Argentine Offer of Detente"
 ARG_rise_opinion_arg_detente_usa_desc: "Argentina has offered restraint after its continental victory."
