 ARG_rise_la_escala_de_la_republica: "The Scale of the Republic"
 ARG_rise_la_escala_de_la_republica_desc: "Argentina must now govern at continental scale. This opens the Continental Responsibility category and its first operational decisions."
 ARG_rise_administrar_dos_pueblos: "Govern Two Peoples"
 ARG_rise_administrar_dos_pueblos_desc: "Build an administration equal to the Republic's new responsibilities. Completes the administrative pillar and strengthens the Stability and Connectivity compacts."
 ARG_rise_la_red_continental: "The Continental Network"
 ARG_rise_la_red_continental_desc: "Link the old republic and its new northern territories with practical infrastructure. Completes the network pillar and strengthens the Supply and Connectivity compacts."
 ARG_rise_la_energia_de_la_union: "The Energy of Union"
 ARG_rise_la_energia_de_la_union_desc: "Secure a reliable energy foundation for a continental state. Completes the energy pillar and strengthens the Supply Compact."
 ARG_rise_fronteras_responsables: "Responsible Borders"
 ARG_rise_fronteras_responsables_desc: "Replace expansion with disciplined vigilance. Completes the security pillar and strengthens the Stability Compact."
 ARG_rise_la_palabra_cumplida: "The Word Kept"
 ARG_rise_la_palabra_cumplida_desc: "Bring at least three continental pillars together before convening the region. Any pillar left unfinished will remain a strategic weakness."
 ARG_rise_cumbre_de_la_responsabilidad_continental: "Continental Responsibility Summit"
 ARG_rise_cumbre_de_la_responsabilidad_continental_desc: "Open the summit and make the Continental Responsibility preparations available. The compact itself must still be chosen."
 ARG_rise_el_compromiso_de_buenos_aires: "The Buenos Aires Commitment"
 ARG_rise_el_compromiso_de_buenos_aires_desc: "Turn the selected compact into a public commitment. Its final delivery remains a separate operational decision."
 ARG_rise_audit_continental_capacity: "Audit Continental Capacity"
 ARG_rise_audit_continental_capacity_desc: "Establish a common assessment of the Republic's new continental obligations before the summit preparations begin."
 ARG_rise_secure_continental_supply_chain: "Secure the Continental Supply Chain"
 ARG_rise_secure_continental_supply_chain_desc: "Fund a practical northern logistics improvement after completing the Continental Network pillar."
 ARG_rise_protect_energy_resilience: "Protect Strategic Energy Resilience"
 ARG_rise_protect_energy_resilience_desc: "Fund an additional resilient power installation after completing the Energy of Union pillar."
 ARG_rise_regional_reassurance_mission: "Regional Reassurance Mission"
 ARG_rise_regional_reassurance_mission_desc: "Commit resources to reassure the regions now governed from Buenos Aires after completing the administrative pillar."
 ARG_rise_strategic_risk_review: "Strategic Risk Review"
 ARG_rise_strategic_risk_review_desc: "Review continental risks and convert the security pillar into immediate political capacity."
 ARG_rise_prepare_responsibility_summit: "Prepare the Continental Responsibility Summit"
 ARG_rise_prepare_responsibility_summit_desc: "Spend political capital and Treasury resources to turn the open summit into a working negotiation."
 ARG_rise_choose_supply_compact: "Continental Supply Compact"
 ARG_rise_choose_supply_compact_desc: "Prioritize reliable continental supply. Requires the Network and Energy pillars."
 ARG_rise_choose_connectivity_compact: "Continental Connectivity Compact"
 ARG_rise_choose_connectivity_compact_desc: "Prioritize the links between the Republic's regions. Requires the Network and Administration pillars."
 ARG_rise_choose_stability_compact: "Continental Stability Compact"
 ARG_rise_choose_stability_compact_desc: "Prioritize responsible security and internal confidence. Requires the Security and Administration pillars."
 ARG_rise_deliver_continental_compact: "Deliver the Continental Commitment"
 ARG_rise_deliver_continental_compact_desc: "Carry out the public commitment selected at the summit. The result depends on the chosen compact, while an unfinished pillar raises its cost or strains internal stability."
