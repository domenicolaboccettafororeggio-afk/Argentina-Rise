 ARG_rise_opinion_arg_detente_eu_desc: "Argentina has offered restraint after its continental victory."
 ARG_rise_opinion_arg_detente_eastern: "Argentine Offer of Detente"
 ARG_rise_opinion_arg_detente_eastern_desc: "Argentina has offered restraint after its continental victory."
 ARG_rise_opinion_usa_containment: "American Containment"
 ARG_rise_opinion_usa_containment_desc: "Washington has chosen to contain Argentine influence."
 ARG_rise_opinion_usa_prudence: "American Armed Prudence"
 ARG_rise_opinion_usa_prudence_desc: "Washington remains cautious about Argentina's rise."
 ARG_rise_opinion_usa_pragmatism: "American Pragmatism"
 ARG_rise_opinion_usa_pragmatism_desc: "Washington seeks a practical relationship with Argentina."
 ARG_rise_opinion_sov_opening: "Soviet Strategic Opening"
 ARG_rise_opinion_sov_opening_desc: "Moscow sees an opening in Argentina's rise."
 ARG_rise_opinion_sov_caution: "Soviet Caution"
 ARG_rise_opinion_sov_caution_desc: "Moscow is watching Argentina carefully."
 ARG_rise_opinion_sov_deferral: "Soviet Deferral"
 ARG_rise_opinion_sov_deferral_desc: "Moscow has postponed a closer response."
 ARG_rise_opinion_chi_partnership: "Chinese Strategic Partnership"
 ARG_rise_opinion_chi_partnership_desc: "Beijing sees Argentina as a possible partner."
 ARG_rise_opinion_chi_observation: "Chinese Observation"
 ARG_rise_opinion_chi_observation_desc: "Beijing is observing Argentina's rise."
 ARG_rise_opinion_chi_distance: "Chinese Strategic Distance"
 ARG_rise_opinion_chi_distance_desc: "Beijing has chosen a guarded distance."
 ARG_rise_opinion_eu_atlantic_condemnation: "European Atlantic Condemnation"
 ARG_rise_opinion_eu_atlantic_condemnation_desc: "European governments condemn Argentina's course."
 ARG_rise_opinion_eu_caution: "European Diplomatic Caution"
 ARG_rise_opinion_eu_caution_desc: "European governments are proceeding cautiously."
 ARG_rise_opinion_eu_pragmatism: "European Commercial Pragmatism"
 ARG_rise_opinion_eu_pragmatism_desc: "European governments seek practical engagement with Argentina."
 ARG_rise.100.t: "The Night of New York"
 ARG_rise.100.d: "The Security Council meets in emergency session. Argentina speaks last: it asks no permission to exist, only the maturity to live with a changed reality."
 ARG_rise.100.a: "Let silence be an answer."
 ARG_rise.101.t: "Dispatch from New York"
 ARG_rise.101.d: "Washington has spoken. Buenos Aires must now turn scrutiny into responsible action."
 ARG_rise.101.a: "The world will answer in its own time."
 ARG_rise.102.t: "The Test of the Republic"
 ARG_rise.102.d: "Argentina has carried its continental commitment through. The world now judges evidence rather than intention."
 ARG_rise.102.a: "Responsibility has been delivered."
 ARG_rise.103.t: "The Map We Have Made"
 ARG_rise.103.d: "Argentina has begun to shape a political map around its new continental scale. The next direction is now earned."
 ARG_rise.103.a: "A new horizon is open."
 ARG_rise_continental_responsibility_decisions: "Continental Responsibility"
 ARG_rise_continental_responsibility_decisions_desc: "Argentina must prove that continental scale can be governed, supplied and protected responsibly."
