l_english:
 ARG_rise_el_camino_del_norte:0 "El Camino del Norte"
 ARG_rise_el_camino_del_norte_desc:0 "Argentina has completed the continental union in the south. The road north now leads to a confrontation that will define the balance of the Americas."
 ARG_rise_la_reconstruccion_de_mexico:0 "La Reconstrucción de México"
 ARG_rise_la_reconstruccion_de_mexico_desc:0 "Military victory is only the beginning. Roads, industry and administration must be rebuilt before Mexico can be fully incorporated into the continental order."
 ARG_rise_una_nacion_dos_pueblos:0 "Una Nación, Dos Pueblos"
 ARG_rise_una_nacion_dos_pueblos_desc:0 "The reconstruction is complete. Argentina and Mexico can now enter a common political future as one nation of two peoples."
 ARG_rise_mexico_campaign_decisions:0 "El Camino del Norte"
 ARG_rise_mexico_campaign_decisions_desc:0 "The Mexican campaign awaits the decision that will turn continental ambition into open confrontation."
 ARG_rise_send_ultimatum_to_mexico:0 "Inviare l'Ultimatum a Città del Messico"
 ARG_rise_send_ultimatum_to_mexico_desc:0 "Present Buenos Aires' demands to Mexico and force the continental question into the open."
 ARG_rise.83.t:0 "El Mandato hacia el Norte"
 ARG_rise.83.d:0 "Buenos Aires has completed the work of continental union in the south. The government now turns northward, toward Mexico and the final test of Argentine power in the Americas."
 ARG_rise.83.a:0 "El camino está abierto."
 ARG_rise.84.t:0 "El Ultimátum de Buenos Aires"
 ARG_rise.84.d:0 "The Argentine government has decided that the Mexican question can no longer remain unresolved. A formal ultimatum is sent to Mexico City."
 ARG_rise.84.a:0 "Enviar el ultimátum."
 ARG_rise.85.t:0 "La Respuesta de Ciudad de México"
 ARG_rise.85.d:0 "Mexico rejects Buenos Aires' demands. Its government declares that its sovereignty will not be decided from the south."
 ARG_rise.85.a:0 "México no se inclinará."
 ARG_rise.86.t:0 "El Rechazo de México"
 ARG_rise.86.d:0 "Mexico has refused the ultimatum. The diplomatic road has ended; the Argentine government is now authorized to pursue its continental mandate by force."
 ARG_rise.86.a:0 "Preparar la campaña."
 ARG_rise.87.t:0 "Argentina y México en Guerra"
 ARG_rise.87.d:0 "The confrontation between Buenos Aires and Mexico City has become open war. Governments across the Americas now weigh the consequences of an Argentine advance toward the north."
 ARG_rise.87.a:0 "El continente observa."
 ARG_rise.88.t:0 "La Caída de Ciudad de México"
 ARG_rise.88.d:0 "Argentine forces have entered Mexico City. The fall of the capital marks the military climax of the northern campaign, but the question of Mexico's future remains unresolved."
 ARG_rise.88.a:0 "La guerra entra en una nueva fase."
 ARG_rise.89.t:0 "El Fin de la Guerra"
 ARG_rise.89.d:0 "The fighting has ended. Argentina now faces the harder task: rebuilding the territory, restoring its infrastructure and consolidating a military administration across Mexico."
 ARG_rise.89.a:0 "Comenzar la reconstrucción."
 ARG_rise.90.t:0 "Una Nación, Dos Pueblos"
 ARG_rise.90.d:0 "Reconstruction has created the foundations for a new political settlement. Argentina and Mexico are no longer divided by conquest, but joined by a common national future."
 ARG_rise.90.a:0 "Que comience la nueva nación."
