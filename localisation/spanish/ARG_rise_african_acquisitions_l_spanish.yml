l_spanish:
 ARG_rise_proyeccion_transatlantica:0 "Proyección Transatlántica"
 ARG_rise_proyeccion_transatlantica_desc:0 "Establecer nuestra presencia más allá de nuestro continente natal es un paso vital para nuestra creciente estatura global. Miraremos hacia África Occidental como nuestra puerta de entrada."
 ARG_rise_proyeccion_transatlantica_tt:0 "Desbloquea las decisiones de Adquisiciones Estratégicas Africanas."
 ARG_rise_african_strategic_acquisitions:0 "Adquisiciones Estratégicas Africanas"
 ARG_rise_african_strategic_acquisitions_desc:0 "Para expandir nuestra presencia global, podemos adquirir bases navales y puntos estratégicos a lo largo de la costa africana mediante inversiones financieras e influencia diplomática."
 ARG_rise_search_african_candidate:0 "Buscar un Candidato Africano"
 ARG_rise_search_african_candidate_desc:0 "Buscar una nación costera adecuada en África Occidental, Oriental o del Sur para establecer una base de proyección estratégica."
 ARG_rise_negotiate_with_candidate:0 "Negociar con el Candidato"
 ARG_rise_negotiate_with_candidate_desc:0 "Ofrecer un paquete financiero al candidato seleccionado a cambio de una región portuaria estratégica y la subordinación política."
 ARG_rise.201.t:0 "Negociaciones Abiertas"
 ARG_rise.201.d:0 "Estamos listos para iniciar negociaciones con [event_target:ARG_rise_african_candidate_country.GetName]. Elija el tipo de oferta que presentaremos a su gobierno."
 ARG_rise.201.a:0 "Preparar una Oferta Económica (Costo: 5B Treasury)"
 ARG_rise.201.b:0 "Preparar un Acuerdo Estratégico (Costo: 3B Treasury)"
 ARG_rise.201.c:0 "Preparar una Oferta Coercitiva (Costo: 1B Treasury)"
 ARG_rise.202.t:0 "Propuesta argentina"
 ARG_rise.202.d:0 "La creciente Confederación Argentina se ha acercado a nuestro gobierno. Ofrecen una importante inversión financiera a cambio de la transferencia de nuestro puerto costero estratégico y nuestra aceptación de la tutela política argentina."
 ARG_rise.202.a:0 "Aceptar la oferta y ceder nuestro puerto costero."
 ARG_rise.202.b:0 "Rechazar la propuesta."
 ARG_rise.202.c:0 "Proponer una Contrapropuesta (+2B Treasury al costo original)"
 ARG_rise.203.t:0 "El Candidato Acepta la Propuesta"
 ARG_rise.203.d:0 "El gobierno del candidato ha aceptado nuestros términos. Su puerto costero estratégico ha sido transferido a nuestro control directo y se han convertido en nuestro estado satélite."
 ARG_rise.203.a:0 "Un gran éxito diplomático."
 ARG_rise.204.t:0 "El Candidato Rechaza la Propuesta"
 ARG_rise.204.d:0 "El gobierno del candidato ha rechazado rotundamente nuestros términos. Nuestros fondos permanecen intactos y podremos intentar las negociaciones nuevamente en el futuro."
 ARG_rise.204.a:0 "Decepcionante."
 ARG_rise.205.t:0 "Negociaciones abortadas"
 ARG_rise.205.d:0 "Las condiciones geopolíticas cambiaron durante las negociaciones, haciendo imposible finalizar el acuerdo. No se transfirieron fondos."
 ARG_rise.205.a:0 "Entendido."
 ARG_rise.206.t:0 "Contrapropuesta del Candidato"
 ARG_rise.206.d:0 "El candidato ha respondido con una contrapropuesta. Aceptarán nuestros términos sólo si pagamos un adicional de 2 mil millones de dólares para ayudar a cubrir sus costos de transición."
 ARG_rise.206.a:0 "Aceptar la contrapropuesta y pagar el costo incrementado."
 ARG_rise.206.b:0 "Rechazar la contrapropuesta."
 ARG_rise.207.t:0 "Candidato Africano Identificado"
 ARG_rise.207.d:0 "Nuestra inteligencia y cuerpo diplomático han identificado a un candidato principal para nuestra Proyección Transatlántica: [event_target:ARG_rise_african_candidate_country.GetName]. Negociando con su gobierno, podemos adquirir su región costera estratégica y asegurar un punto de apoyo importante en África."
 ARG_rise.207.a:0 "Aprobar candidato e iniciar preparativos."
 ARG_rise.207.b:0 "Descartar candidato y seguir buscando."
 ARG_rise_test_force_candidate_accept:0 "TEST - Forzar Aceptación del Candidato"
 ARG_rise_test_force_candidate_accept_desc:0 "Sobrescribe el próximo intento de negociación para garantizar que el candidato seleccionado acepte."
 ARG_rise_test_force_candidate_counteroffer:0 "TEST - Forzar Contrapropuesta del Candidato"
 ARG_rise_test_force_candidate_counteroffer_desc:0 "Sobrescribe el próximo intento de negociación para garantizar que el candidato seleccionado contraproponga."
 ARG_rise_test_force_candidate_reject:0 "TEST - Forzar Rechazo del Candidato"
 ARG_rise_test_force_candidate_reject_desc:0 "Sobrescribe el próximo intento de negociación para garantizar que el candidato seleccionado rechace."
 ARG_rise_test_reset_candidate:0 "TEST - Reiniciar Selección"
 ARG_rise_test_reset_candidate_desc:0 "Limpia todos los candidatos seleccionados, negociaciones activas, cooldowns y sobrescrituras para comenzar de nuevo."
 ARG_rise_african_acquisitions_unlocked:0 "Las proyecciones estratégicas transatlánticas están autorizadas"
 ARG_rise_african_negotiation_in_progress:0 "Las negociaciones diplomáticas están en curso"
 ARG_rise_angola_acquisition_completed:0 "Adquisición estratégica de Angola completada"
 ARG_rise_angola_acquisition_refused:0 "Adquisición estratégica de Angola rechazada"
