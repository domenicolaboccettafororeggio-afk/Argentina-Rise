l_spanish:
 ARG_rise_proyeccion_transatlantica:0 "Proyección Transatlántica"
 ARG_rise_proyeccion_transatlantica_desc:0 "Establecer nuestra presencia más allá de nuestro continente natal es un paso vital para nuestra creciente estatura global. Miraremos hacia África Occidental como nuestra puerta de entrada."
 ARG_rise_proyeccion_transatlantica_tt:0 "Desbloquea las decisiones de Adquisiciones Estratégicas Africanas."
 ARG_rise_african_strategic_acquisitions:0 "Adquisiciones Estratégicas Africanas"
 ARG_rise_african_strategic_acquisitions_desc:0 "Para expandir nuestra presencia global, podemos adquirir bases navales y puntos estratégicos a lo largo de la costa africana mediante inversiones financieras e influencia diplomática."
 ARG_rise_negotiate_with_angola:0 "Negociar con Angola"
 ARG_rise_negotiate_with_angola_desc:0 "Ofrecer un paquete financiero al gobierno de Angola a cambio del puerto estratégico de Benguela (Estado 299) y la subordinación política."
 ARG_rise.201.t:0 "Propuesta preparada para Angola"
 ARG_rise.201.d:0 "Hemos finalizado nuestra propuesta diplomática para Luanda. Ofrecemos una ayuda financiera sustancial a cambio de la transferencia de Benguela y la alineación política como satélite argentino."
 ARG_rise.201.a:0 "Enviar la propuesta a Luanda."
 ARG_rise.202.t:0 "Propuesta argentina"
 ARG_rise.202.d:0 "La creciente Confederación Argentina se ha acercado a nuestro gobierno. Ofrecen una importante inversión financiera a cambio de la transferencia del puerto de Benguela y nuestra aceptación de la tutela política argentina."
 ARG_rise.202.a:0 "Aceptar la oferta y ceder Benguela."
 ARG_rise.202.b:0 "Rechazar la propuesta."
 ARG_rise.203.t:0 "Angola acepta la propuesta"
 ARG_rise.203.d:0 "El gobierno de Angola ha aceptado nuestros términos. Benguela (Estado 299) ha sido transferida a nuestro control directo, y Angola se ha convertido en nuestro estado satélite. Esto nos proporciona nuestra primera cabeza de puente estratégica en África."
 ARG_rise.203.a:0 "Un gran éxito diplomático."
 ARG_rise.204.t:0 "Angola rechaza la propuesta"
 ARG_rise.204.d:0 "El gobierno de Angola ha rechazado rotundamente nuestros términos. Nuestros fondos permanecen intactos y podremos intentar las negociaciones nuevamente en el futuro."
 ARG_rise.204.a:0 "Decepcionante."
 ARG_rise.205.t:0 "Negociaciones abortadas"
 ARG_rise.205.d:0 "Las condiciones geopolíticas cambiaron durante las negociaciones, haciendo imposible finalizar el acuerdo. No se transfirieron fondos."
 ARG_rise.205.a:0 "Entendido."
 ARG_rise_african_acquisitions_unlocked:0 "Las proyecciones estratégicas transatlánticas están autorizadas"
 ARG_rise_african_negotiation_in_progress:0 "Las negociaciones diplomáticas están en curso"
 ARG_rise_angola_acquisition_completed:0 "Adquisición estratégica de Angola completada"
 ARG_rise_angola_acquisition_refused:0 "Adquisición estratégica de Angola rechazada"
