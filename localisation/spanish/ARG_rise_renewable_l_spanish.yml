 ARG_rise_nuevo_sol_levante_renewable_spirit:0 "El Aliento del Nuevo Sol"
 ARG_rise_nuevo_sol_levante_renewable_spirit_desc:0 "El sistema argentino de energia renovable se convierte en un fundamento permanente de la independencia nacional y de la renovacion industrial."
 ARG_rise.92.t:0 "El Aliento del Nuevo Sol"
 ARG_rise.92.d:0 "Una nueva era se alza sobre Argentina. El viento que cruza las pampas, el sol que corona los horizontes y las fuerzas de la naturaleza antes indomitas responden ahora a la tecnica argentina. Desde el polvo de las dificultades, la nacion vuelve a levantarse, sostenida por una independencia energetica digna de su futuro industrial. Un aliento casi divino recorre los nuevos complejos y eleva al pais hacia una edad mas luminosa."
 ARG_rise.92.a:0 "Que el aliento divino eleve a la nacion."
