 ARG_rise.93.t: "El Mundo Contiene el Aliento"
 ARG_rise.93.d: "§YBuenos Aires, después de la plena integración de México.§!\n\nLas celebraciones han terminado antes de que el mundo pudiera comprenderlas.\n\nEn las avenidas de Buenos Aires aún quedan banderas, flores marchitas y el eco de las multitudes. Pero en los ministerios las luces siguen encendidas. Sobre las mesas hay mapas nuevos: no muestran una campaña concluida, sino una frontera que ha obligado a otros continentes a acercarse.\n\nMéxico ya no es un territorio en disputa. Es una realidad política argentina. Al norte, esa realidad toca el espacio que Washington siempre consideró seguro por costumbre. Al este, los mercados calculan. Al otro lado de los océanos, cancillerías que apenas pronunciaban nuestro nombre vuelven a abrir sus archivos sobre Sudamérica.\n\nNadie ha pedido a la República que explique su lugar en el mundo. Por primera vez, no hace falta. El mundo ya está escribiendo sus propias respuestas.\n\nLa cuestión no es si Argentina ha crecido. La cuestión es qué clase de potencia decidirá ser cuando los demás empiecen a temer, a cortejar o a contener aquello que ha nacido."
 ARG_rise.93.a: "Un orden de varios polos."
 ARG_rise.93.a.tt: "Ninguna capital debe volver a creer que el destino de un continente puede decidirse desde una sola mesa. Argentina hablará con todos, no se subordinará a nadie y buscará equilibrio donde otros solo ven bloques."
 ARG_rise.93.b: "La autonomía es nuestra alianza."
 ARG_rise.93.b.tt: "Las grandes potencias ofrecen abrazos que a menudo se convierten en cadenas. Argentina no necesitará permiso, tutela ni patrón. Su fuerza será la distancia que conserve entre todos los imperios."
 ARG_rise.93.c: "La fuerza debe aprender a hablar."
 ARG_rise.93.c.tt: "La victoria ha demostrado que Argentina puede imponerse. Ahora debe demostrar que también puede evitar que el mundo convierta esa victoria en una guerra más grande. Hablaremos desde la fuerza, no desde el miedo."
 ARG_rise.94.t: "Una Nueva Potencia Continental"
 ARG_rise.94.d: "§YEdición extraordinaria: el mapa político de América ha cambiado.§!\n\nLas redacciones no utilizan la misma palabra, pero todas llegan a la misma conclusión.\n\nEn Washington hablan de una frontera transformada. En Moscú, de una nueva variable en el equilibrio del hemisferio occidental. En Beijing, de una economía continental que ya no puede ser ignorada. En las capitales europeas, de comercio, derecho, estabilidad y precedentes.\n\nLa integración de México ha terminado. No ha comenzado una nueva guerra. Sin embargo, los mapas que aparecen en las pantallas tienen el peso de una declaración.\n\nArgentina ya no ocupa una nota al pie en la agenda internacional. Sus puertos, sus recursos, sus fronteras y sus decisiones pertenecen ahora a los cálculos de quienes creían que el orden mundial estaba resuelto lejos del Río de la Plata.\n\nEsta noche, en Nueva York, el Consejo de Seguridad ha sido convocado de urgencia."
 ARG_rise.94.a: "El mundo ha tomado nota."
 ARG_rise.94.a.tt: "Ninguna ceremonia puede devolver a los demás la tranquilidad de ayer."
 ARG_rise.95.t: "El Hemisferio en Disputa"
 ARG_rise.95.d: "§YWashington, después de la sesión de emergencia.§!\n\nLa sala de situaciones de la Casa Blanca está iluminada por pantallas sin sonido.\n\nLa imagen del Consejo de Seguridad se repite una y otra vez. No hay tropas en movimiento hacia el norte. No hay ultimátum. No hay una declaración de guerra. Precisamente por eso la decisión es más difícil.\n\nDurante generaciones, la distancia protegió a Estados Unidos de los cambios en el sur. Ahora una potencia continental se extiende hasta una frontera que antes parecía pertenecer a una geografía estable. Sus ministros hablan de autonomía, equilibrio o distensión. Sus fuerzas hablan por la nueva realidad.\n\nLos asesores discrepan. Unos advierten que tolerar el cambio equivale a aceptar un precedente. Otros recuerdan que convertir a Argentina en un enemigo puede producir exactamente el bloque que Washington teme. Nadie discute si Argentina importa. Discuten qué hacer con una Argentina que ya no puede ser ignorada."
 ARG_rise.95.a: "Ninguna potencia continental puede quedar sin contrapeso."
 ARG_rise.95.a.tt: "Estados Unidos reforzará la vigilancia, coordinará a sus socios y dejará claro que la estabilidad hemisférica no puede depender de la voluntad de una sola capital. No es una guerra. Es una línea que todos deben poder ver."
 ARG_rise.95.b: "Observar, preparar, no precipitar."
 ARG_rise.95.b.tt: "Argentina ha alterado el equilibrio, pero el equilibrio aún no ha roto. Estados Unidos reforzará sus capacidades, consultará a sus aliados y mantendrá abiertos los canales. La precipitación es una forma de debilidad cuando el mundo entero está mirando."
 ARG_rise.95.c: "La realidad no desaparece por negarla."
 ARG_rise.95.c.tt: "Argentina no es un aliado, pero tampoco tiene por qué convertirse en un adversario. Reconocer su nueva posición no significa aprobar cada una de sus decisiones. Significa admitir que la seguridad del hemisferio exige hablar con quienes tienen la capacidad de alterarla."
 ARG_rise.96.t: "Un Contrapeso en el Sur"
 ARG_rise.96.d: "§YMoscú, sala del consejo frente al alba invernal.§!\n\nBajo la luz plana y fría, las cartas del Pacífico y del Atlántico cubren la mesa. La cuestión no es si la nueva realidad argentina existe, sino si abre un contrapeso posible o un riesgo que conviene aplazar.\n\nMoscú no celebra ni condena. Mide una oportunidad vigilada: una línea que une Buenos Aires y Moscú, dejando Washington fuera de cuadro."
 ARG_rise.96.a: "El equilibrio está cambiando."
 ARG_rise.96.a.tt: "Si Washington ha convertido a Argentina en una cuestión estratégica, ¿abrirá Moscú un canal o preservará la distancia?"
 ARG_rise.97.t: "La Pregunta de Beijing"
 ARG_rise.97.d: "§YBeijing, una sala de reuniones económica más que militar.§!\n\nTras la lluvia, la luz entra por el vidrio y los monitores muestran puertos y rutas comerciales. Beijing no pregunta quién ganó una discusión diplomática. Pregunta si la nueva realidad argentina puede ser lo bastante previsible para merecer una relación de largo plazo.\n\nLa mirada es paciente, analítica y dirigida hacia el futuro. Sobre la pantalla, contenedores y rutas oceánicas se superponen al mapa político."
 ARG_rise.97.a: "Observar la nueva realidad."
 ARG_rise.97.a.tt: "¿Puede la nueva realidad argentina volverse lo bastante previsible para una relación duradera?"
 ARG_rise.98.t: "Europa Calcula la Distancia"
 ARG_rise.98.d: "§YBruselas y las capitales europeas, en un montaje sobrio.§!\n\nEntre vidrio gris, salas de conferencia y oficinas todavía encendidas, Europa sopesa derecho, comercio y solidaridad atlántica. La prudencia legal convive con una tensión comercial que nadie puede ignorar.\n\nLos expedientes abiertos junto a la ventana no ofrecen una salida sencilla: Europa debe preservar sus principios sin fingir que la realidad argentina no existe."
 ARG_rise.98.a: "El Atlántico ya no es una certeza."
 ARG_rise.98.a.tt: "¿Puede Europa preservar derecho, comercio y solidaridad atlántica sin negar la nueva realidad argentina?"
 ARG_rise.99.t: "Las Respuestas del Mundo"
 ARG_rise.99.d: "§YBuenos Aires, doce días después de la integración.§!\n\nLa sala de mapas es la misma, y las luces son las mismas. Pero ahora la carta está cubierta de anotaciones llegadas desde cuatro direcciones.\n\nLa presión ha cedido sin desaparecer. Argentina ha escuchado al mundo y comprende que el viejo orden ya no basta para explicar el continente que ha transformado.\n\nLa pregunta ya no es qué dirán los demás. La pregunta es qué futuro construirá Argentina dentro del orden que ha alterado."
 ARG_rise.99.a: "El próximo capítulo pertenece a Argentina."
 ARG_rise.99.a.tt: "El mundo ha respondido. Ahora Argentina elegirá su horizonte estratégico."
