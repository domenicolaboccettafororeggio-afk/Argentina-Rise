 ARG_rise.100.t: "La Noche de Nueva York"
 ARG_rise.100.d: "El Consejo de Seguridad se reúne de urgencia. Argentina habla al final: no pide permiso para existir, sino la madurez de convivir con una realidad cambiada."
 ARG_rise.100.a: "Que el silencio también sea una respuesta."
 ARG_rise.101.t: "Despacho de Nueva York"
 ARG_rise.101.d: "Washington ha hablado. Buenos Aires debe convertir el escrutinio en responsabilidad."
 ARG_rise.101.a: "El mundo responderá a su debido tiempo."
 ARG_rise.102.t: "La Prueba de la República"
 ARG_rise.102.d: "Argentina ha cumplido su compromiso continental. El mundo juzga ahora hechos y no intenciones."
 ARG_rise.102.a: "La responsabilidad ha sido cumplida."
