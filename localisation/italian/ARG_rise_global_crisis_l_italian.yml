 ARG_rise_continental_compact_delivered: "Impegno Continentale Realizzato"
 ARG_rise_la_escala_de_la_republica: "La Scala della Repubblica"
 ARG_rise_la_escala_de_la_republica_desc: "L'Argentina deve ora governare su scala continentale. Apre la categoria Responsabilità Continentale e le sue prime decisioni operative."
 ARG_rise_administrar_dos_pueblos: "Amministrare Due Popoli"
 ARG_rise_administrar_dos_pueblos_desc: "Costruisce un'amministrazione proporzionata alle nuove responsabilità della Repubblica. Completa il pilastro amministrativo e rafforza i patti di Stabilità e Connettività."
 ARG_rise_la_red_continental: "La Rete Continentale"
 ARG_rise_la_red_continental_desc: "Collega la vecchia repubblica e i nuovi territori settentrionali con infrastrutture concrete. Completa il pilastro della rete e rafforza i patti di Fornitura e Connettività."
 ARG_rise_la_energia_de_la_union: "L'Energia dell'Unione"
 ARG_rise_la_energia_de_la_union_desc: "Assicura una base energetica affidabile per uno Stato continentale. Completa il pilastro energetico e rafforza il Patto di Fornitura."
 ARG_rise_fronteras_responsables: "Frontiere Responsabili"
 ARG_rise_fronteras_responsables_desc: "Sostituisce l'espansione con una vigilanza disciplinata. Completa il pilastro della sicurezza e rafforza il Patto di Stabilità."
 ARG_rise_la_palabra_cumplida: "La Parola Mantenuta"
 ARG_rise_la_palabra_cumplida_desc: "Riunisce almeno tre pilastri continentali prima di convocare la regione. Ogni pilastro incompleto resterà una debolezza strategica."
 ARG_rise_cumbre_de_la_responsabilidad_continental: "Vertice della Responsabilità Continentale"
 ARG_rise_cumbre_de_la_responsabilidad_continental_desc: "Apre il vertice e rende disponibili i preparativi della Responsabilità Continentale. Il patto deve ancora essere scelto."
 ARG_rise_el_compromiso_de_buenos_aires: "L'Impegno di Buenos Aires"
 ARG_rise_el_compromiso_de_buenos_aires_desc: "Trasforma il patto scelto in un impegno pubblico. La sua consegna finale resta una decisione operativa separata."
 ARG_rise_audit_continental_capacity: "Audit della Capacità Continentale"
 ARG_rise_audit_continental_capacity_desc: "Stabilisce una valutazione comune dei nuovi obblighi continentali della Repubblica prima dei preparativi del vertice."
 ARG_rise_secure_continental_supply_chain: "Proteggere la Catena di Rifornimento"
 ARG_rise_secure_continental_supply_chain_desc: "Finanzia un concreto miglioramento logistico settentrionale dopo aver completato il pilastro della Rete Continentale."
 ARG_rise_protect_energy_resilience: "Proteggere la Resilienza Energetica"
 ARG_rise_protect_energy_resilience_desc: "Finanzia un'ulteriore installazione elettrica resiliente dopo aver completato il pilastro dell'Energia dell'Unione."
 ARG_rise_regional_reassurance_mission: "Missione di Rassicurazione Regionale"
 ARG_rise_regional_reassurance_mission_desc: "Destina risorse a rassicurare le regioni governate da Buenos Aires dopo aver completato il pilastro amministrativo."
 ARG_rise_strategic_risk_review: "Revisione dei Rischi Strategici"
 ARG_rise_strategic_risk_review_desc: "Rivede i rischi continentali e trasforma il pilastro della sicurezza in capacità politica immediata."
 ARG_rise_prepare_responsibility_summit: "Preparare il Vertice Continentale"
 ARG_rise_prepare_responsibility_summit_desc: "Investe capitale politico e risorse del Tesoro per trasformare il vertice aperto in un negoziato operativo."
 ARG_rise_choose_supply_compact: "Patto Continentale di Fornitura"
 ARG_rise_choose_supply_compact_desc: "Privilegia una fornitura continentale affidabile. Richiede i pilastri della Rete e dell'Energia."
 ARG_rise_choose_connectivity_compact: "Patto Continentale di Connettività"
 ARG_rise_choose_connectivity_compact_desc: "Privilegia i collegamenti tra le regioni della Repubblica. Richiede i pilastri della Rete e dell'Amministrazione."
 ARG_rise_choose_stability_compact: "Patto Continentale di Stabilità"
 ARG_rise_choose_stability_compact_desc: "Privilegia la sicurezza responsabile e la fiducia interna. Richiede i pilastri della Sicurezza e dell'Amministrazione."
 ARG_rise_deliver_continental_compact: "Realizzare l'Impegno Continentale"
 ARG_rise_deliver_continental_compact_desc: "Realizza l'impegno pubblico scelto al vertice. Il risultato dipende dal patto selezionato, mentre un pilastro incompleto aumenta il costo o mette sotto pressione la stabilità interna."
