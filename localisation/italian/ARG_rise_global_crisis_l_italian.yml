 ARG_rise_opinion_arg_detente_eastern_desc: "L'Argentina offre moderazione dopo la vittoria continentale."
 ARG_rise_opinion_usa_containment: "Contenimento statunitense"
 ARG_rise_opinion_usa_containment_desc: "Washington ha scelto di contenere l'influenza argentina."
 ARG_rise_opinion_usa_prudence: "Prudenza armata statunitense"
 ARG_rise_opinion_usa_prudence_desc: "Washington resta cauta davanti all'ascesa argentina."
 ARG_rise_opinion_usa_pragmatism: "Pragmatismo statunitense"
 ARG_rise_opinion_usa_pragmatism_desc: "Washington cerca una relazione pragmatica con l'Argentina."
 ARG_rise_opinion_sov_opening: "Apertura strategica russa"
 ARG_rise_opinion_sov_opening_desc: "Mosca vede un'apertura nell'ascesa argentina."
 ARG_rise_opinion_sov_caution: "Cautela russa"
 ARG_rise_opinion_sov_caution_desc: "Mosca osserva attentamente l'Argentina."
 ARG_rise_opinion_sov_deferral: "Rinvio russo"
 ARG_rise_opinion_sov_deferral_desc: "Mosca ha rinviato una risposta piu ravvicinata."
 ARG_rise_opinion_chi_partnership: "Partnership strategica cinese"
 ARG_rise_opinion_chi_partnership_desc: "Pechino considera l'Argentina un possibile partner."
 ARG_rise_opinion_chi_observation: "Osservazione cinese"
 ARG_rise_opinion_chi_observation_desc: "Pechino osserva l'ascesa argentina."
 ARG_rise_opinion_chi_distance: "Distanza strategica cinese"
 ARG_rise_opinion_chi_distance_desc: "Pechino ha scelto una distanza prudente."
 ARG_rise_opinion_eu_atlantic_condemnation: "Condanna atlantica europea"
 ARG_rise_opinion_eu_atlantic_condemnation_desc: "I governi europei condannano la linea argentina."
 ARG_rise_opinion_eu_caution: "Cautela diplomatica europea"
 ARG_rise_opinion_eu_caution_desc: "I governi europei procedono con cautela."
 ARG_rise_opinion_eu_pragmatism: "Pragmatismo commerciale europeo"
 ARG_rise_opinion_eu_pragmatism_desc: "I governi europei cercano un rapporto pragmatico con l'Argentina."
 ARG_rise.100.t: "La Notte di New York"
 ARG_rise.100.d: "Il Consiglio di Sicurezza si riunisce d'urgenza. L'Argentina parla per ultima e chiede soltanto la maturità di convivere con una realtà cambiata."
 ARG_rise.100.a: "Che anche il silenzio sia una risposta."
 ARG_rise.101.t: "Dispaccio da New York"
 ARG_rise.101.d: "Washington ha parlato. Buenos Aires deve trasformare il controllo internazionale in responsabilità."
 ARG_rise.101.a: "Il mondo risponderà a suo tempo."
 ARG_rise.102.t: "La Prova della Repubblica"
 ARG_rise.102.d: "L'Argentina ha mantenuto il proprio impegno continentale. Il mondo giudica ora i fatti."
 ARG_rise.102.a: "La responsabilità è stata mantenuta."
 ARG_rise.103.t: "La Mappa che Abbiamo Fatto"
 ARG_rise.103.d: "L'Argentina ha iniziato a costruire una mappa politica all'altezza della sua scala continentale."
 ARG_rise.103.a: "Si apre un nuovo orizzonte."
 ARG_rise_continental_responsibility_decisions: "Responsabilità Continentale"
 ARG_rise_continental_responsibility_decisions_desc: "L'Argentina deve dimostrare di poter governare, rifornire e proteggere responsabilmente una scala continentale."
 ARG_rise_post_mexico_crisis_resolved: "La Prima Crisi Internazionale È Terminata"
