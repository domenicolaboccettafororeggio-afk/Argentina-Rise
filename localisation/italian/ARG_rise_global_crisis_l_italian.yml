 ARG_rise_opinion_arg_multipolar_eu: "Postura multipolare argentina"
 ARG_rise_opinion_arg_multipolar_eu_desc: "La nuova postura argentina inquieta le capitali europee."
 ARG_rise_opinion_arg_autonomy_usa: "Autonomia strategica argentina"
 ARG_rise_opinion_arg_autonomy_usa_desc: "L'Argentina ha dichiarato un percorso indipendente."
 ARG_rise_opinion_arg_detente_usa: "Offerta argentina di distensione"
 ARG_rise_opinion_arg_detente_usa_desc: "L'Argentina offre moderazione dopo la vittoria continentale."
