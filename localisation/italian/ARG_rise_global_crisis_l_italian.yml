l_italian:
 ARG_rise.93.t: "Dopo il Messico: una nuova realta"
 ARG_rise.93.d: "L'integrazione del Messico ha chiuso una guerra continentale e cambiato gli equilibri dell'emisfero. L'Argentina deve decidere come il mondo incontrera la sua nuova potenza."
 ARG_rise.93.a: "Occorre costruire un ordine multipolare."
 ARG_rise.93.b: "L'Argentina camminera con le proprie gambe."
 ARG_rise.93.c: "Offrire moderazione e cercare una nuova distensione."
 ARG_rise.94.t: "Il mondo prende atto"
 ARG_rise.94.d: "La campagna messicana e finita. In ogni capitale emerge la stessa domanda: quale posto reclamerebbe un'Argentina ampliata?"
 ARG_rise.94.a: "La vecchia mappa non risponde piu."
 ARG_rise.95.t: "Washington riesamina l'emisfero"
 ARG_rise.95.d: "La Casa Bianca affronta un fatto strategico che non ha scelto. L'Argentina ha mutato l'equilibrio delle Americhe."
 ARG_rise.95.a: "L'emisfero entra in un nuovo capitolo."
 ARG_rise.96.t: "Mosca studia la potenza del sud"
 ARG_rise.96.d: "A Mosca, la crescita argentina richiede una risposta paziente."
 ARG_rise.96.a: "L'equilibrio sta cambiando."
 ARG_rise.97.t: "Pechino osserva il nuovo continente"
 ARG_rise.97.d: "Pechino osserva una potenza continentale oltre gli allineamenti consueti."
 ARG_rise.97.a: "Osservare la nuova realta."
 ARG_rise.98.t: "L'Europa misura la distanza"
 ARG_rise.98.d: "L'Europa riconosce che il consolidamento argentino richiede una risposta ponderata."
 ARG_rise.98.a: "L'Atlantico non e piu una certezza."
 ARG_rise.99.t: "Un nuovo posto al tavolo"
 ARG_rise.99.d: "L'Argentina ha costretto il mondo a riconoscere una realta che non puo ignorare."
 ARG_rise.99.a: "Il prossimo capitolo appartiene all'Argentina."
