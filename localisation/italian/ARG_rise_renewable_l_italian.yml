 ARG_rise_nuevo_sol_levante_renewable_spirit:0 "Il Soffio del Nuovo Sole"
 ARG_rise_nuevo_sol_levante_renewable_spirit_desc:0 "Il sistema argentino di energia rinnovabile diventa un fondamento permanente dell indipendenza nazionale e della rinascita industriale."
 ARG_rise.92.t:0 "Il Soffio del Nuovo Sole"
 ARG_rise.92.d:0 "Una nuova era sorge sull Argentina. Il vento che attraversa le pampas, il sole che incorona gli orizzonti e le forze della natura un tempo indomite rispondono ora alla tecnica argentina. Dalla polvere delle difficolta, la nazione torna a sollevarsi, sostenuta da un indipendenza energetica degna del suo futuro industriale. Un soffio quasi divino percorre i nuovi complessi e innalza il paese verso un eta piu luminosa."
 ARG_rise.92.a:0 "Che il soffio divino sollevi la nazione."
