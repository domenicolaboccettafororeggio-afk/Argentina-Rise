l_italian:
 ARG_rise_proyeccion_transatlantica:0 "Proiezione Transatlantica"
 ARG_rise_proyeccion_transatlantica_desc:0 "Stabilire la nostra presenza oltre il nostro continente natale è un passo vitale per la nostra crescente statura globale. Guarderemo all'Africa occidentale come nostra porta d'accesso."
 ARG_rise_proyeccion_transatlantica_tt:0 "Sblocca le decisioni sulle Acquisizioni Strategiche Africane."
 ARG_rise_african_strategic_acquisitions:0 "Acquisizioni Strategiche Africane"
 ARG_rise_african_strategic_acquisitions_desc:0 "Per espandere la nostra presenza globale, possiamo acquisire basi navali e punti strategici lungo la costa africana attraverso investimenti finanziari e influenza diplomatica."
 ARG_rise_negotiate_with_angola:0 "Negoziare con l'Angola"
 ARG_rise_negotiate_with_angola_desc:0 "Offre un pacchetto finanziario al governo dell'Angola in cambio del porto strategico di Benguela (Stato 299) e della subordinazione politica."
 ARG_rise.201.t:0 "Offerta preparata per l'Angola"
 ARG_rise.201.d:0 "Siamo pronti ad avviare le trattative con Luanda. Scegli il tipo di offerta da presentare al governo angolano."
 ARG_rise.201.a:0 "Prepara un'Offerta Economica (Costo: 5B Treasury)"
 ARG_rise.201.b:0 "Prepara un Accordo Strategico (Costo: 3B Treasury)"
 ARG_rise.201.c:0 "Prepara un'Offerta Coercitiva (Costo: 1B Treasury)"
 ARG_rise.202.t:0 "Proposta argentina"
 ARG_rise.202.d:0 "La crescente Confederazione Argentina ha avvicinato il nostro governo. Offrono un importante investimento finanziario in cambio del trasferimento del porto di Benguela e della nostra accettazione della tutela politica argentina."
 ARG_rise.202.a:0 "Accetta l'offerta e cedi Benguela."
 ARG_rise.202.b:0 "Rifiuta la proposta."
 ARG_rise.202.c:0 "Proponi una Controproposta (+2B Treasury al costo originale)"
 ARG_rise.203.t:0 "L'Angola accetta la proposta"
 ARG_rise.203.d:0 "Il governo dell'Angola ha accettato i nostri termini. Benguela (Stato 299) è stata trasferita al nostro controllo diretto, e l'Angola è diventata un nostro stato satellite. Questo ci fornisce la nostra prima testa di ponte strategica in Africa."
 ARG_rise.203.a:0 "Un grande successo diplomatico."
 ARG_rise.204.t:0 "L'Angola rifiuta la proposta"
 ARG_rise.204.d:0 "Il governo dell'Angola ha rifiutato nettamente i nostri termini. I nostri fondi rimangono intatti e potremo tentare nuovamente i negoziati in futuro."
 ARG_rise.204.a:0 "Deludente."
 ARG_rise.205.t:0 "Trattative annullate"
 ARG_rise.205.d:0 "Le condizioni geopolitiche sono cambiate durante le trattative, rendendo impossibile finalizzare l'accordo. Nessun fondo è stato trasferito."
 ARG_rise.205.a:0 "Capito."
 ARG_rise.206.t:0 "Controproposta Angolana"
 ARG_rise.206.d:0 "L'Angola ha risposto con una controproposta. Accetteranno i nostri termini solo se pagheremo un costo aggiuntivo di 2 miliardi di dollari per coprire i loro costi di transizione."
 ARG_rise.206.a:0 "Accetta la controproposta e paga il costo maggiorato."
 ARG_rise.206.b:0 "Rifiuta la controproposta."
 ARG_rise_test_force_angola_accept:0 "TEST - Forza Accettazione Angola"
 ARG_rise_test_force_angola_accept_desc:0 "Sovrascrive il prossimo tentativo di negoziato per garantire l'accettazione dell'Angola."
 ARG_rise_test_force_angola_counteroffer:0 "TEST - Forza Controproposta Angola"
 ARG_rise_test_force_angola_counteroffer_desc:0 "Sovrascrive il prossimo tentativo di negoziato per garantire la controproposta dell'Angola."
 ARG_rise_test_force_angola_reject:0 "TEST - Forza Rifiuto Angola"
 ARG_rise_test_force_angola_reject_desc:0 "Sovrascrive il prossimo tentativo di negoziato per garantire il rifiuto dell'Angola."
 ARG_rise_african_acquisitions_unlocked:0 "Le proiezioni strategiche transatlantiche sono autorizzate"
 ARG_rise_african_negotiation_in_progress:0 "Le trattative diplomatiche sono in corso"
 ARG_rise_angola_acquisition_completed:0 "Acquisizione strategica dell'Angola completata"
 ARG_rise_angola_acquisition_refused:0 "Acquisizione strategica dell'Angola rifiutata"
