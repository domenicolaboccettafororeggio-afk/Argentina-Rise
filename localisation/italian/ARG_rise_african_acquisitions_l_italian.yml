l_italian:
 ARG_rise_proyeccion_transatlantica:0 "Proiezione Transatlantica"
 ARG_rise_proyeccion_transatlantica_desc:0 "Stabilire la nostra presenza oltre il nostro continente natale è un passo vitale per la nostra crescente statura globale. Guarderemo all'Africa occidentale come nostra porta d'accesso."
 ARG_rise_proyeccion_transatlantica_tt:0 "Sblocca le decisioni sulle Acquisizioni Strategiche Africane."
 ARG_rise_african_strategic_acquisitions:0 "Acquisizioni Strategiche Africane"
 ARG_rise_african_strategic_acquisitions_desc:0 "Per espandere la nostra presenza globale, possiamo acquisire basi navali e punti strategici lungo la costa africana attraverso investimenti finanziari e influenza diplomatica."
 ARG_rise_search_african_candidate:0 "Cerca un Candidato Africano"
 ARG_rise_search_african_candidate_desc:0 "Cerca una nazione costiera idonea in Africa occidentale, orientale o meridionale per stabilire una base di proiezione strategica."
 ARG_rise_negotiate_with_candidate:0 "Negozia con il Candidato"
 ARG_rise_negotiate_with_candidate_desc:0 "Offre un pacchetto finanziario al candidato selezionato in cambio di una regione portuale strategica e della subordinazione politica."
 ARG_rise.201.t:0 "Trattative Aperte"
 ARG_rise.201.d:0 "Siamo pronti ad avviare le trattative con [event_target:ARG_rise_african_candidate_country.GetName]. Scegli il tipo di offerta da presentare al loro governo."
 ARG_rise.201.a:0 "Prepara un'Offerta Economica (Costo: 5B Treasury)"
 ARG_rise.201.b:0 "Prepara un Accordo Strategico (Costo: 3B Treasury)"
 ARG_rise.201.c:0 "Prepara un'Offerta Coercitiva (Costo: 1B Treasury)"
 ARG_rise.202.t:0 "Proposta argentina"
 ARG_rise.202.d:0 "La crescente Confederazione Argentina ha avvicinato il nostro governo. Offrono un importante investimento finanziario in cambio del trasferimento del nostro porto costiero strategico e della nostra accettazione della tutela politica argentina."
 ARG_rise.202.a:0 "Accetta l'offerta e cedi il nostro porto costiero."
 ARG_rise.202.b:0 "Rifiuta la proposta."
 ARG_rise.202.c:0 "Proponi una Controproposta (+2B Treasury al costo originale)"
 ARG_rise.203.t:0 "Il Candidato Accetta la Proposta"
 ARG_rise.203.d:0 "Il governo del candidato ha accettato i nostri termini. Il loro porto costiero strategico è stato trasferito al nostro controllo diretto e sono diventati un nostro stato satellite."
 ARG_rise.203.a:0 "Un grande successo diplomatico."
 ARG_rise.204.t:0 "Il Candidato Rifiuta la Proposta"
 ARG_rise.204.d:0 "Il governo del candidato ha rifiutato nettamente i nostri termini. I nostri fondi rimangono intatti e potremo tentare nuovamente i negoziati in futuro."
 ARG_rise.204.a:0 "Deludente."
 ARG_rise.205.t:0 "Trattative annullate"
 ARG_rise.205.d:0 "Le condizioni geopolitiche sono cambiate durante le trattative, rendendo impossibile finalizzare l'accordo. Nessun fondo è stato trasferito."
 ARG_rise.205.a:0 "Capito."
 ARG_rise.206.t:0 "Controproposta del Candidato"
 ARG_rise.206.d:0 "Il candidato ha risposto con una controproposta. Accetteranno i nostri termini solo se pagheremo un costo aggiuntivo di 2 miliardi di dollari per coprire i loro costi di transizione."
 ARG_rise.206.a:0 "Accetta la controproposta e paga il costo maggiorato."
 ARG_rise.206.b:0 "Rifiuta la controproposta."
 ARG_rise.207.t:0 "Candidato Africano Identificato"
 ARG_rise.207.d:0 "La nostra intelligence e il corpo diplomatico hanno identificato un candidato potenziale per la nostra Proiezione Transatlantica: [event_target:ARG_rise_african_candidate_country.GetName]. Negoziando con il loro governo, possiamo acquisire la loro regione costiera strategica e assicurarci un'importante testa di ponte in Africa."
 ARG_rise.207.a:0 "Approva il candidato e avvia i preparativi."
 ARG_rise.207.b:0 "Scarta il candidato e continua a cercare."
 ARG_rise_test_force_candidate_accept:0 "TEST - Forza Accettazione Candidato"
 ARG_rise_test_force_candidate_accept_desc:0 "Sovrascrive il prossimo tentativo di negoziato per garantire l'accettazione del candidato selezionato."
 ARG_rise_test_force_candidate_counteroffer:0 "TEST - Forza Controproposta Candidato"
 ARG_rise_test_force_candidate_counteroffer_desc:0 "Sovrascrive il prossimo tentativo di negoziato per garantire la controproposta del candidato selezionato."
 ARG_rise_test_force_candidate_reject:0 "TEST - Forza Rifiuto Candidato"
 ARG_rise_test_force_candidate_reject_desc:0 "Sovrascrive il prossimo tentativo di negoziato per garantire il rifiuto del candidato selezionato."
 ARG_rise_test_reset_candidate:0 "TEST - Resetta Selezione"
 ARG_rise_test_reset_candidate_desc:0 "Azzera tutti i candidati selezionati, le trattative attive, i cooldown e le sovrascritture per ricominciare da capo."
 ARG_rise_african_acquisitions_unlocked:0 "Le proiezioni strategiche transatlantiche sono autorizzate"
 ARG_rise_african_negotiation_in_progress:0 "Le trattative diplomatiche sono in corso"
 ARG_rise_angola_acquisition_completed:0 "Acquisizione strategica dell'Angola completata"
 ARG_rise_angola_acquisition_refused:0 "Acquisizione strategica dell'Angola rifiutata"
